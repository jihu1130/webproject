name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 로컬 개발과 동일하게 MySQL 8 위에서 빌드+테스트한다 - application.yml이 gitignore
    # 대상이라 CI에는 아예 없으므로, 아래 스텝에서 이 서비스에 붙는 CI 전용 설정을 직접 만든다.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: webschool
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 실제 application.yml은 절대 커밋되지 않으므로(DB 비밀번호/NEIS 키/구글·SMTP
      # 시크릿 포함), CI에서만 쓰는 더미 설정을 여기서 생성한다. neis.api.key는 컨텍스트
      # 기동 시 값 존재만 필요하고 실제 NEIS 호출은 테스트에서 하지 않는다. 구글 OAuth/
      # SMTP 블록은 비워둔다 - 둘 다 없어도 앱이 정상 기동하도록 이미 설계돼 있다.
      - name: Create CI application.yml
        run: |
          cat > src/main/resources/application.yml <<'EOF'
          spring:
            application:
              name: webschool
            datasource:
              driver-class-name: com.mysql.cj.jdbc.Driver
              url: jdbc:mysql://127.0.0.1:3306/webschool?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
              username: root
              password: root
            jpa:
              hibernate:
                ddl-auto: update
              show-sql: false
              database-platform: org.hibernate.dialect.MySQLDialect
            servlet:
              multipart:
                max-file-size: 300MB
                max-request-size: 320MB
          server:
            port: 8888
          management:
            endpoints:
              web:
                exposure:
                  include: health,info,prometheus
          logging:
            level:
              root: INFO
          neis:
            api:
              key: ci-dummy-key
          jwt:
            secret: ci-dummy-jwt-secret-at-least-32-bytes-long
          app:
            upload:
              dir: ../uploads
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      # Dockerfile이 매 커밋마다 실제로 빌드되는지만 확인(레지스트리 push는 안 함,
      # 자격증명이 필요 없어 안전) - Docker 이미지로 아직 배포하지 않지만 Dockerfile이
      # 조용히 깨지는 걸 미리 잡기 위함(todo.md #24 Docker 도입 1단계).
      - name: Verify Docker image builds
        run: docker build -t webschool:ci .

      # docker-compose.yml 자체를 실제로 띄우진 않고 파싱/참조만 검증(컨테이너 기동 없이
      # 수 초 안에 끝남) - 로컬에 Docker Desktop이 없는 환경에서 이 파일을 수정했을 때도
      # CI가 YAML 문법/서비스 참조 오류를 잡아준다. env 값은 실제로 아무것도 기동하지
      # 않으므로 더미로 충분.
      - name: Validate docker-compose.yml
        env:
          MYSQL_ROOT_PASSWORD: ci-dummy-password
          NEIS_API_KEY: ci-dummy-key
          JWT_SECRET: ci-dummy-jwt-secret-at-least-32-bytes-long
        run: docker compose config -q

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config -q

  # 5단계(CD) - build 잡이 성공한 뒤 main 브랜치 푸시에서만 실행. AWS 인증은 장기
  # 액세스 키를 GitHub Secrets에 저장하지 않고 OIDC로 임시 자격증명을 발급받는
  # 방식(webschool-github-actions-deploy 역할, main 브랜치 푸시에서만 assume 가능
  # 하도록 신뢰 정책에 고정 - AWS.md "5단계 체크리스트" 참고).
  #
  # 2026-09-16 Docker 기반 배포로 전환(todo.md #24 2단계) - "jar를 S3에 올리고
  # systemctl restart"에서 "이미지를 ECR에 push하고 EC2에서 docker compose pull+up"
  # 으로 교체. 운영 DB는 아직 베어메탈 MySQL이라(2단계 DB 컷오버는 별도 작업) app
  # 컨테이너만 교체하고 host 네트워크로 기존 localhost:3306에 그대로 접속한다
  # (docker-compose.prod.yml 참고). 기존 systemd 서비스(webschool.service)는
  # 컨테이너 전환 시점에 비활성화하고 이 워크플로우와 무관하게 서버에 남겨둔다
  # (롤백 대비 - 문제 생기면 컨테이너 중지 후 systemctl start webschool로 즉시
  # 복귀 가능).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      INSTANCE_ID: i-0992a58038aca44da
      ECR_REPO: 938436186735.dkr.ecr.ap-northeast-2.amazonaws.com/webschool
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::938436186735:role/webschool-github-actions-deploy
          aws-region: ap-northeast-2

      # 인스턴스가 정지 상태면(비용 절감을 위해 평소엔 꺼둠) SSM 명령이 실패하니,
      # 매 푸시마다 CI가 빨갛게 뜨는 걸 막기 위해 여기서 건너뛴다 - 실패가 아니라
      # "지금은 배포 안 함"으로 취급.
      - name: Check instance is running
        id: instance
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "인스턴스 상태: $STATE"

      - name: Log in to ECR
        if: steps.instance.outputs.state == 'running'
        run: aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "$ECR_REPO"

      # sha 태그는 롤백/추적용으로 남기고, latest를 실제 배포 대상으로 쓴다
      # (서버 스크립트가 매번 태그를 새로 알 필요 없이 항상 latest만 pull).
      - name: Build and push image
        if: steps.instance.outputs.state == 'running'
        run: |
          docker build -t "$ECR_REPO:${{ github.sha }}" -t "$ECR_REPO:latest" .
          docker push "$ECR_REPO:${{ github.sha }}"
          docker push "$ECR_REPO:latest"

      - name: Deploy via SSM
        if: steps.instance.outputs.state == 'running'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 938436186735.dkr.ecr.ap-northeast-2.amazonaws.com","docker compose -f /opt/webschool/docker-compose.prod.yml pull","docker compose -f /opt/webschool/docker-compose.prod.yml up -d"]' \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then break; fi
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "배포 명령 실패 (status=$STATUS)"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
            exit 1
          fi

      - name: Health check
        if: steps.instance.outputs.state == 'running'
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://webschool.kro.kr/actuator/health --max-time 5 || echo "000")
            echo "health check attempt $i: $CODE"
            if [ "$CODE" == "200" ]; then exit 0; fi
            sleep 5
          done
          echo "배포 후 헬스체크 실패"
          exit 1
