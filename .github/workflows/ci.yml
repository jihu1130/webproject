name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 로컬 개발과 동일하게 MySQL 8 위에서 빌드+테스트한다 - application.yml이 gitignore
    # 대상이라 CI에는 아예 없으므로, 아래 스텝에서 이 서비스에 붙는 CI 전용 설정을 직접 만든다.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: webschool
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 실제 application.yml은 절대 커밋되지 않으므로(DB 비밀번호/NEIS 키/구글·SMTP
      # 시크릿 포함), CI에서만 쓰는 더미 설정을 여기서 생성한다. neis.api.key는 컨텍스트
      # 기동 시 값 존재만 필요하고 실제 NEIS 호출은 테스트에서 하지 않는다. 구글 OAuth/
      # SMTP 블록은 비워둔다 - 둘 다 없어도 앱이 정상 기동하도록 이미 설계돼 있다.
      - name: Create CI application.yml
        run: |
          cat > src/main/resources/application.yml <<'EOF'
          spring:
            application:
              name: webschool
            datasource:
              driver-class-name: com.mysql.cj.jdbc.Driver
              url: jdbc:mysql://127.0.0.1:3306/webschool?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
              username: root
              password: root
            jpa:
              hibernate:
                ddl-auto: update
              show-sql: false
              database-platform: org.hibernate.dialect.MySQLDialect
            servlet:
              multipart:
                max-file-size: 300MB
                max-request-size: 320MB
          server:
            port: 8888
          logging:
            level:
              root: INFO
          neis:
            api:
              key: ci-dummy-key
          app:
            upload:
              dir: ../uploads
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      # 이 잡이 빌드한 jar를 뒤이은 deploy 잡이 그대로 쓴다(같은 jar를 재빌드하지
      # 않고 그대로 배포해 빌드-배포 산출물 불일치를 방지).
      - name: Upload jar artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: webschool-jar
          path: build/libs/webschool-0.0.1-SNAPSHOT.jar
          retention-days: 1

  # 5단계(CD) - build 잡이 성공한 뒤 main 브랜치 푸시에서만 실행. AWS 인증은 장기
  # 액세스 키를 GitHub Secrets에 저장하지 않고 OIDC로 임시 자격증명을 발급받는
  # 방식(webschool-github-actions-deploy 역할, main 브랜치 푸시에서만 assume 가능
  # 하도록 신뢰 정책에 고정 - AWS.md "5단계 체크리스트" 참고). 배포 절차 자체는
  # 지금까지 수동으로 하던 것과 동일: jar를 S3에 올리고, SSM으로 서버가 그 jar를
  # 받아 재시작하게 시킨다(SSH 없이 SSM만 쓰는 이 프로젝트 원칙과 일치).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      INSTANCE_ID: i-0992a58038aca44da
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: webschool-jar
          path: build/libs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::938436186735:role/webschool-github-actions-deploy
          aws-region: ap-northeast-2

      # 인스턴스가 정지 상태면(비용 절감을 위해 평소엔 꺼둠) SSM 명령이 실패하니,
      # 매 푸시마다 CI가 빨갛게 뜨는 걸 막기 위해 여기서 건너뛴다 - 실패가 아니라
      # "지금은 배포 안 함"으로 취급.
      - name: Check instance is running
        id: instance
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "인스턴스 상태: $STATE"

      - name: Upload jar to S3
        if: steps.instance.outputs.state == 'running'
        run: aws s3 cp build/libs/webschool-0.0.1-SNAPSHOT.jar s3://webschool-deploy-938436186735/webschool.jar

      - name: Deploy via SSM
        if: steps.instance.outputs.state == 'running'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo aws s3 cp s3://webschool-deploy-938436186735/webschool.jar /opt/webschool/webschool.jar","sudo systemctl restart webschool"]' \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" != "InProgress" ] && [ "$STATUS" != "Pending" ]; then break; fi
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "배포 명령 실패 (status=$STATUS)"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
            exit 1
          fi

      - name: Health check
        if: steps.instance.outputs.state == 'running'
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://webschool.kro.kr/actuator/health --max-time 5 || echo "000")
            echo "health check attempt $i: $CODE"
            if [ "$CODE" == "200" ]; then exit 0; fi
            sleep 5
          done
          echo "배포 후 헬스체크 실패"
          exit 1
