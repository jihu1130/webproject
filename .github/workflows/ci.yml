name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # 로컬 개발과 동일하게 MySQL 8 위에서 빌드+테스트한다 - application.yml이 gitignore
    # 대상이라 CI에는 아예 없으므로, 아래 스텝에서 이 서비스에 붙는 CI 전용 설정을 직접 만든다.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: webschool
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 실제 application.yml은 절대 커밋되지 않으므로(DB 비밀번호/NEIS 키/구글·SMTP
      # 시크릿 포함), CI에서만 쓰는 더미 설정을 여기서 생성한다. neis.api.key는 컨텍스트
      # 기동 시 값 존재만 필요하고 실제 NEIS 호출은 테스트에서 하지 않는다. 구글 OAuth/
      # SMTP 블록은 비워둔다 - 둘 다 없어도 앱이 정상 기동하도록 이미 설계돼 있다.
      - name: Create CI application.yml
        run: |
          cat > src/main/resources/application.yml <<'EOF'
          spring:
            application:
              name: webschool
            datasource:
              driver-class-name: com.mysql.cj.jdbc.Driver
              url: jdbc:mysql://127.0.0.1:3306/webschool?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
              username: root
              password: root
            jpa:
              hibernate:
                ddl-auto: update
              show-sql: false
              database-platform: org.hibernate.dialect.MySQLDialect
            servlet:
              multipart:
                max-file-size: 300MB
                max-request-size: 320MB
          server:
            port: 8888
          logging:
            level:
              root: INFO
          neis:
            api:
              key: ci-dummy-key
          app:
            upload:
              dir: ../uploads
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain
