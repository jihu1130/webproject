# 운영 서버(EC2) 전용 - todo.md #24 "Docker 도입 2단계". 로컬 docker-compose.yml과
# 별개 파일인 이유: app 컨테이너가 host 네트워크로 localhost:3306에 접속하는 구조라
# (2026-09-16 앱 전환 당시 DB가 베어메탈 MySQL이었던 것을 그대로 유지하기 위함)
# 로컬 compose(브리지 네트워크, db 서비스명으로 접속)와 접속 방식이 다르다.
#
# 시크릿 관리 - app은 .env/docker profile을 쓰지 않고 기존 /opt/webschool/application.yml을
# 그대로 bind mount한다(read-only). 이유: 이 파일에 이미 운영 DB 비밀번호/NEIS 키/
# jwt.secret/구글 OAuth/SMTP 자격증명이 전부 들어있고(지금까지 베어메탈 jar가 써온
# 바로 그 파일), Spring Boot가 작업 디렉터리(WORKDIR /app)의 application.yml을
# classpath 설정보다 높은 우선순위로 자동으로 읽으므로 별도 프로파일/환경변수
# 재입력 없이 기존 설정을 그대로 재사용할 수 있다 - 전환 중 실수로 시크릿을
# 잘못 옮겨적을 위험 자체를 없앤다(오늘 jwt.secret 관련 장애 참고, 같은 실수를
# 반복하지 않기 위한 설계).
#
# 이 파일은 서버의 /opt/webschool/docker-compose.prod.yml과 같은 내용으로 유지한다 -
# CI 배포는 서버 쪽 파일을 쓰므로 이 파일을 고쳐도 서버에 자동 반영되지 않는다
# (바꿀 땐 서버 파일도 SSM으로 직접 교체할 것).
services:
  app:
    image: 938436186735.dkr.ecr.ap-northeast-2.amazonaws.com/webschool:latest
    restart: unless-stopped
    network_mode: "host"
    # 업로드 파일은 운영에서 이미 S3(app.upload.s3.bucket)를 쓰므로 로컬 디스크
    # 볼륨 마운트 불필요(FileUploadService가 s3.bucket 값이 있으면 S3를 우선 사용).
    volumes:
      - /opt/webschool/application.yml:/app/application.yml:ro
      - /opt/webschool/logs:/app/logs
    environment:
      # 운영 application.yml은 management 노출이 health,info뿐이라 Prometheus가 수집할
      # /actuator/prometheus를 여기서 연다 - Spring은 환경변수가 설정 파일보다 우선이라
      # 운영 application.yml(시크릿 포함, SSM으로 고치다 장애 난 이력)을 안 건드려도 된다.
      # 외부에선 nginx가 이 경로를 404로 막고, prometheus만 127.0.0.1로 직접 수집한다.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus

  # 운영 DB 컨테이너 (2026-09-27 호스트 mysqld 8.0.46에서 컷오버, AWS.md 8단계 3번).
  # 호스트 mysqld와 같은 127.0.0.1:3306 + 같은 root 비밀번호(서버의 /opt/webschool/.env,
  # 권한 600, git 추적 안 함)라서 app(host 네트워크)의 application.yml 접속 정보는
  # 그대로다. app에 depends_on을 일부러 안 넣음 - 롤백(컨테이너 내리고 호스트 mysqld
  # 다시 켜기) 때 app만 따로 띄울 수 있어야 해서.
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: webschool
      TZ: UTC
    # t3.micro(1GB) 메모리 절약 - 호스트 my.cnf엔 튜닝 값이 없었음(기본 buffer pool 128M)
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -uroot -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 운영 모니터링 (2026-09-28, t3.small로 올린 뒤 배포). 둘 다 host 네트워크 + 127.0.0.1에만
  # 바인딩해서 외부에 포트를 열지 않는다. Grafana만 nginx가 /grafana/로 프록시해 공개하고
  # (로그인 필수, 가입/익명 불가), Prometheus UI는 공개하지 않는다(필요하면 SSM 포트포워딩).
  # 설정 파일은 서버의 /opt/webschool/monitoring/에 레포의 monitoring/*.prod.yml,
  # grafana-dashboards.yml, dashboards/를 복사해 둔 것을 마운트한다.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    network_mode: "host"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - /opt/webschool/monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 300m

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    network_mode: "host"
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_DOMAIN: webschool.kro.kr
      GF_SERVER_ROOT_URL: https://webschool.kro.kr/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # 관리자 비밀번호는 서버 .env(권한 600)에만 있다 - 최초 기동 때만 적용되고, 이후엔
      # grafana-data 볼륨의 DB 값이 우선(바꾸려면 Grafana 화면이나 grafana-cli로).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - /opt/webschool/monitoring/grafana-datasource.prod.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - /opt/webschool/monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - /opt/webschool/monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 300m

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
