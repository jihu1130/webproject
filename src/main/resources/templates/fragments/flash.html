<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 버그수정 프롬포트 요청 - 이 코드베이스에 flash 메시지 컨벤션이 아예 없어서, 실패한 조치가
     redirect: 뒤에서는 조용히 사라졌다(PostController의 detail/edit/delete 등). 컨트롤러가
     RedirectAttributes.addFlashAttribute("flashError"/"flashSuccess", ...)로 채워두면
     Spring이 다음 요청의 Model에 자동으로 옮겨준다 - 이 조각을 그 값이 있을 때만 렌더링되는
     화면 어디에나 넣을 수 있는 공용 배너로 쓴다(Bootstrap alert, 어느 페이지가 로드하든
     bootstrap.min.css는 commonHead로 항상 로드되므로 별도 인라인 대체 스타일이 필요 없다). -->
<div th:fragment="flash">
    <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show container mt-3" role="alert">
        <span th:text="${flashError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
    </div>
    <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show container mt-3" role="alert">
        <span th:text="${flashSuccess}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
    </div>
</div>

</body>
</html>
