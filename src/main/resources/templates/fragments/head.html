<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<!--/* 모든 페이지가 동일하게 불러오던 CDN/공용 CSS 블록을 여기 하나로 모았다.
     페이지별 <head>는 charset/viewport/title/CSRF meta(필요한 페이지만)를 직접 쓰고,
     그 다음 이 프래그먼트를 넣은 뒤, 마지막에 자기 페이지 전용 css(post.css 등)를
     추가로 불러오면 된다. Bootstrap 5.3은 bootstrap-theme.css로 브랜드 색을
     재매핑한 뒤 theme.css를 그 다음에 불러온다(theme.css 자체 주석 - "이 파일을
     가장 먼저 불러온 뒤 각자의 css를 불러와야 한다"는 페이지별 css 기준이며,
     Bootstrap 리셋/브릿지보다 뒤에 와도 무방하다). */-->
<th:block th:fragment="commonHead">
    <!--/* 검색 결과·메신저 링크 미리보기용 메타 태그. 페이지가 따로 정하지 않으면 사이트 공통 문구가 나가고,
         제목을 바꾸고 싶은 페이지는 이 프래그먼트를 th:with="metaTitle=..."(필요하면 metaDescription도)를 건
         th:block으로 감싸면 된다(post/detail.html 참고 - th:replace와 같은 태그에 th:with를 쓰면 적용되지 않는다).
         og:image는 일부러 넣지 않았다: 미리보기 서비스는 SVG를 못 읽는데 로고가 SVG뿐이다 - PNG(권장 1200x630)를
         static/images에 추가하면 그때 넣을 것. og:url도 생략(절대 주소가 필요한데 미리보기는 공유된 주소를 그대로 쓴다). */-->
    <meta name="description" th:content="${metaDescription} ?: '우리 학교 시간표·급식·학사일정을 확인하고 같은 학교 친구들과 이야기하는 커뮤니티'">
    <meta property="og:site_name" content="WebSchool">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" th:content="${metaTitle} ?: 'WebSchool - 우리 학교 일정과 커뮤니티'">
    <meta property="og:description" th:content="${metaDescription} ?: '우리 학교 시간표·급식·학사일정을 확인하고 같은 학교 친구들과 이야기하는 커뮤니티'">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <!--/* CDN 파일에는 integrity(SRI 해시)를 붙인다 - CDN 쪽 파일이 바뀌거나 변조되면 브라우저가 실행하지 않는다
         (CSP는 "어디서 불러오는가"만 제한하고 내용은 확인하지 못한다). **라이브러리 버전을 올리면 해시도 같이
         바꿔야 한다** - 안 바꾸면 그 파일이 통째로 안 불러와지고 콘솔에 "Failed to find a valid digest"가 뜬다.
         해시는 jsDelivr/cdnjs의 파일 목록 API가 알려준다. 회귀 테스트 TemplateCspComplianceTest. */-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
          integrity="sha384-SN6A48CJQjx946+DRb8wsoifC4a8ur9ZS6R+HCTgnBHOKCa6GLXAR3Qn8d1jztxg" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha256-PI8n5gCcz9cQqQXm3PEtDuPG8qx9oFsFctPg0S5zb8g=" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/bootstrap-theme.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
</th:block>

<!--/* 커뮤니티/관리자 공용 스타일 - 2,220줄짜리 post.css 하나였던 것을 영역별 8개 파일로 나눴다(2026-10-07).
     내용은 한 글자도 바꾸지 않고 자르기만 했고, **아래 순서가 원래 파일 안에서의 순서**다 - 뒤 파일이 앞 파일의
     규칙을 덮어쓰는 곳이 있으므로(특히 redesign.css는 body.community 범위로 앞의 것들을 덮어쓴다) 순서를
     바꾸거나 일부만 불러오지 말 것. 화면에서는 예전 post.css 링크 자리에 이 프래그먼트를 넣는다.
       base      레이아웃·목록 헤더·카테고리 탭/배지·검색·툴바·목록·페이지네이션·블라인드 배너
       detail    게시글 상세
       editor    리치 에디터(게시글/한마디 공용), 관리자 위치 안내
       form      작성/수정 폼, 첨부 이미지, 상세 이미지 갤러리
       comment   댓글, QNA 답변 채택
       poll      설문 작성 폼, 설문 결과 위젯
       recommend 추천 게시글(기간 탭·이력·추천 위젯)
       redesign  리디자인 Phase 2 덮어쓰기(body.community) */-->
<th:block th:fragment="postStyles">
    <link rel="stylesheet" th:href="@{/css/post/base.css}">
    <link rel="stylesheet" th:href="@{/css/post/detail.css}">
    <link rel="stylesheet" th:href="@{/css/post/editor.css}">
    <link rel="stylesheet" th:href="@{/css/post/form.css}">
    <link rel="stylesheet" th:href="@{/css/post/comment.css}">
    <link rel="stylesheet" th:href="@{/css/post/poll.css}">
    <link rel="stylesheet" th:href="@{/css/post/recommend.css}">
    <link rel="stylesheet" th:href="@{/css/post/redesign.css}">
</th:block>

<th:block th:fragment="commonScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>
    <script th:src="@{/js/ui-actions.js}"></script>
</th:block>
</head>
<body></body>
</html>
