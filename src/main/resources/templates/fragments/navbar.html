<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<body>

<th:block th:fragment="navbar(active)">
<!-- 다크모드 초기화 - body의 맨 첫 내용으로 동기 실행되어(navbar 프래그먼트가 모든 페이지에서
     body 맨 위에 온다) 페이지가 눈에 보이기 전에 data-theme을 정한다. localStorage에 저장된
     수동 선택이 있으면 그 값을, 없으면 시스템 설정을 따른다. 이 스크립트가 실패하거나
     JS가 꺼져있어도 theme.css의 prefers-color-scheme 분기가 그대로 폴백이 된다. -->
<script>
(function () {
    try {
        var saved = localStorage.getItem('theme');
        var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
})();
</script>
<nav class="navbar navbar-expand-lg navbar-dark site-nav sticky-top">
    <div class="container-fluid site-nav-inner">
        <a href="/" class="navbar-brand"><i class="fa-solid fa-graduation-cap"></i> WebSchool</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavMenu"
                aria-controls="siteNavMenu" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="siteNavMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a href="/" class="nav-link" th:classappend="${active == 'home'} ? ' active'"><i class="fa-solid fa-house me-1"></i>홈</a>
                </li>
                <li class="nav-item">
                    <a href="/school/calendar" class="nav-link" title="학사 &amp; 급식 캘린더" th:classappend="${active == 'calendar'} ? ' active'"><i class="fa-solid fa-calendar-days me-1"></i>캘린더</a>
                </li>
                <li class="nav-item">
                    <a href="/posts" class="nav-link" th:classappend="${active == 'community'} ? ' active'"><i class="fa-solid fa-comments me-1"></i>커뮤니티</a>
                </li>
                <li class="nav-item">
                    <a href="/notices" class="nav-link" th:classappend="${active == 'notices'} ? ' active'"><i class="fa-solid fa-bullhorn me-1"></i>공지</a>
                </li>
                <li class="nav-item" th:if="${loginUser != null and loginUser.hasAnyAdminAccess()}">
                    <a href="/admin" class="nav-link" th:classappend="${active == 'admin'} ? ' active'"><i class="fa-solid fa-user-shield me-1"></i>관리자</a>
                </li>
            </ul>

            <form th:action="@{/search}" method="get" class="d-flex mb-2 mb-lg-0 me-lg-3" role="search">
                <input type="text" name="keyword" class="form-control form-control-sm" placeholder="통합검색" aria-label="통합검색">
                <button type="submit" class="btn btn-sm btn-outline-light ms-1" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>

            <div class="d-flex align-items-center gap-2 mb-2 mb-lg-0 me-lg-3">
                <button type="button" id="themeToggle" class="btn btn-sm btn-outline-light" aria-label="다크모드로 전환" title="다크모드 전환">
                    <i class="fa-solid fa-moon"></i>
                    <span id="themeToggleLabel" class="d-none d-lg-inline">다크모드</span>
                </button>
                <a href="/bug-reports/new" class="btn btn-sm btn-outline-light" title="문의하기">
                    <i class="fa-solid fa-comment-dots"></i> <span class="d-none d-lg-inline">문의하기</span>
                </a>
            </div>

            <div class="d-flex align-items-center gap-2">
                <div class="d-flex align-items-center gap-2" sec:authorize="!isAuthenticated()">
                    <a href="/login" class="btn btn-sm btn-outline-light">로그인</a>
                    <a href="/register" class="btn btn-sm btn-light">회원가입</a>
                </div>
                <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                    <a href="/notifications" class="site-nav-bell" title="알림">
                        <i class="fa-solid fa-bell"></i>
                        <span class="site-nav-bell-badge"
                              th:classappend="${unreadNotificationCount == 0} ? ' is-hidden'"
                              th:text="${unreadNotificationCount > 99} ? '99+' : ${unreadNotificationCount}">0</span>
                    </a>
                    <a href="/mypage" class="site-nav-greeting">
                        <span th:text="${loginUser != null ? loginUser.nickname : '회원'}">회원</span>님 안녕하세요
                    </a>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-light">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
<script th:src="@{/js/dark-mode.js}"></script>
<script th:if="${loginUser != null}" th:src="@{/js/notification.js}"></script>
</th:block>

</body>
</html>
