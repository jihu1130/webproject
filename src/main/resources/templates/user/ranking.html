<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포인트 랭킹 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/profile-card.css}">
    <link rel="stylesheet" th:href="@{/css/ranking.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('mypage')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="page-heading post-page-heading">
            <h1><i class="fa-solid fa-ranking-star"></i> 포인트 랭킹</h1>
            <p class="page-sub">
                출석·활동으로 쌓은 포인트 상위 10명이에요 -
                <a href="/ranking/tiers">티어 안내 보기</a> ·
                <a href="/mypage/points">내 포인트 내역 보기</a>
            </p>
        </div>

        <!-- 사용자 요청 - 로그인한 내가 상위 10명 밖에 있으면 내 순위를 목록 맨 위에 별도 카드로
             고정 표시(10등 이내면 아래 목록에서 ranking-row-me로 이미 강조되므로 여기 안 뜬다,
             RankingController.ranking() 참고). -->
        <div th:if="${myRanking != null}" class="ranking-my-rank">
            <p class="ranking-my-rank-label">내 순위</p>
            <div class="ranking-row ranking-row-me">
                <div class="ranking-rank" th:text="${myRanking.rank}">0</div>
                <div class="profile-card-avatar profile-card-avatar-user ranking-avatar"
                     th:classappend="${myRanking.equippedEffect == 'SPARKLE'} ? ' avatar-effect-sparkle' : (${myRanking.equippedEffect == 'RAINBOW'} ? ' avatar-effect-rainbow' : '')"
                     th:style="${myRanking.equippedAvatarColor != null} ? 'border-color:' + ${myRanking.equippedAvatarColor}">
                    <img th:src="@{${myRanking.profileImageUrl != null} ? ${myRanking.profileImageUrl} : '/images/default-avatar.svg'}" alt="프로필 사진">
                </div>
                <div class="ranking-identity">
                    <div class="ranking-nickname-row">
                        <a th:href="@{'/users/' + ${myRanking.uuid}}" class="ranking-nickname" th:text="${myRanking.nickname}">닉네임</a>
                        <span class="profile-card-stamp profile-card-stamp-tier" th:text="${myRanking.tierLabel}">티어</span>
                        <span class="profile-card-stamp profile-card-stamp-title" th:if="${myRanking.equippedTitle != null}"
                              th:text="${myRanking.equippedTitle}">칭호</span>
                    </div>
                </div>
                <div class="ranking-points"><span th:text="${myRanking.points}">0</span><span class="ranking-points-unit">P</span></div>
            </div>
            <hr class="ranking-my-rank-divider">
        </div>

        <th:block th:if="${#lists.isEmpty(topRanking)}">
            <div th:replace="~{fragments/empty-state :: box('fa-solid fa-ranking-star', '아직 랭킹에 표시할 사용자가 없어요.', null, null)}"></div>
        </th:block>

        <div class="ranking-list" th:unless="${#lists.isEmpty(topRanking)}">
            <div class="ranking-row" th:each="item : ${topRanking}"
                 th:classappend="${loginUser != null and loginUser.uuid == item.uuid} ? ' ranking-row-me'">
                <div class="ranking-rank"
                     th:classappend="${item.rank == 1} ? ' ranking-rank-1' : (${item.rank == 2} ? ' ranking-rank-2' : (${item.rank == 3} ? ' ranking-rank-3' : ''))"
                     th:text="${item.rank}">0</div>

                <div class="profile-card-avatar profile-card-avatar-user ranking-avatar"
                     th:classappend="${item.equippedEffect == 'SPARKLE'} ? ' avatar-effect-sparkle' : (${item.equippedEffect == 'RAINBOW'} ? ' avatar-effect-rainbow' : '')"
                     th:style="${item.equippedAvatarColor != null} ? 'border-color:' + ${item.equippedAvatarColor}">
                    <img th:src="@{${item.profileImageUrl != null} ? ${item.profileImageUrl} : '/images/default-avatar.svg'}" alt="프로필 사진">
                </div>

                <div class="ranking-identity">
                    <div class="ranking-nickname-row">
                        <a th:href="@{'/users/' + ${item.uuid}}" class="ranking-nickname" th:text="${item.nickname}">닉네임</a>
                        <span class="profile-card-stamp profile-card-stamp-tier" th:text="${item.tierLabel}">티어</span>
                        <span class="profile-card-stamp profile-card-stamp-title" th:if="${item.equippedTitle != null}"
                              th:text="${item.equippedTitle}">칭호</span>
                    </div>
                </div>

                <div class="ranking-points"><span th:text="${item.points}">0</span><span class="ranking-points-unit">P</span></div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
