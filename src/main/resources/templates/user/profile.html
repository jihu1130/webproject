<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.nickname + ' 님의 프로필 - WebSchool'}">프로필 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('community')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <a href="/posts" class="post-list-back"><i class="fa-solid fa-arrow-left"></i> 커뮤니티로</a>

        <div class="post-detail-card">
            <h1 class="post-detail-title"><i class="fa-solid fa-user"></i> <span th:text="${profile.nickname}">닉네임</span></h1>
            <p class="profile-bio" th:if="${profile.bio != null and !#strings.isEmpty(profile.bio)}" th:text="${profile.bio}">소개글</p>
            <p class="page-sub" style="margin: 4px 0 0;">이 사람이 작성한 게시글이에요 (익명으로 쓴 글은 포함되지 않아요)</p>
            <!-- 버그수정 프롬포트 요청 - 예전엔 차단 버튼이 게시글/댓글 안에 인라인으로만 있어서
                 그 사람 글을 찾아 들어가야만 차단할 수 있었다. post-detail.js의 blockUser()와
                 동일한 요청/확인 패턴을 그대로 재사용한다(새 서비스 로직 불필요). -->
            <button type="button" id="profileBlockBtn" class="post-author-block-btn" style="margin-top: 0.75rem;"
                    th:if="${loginUser != null and loginUser.id != profile.id}"
                    th:attr="data-target-id=${profile.id},data-nickname=${profile.nickname}">
                <i class="fa-solid fa-ban"></i> 차단
            </button>
        </div>

        <div th:if="${profile.posts.empty}" class="post-empty">아직 작성한 게시글이 없어요.</div>

        <ul class="post-list" th:unless="${profile.posts.empty}">
            <li class="post-list-item" th:each="post : ${profile.posts}">
                <a th:href="@{'/posts/' + ${post.uuid}}" class="post-list-link">
                    <span class="post-category-badge" th:text="${post.categoryLabel}">자유</span>
                    <span class="post-list-title" th:text="${post.title}">제목</span>
                    <span class="post-list-meta">
                        <span class="post-list-date" th:text="${post.createdAt}">날짜</span>
                        <span class="post-list-views"><i class="fa-solid fa-eye"></i> <span th:text="${post.viewCount}">0</span></span>
                    </span>
                </a>
            </li>
        </ul>

        <div class="post-pagination" th:if="${profile.posts.totalPages > 1}">
            <a th:if="${profile.posts.hasPrevious()}" th:href="@{'/users/' + ${profile.id}(page=${profile.posts.number - 1})}" class="post-page-link">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, profile.posts.totalPages - 1)}"
               th:href="@{'/users/' + ${profile.id}(page=${i})}" th:text="${i + 1}"
               th:classappend="${i == profile.posts.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${profile.posts.hasNext()}" th:href="@{'/users/' + ${profile.id}(page=${profile.posts.number + 1})}" class="post-page-link">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/timeago.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        WebSchoolTimeago.applyAll('.post-list-date');

        var blockBtn = document.getElementById('profileBlockBtn');
        if (!blockBtn) return;
        blockBtn.addEventListener('click', function () {
            var targetId = blockBtn.getAttribute('data-target-id');
            var nickname = blockBtn.getAttribute('data-nickname');
            if (!confirm(nickname + '님을 차단하시겠어요? 이 사람은 회원님의 모든 게시글/댓글에 댓글을 달 수 없게 돼요.')) return;
            var daysInput = prompt('차단 기간(일)을 입력하세요. 영구 차단은 비워두고 확인을 누르세요.', '');
            if (daysInput === null) return;
            var days = daysInput.trim() === '' ? '' : parseInt(daysInput, 10);

            var body = 'targetId=' + encodeURIComponent(targetId);
            if (days) body += '&durationDays=' + encodeURIComponent(days);

            fetch('/users/blocks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            })
                .then(function (res) {
                    return res.json().then(function (b) {
                        if (!res.ok) throw new Error(b.error || '차단 처리에 실패했습니다.');
                        return b;
                    });
                })
                .then(function () {
                    alert(nickname + '님을 차단했습니다.');
                })
                .catch(function (err) {
                    alert(err.message || '차단 처리에 실패했습니다.');
                });
        });
    });
</script>
</body>
</html>
