<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${profile.nickname + ' 님의 프로필 - WebSchool'}">프로필 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/profile-card.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('community')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <a href="/posts" class="post-list-back"><i class="fa-solid fa-arrow-left"></i> 커뮤니티로</a>

        <div class="post-detail-card">
            <div class="profile-card-head profile-card-head-center">
                <div class="profile-card-avatar profile-card-avatar-user"
                     th:text="${#strings.isEmpty(profile.nickname)} ? '?' : ${#strings.substring(profile.nickname, 0, 1)}">?</div>
                <div class="profile-card-identity">
                    <h1 class="profile-card-name" th:text="${profile.nickname}">닉네임</h1>
                </div>
            </div>

            <div class="profile-card-stats">
                <div class="profile-card-stat">
                    <strong th:text="${profile.postCount}">0</strong>
                    <span>게시글</span>
                </div>
                <div class="profile-card-stat">
                    <strong th:text="${profile.commentCount}">0</strong>
                    <span>댓글</span>
                </div>
                <div class="profile-card-stat">
                    <strong th:text="${profile.likeCount}">0</strong>
                    <span>받은 좋아요</span>
                </div>
            </div>

            <div class="profile-card-bio-box">
                <div class="profile-card-bio-header" th:text="${profile.nickname} + ' 소개글'">소개글</div>
                <p class="profile-card-bio-text"
                   th:if="${profile.bio != null and !#strings.isEmpty(profile.bio)}" th:text="${profile.bio}">소개글</p>
                <p class="profile-card-bio-text profile-card-bio-empty"
                   th:unless="${profile.bio != null and !#strings.isEmpty(profile.bio)}">아직 작성한 소개글이 없어요.</p>
            </div>

            <p class="page-sub" style="margin: 4px 0 0;">이 사람이 작성한 게시글이에요 (익명으로 쓴 글은 포함되지 않아요)</p>

            <!-- 버그수정 프롬포트 요청 - 예전엔 차단 버튼이 게시글/댓글 안에 인라인으로만 있어서
                 그 사람 글을 찾아 들어가야만 차단할 수 있었다. post-detail.js의 blockUser()와
                 동일한 요청/확인 패턴을 그대로 재사용한다(새 서비스 로직 불필요). 프로필_디자인.md
                 설계 반영 - 자주 쓰는 액션이 아니라 카드 우측 상단으로 톤을 낮춰 배치(데스크톱은
                 position:absolute라 DOM 순서와 무관하지만, 모바일은 position:static으로 바뀌므로
                 DOM 순서가 그대로 노출된다 - 카드 맨 끝에 둬야 모바일에서도 자연스럽게 마지막에 온다). -->
            <button type="button" id="profileBlockBtn" class="post-author-block-btn profile-card-block-btn"
                    th:if="${loginUser != null and loginUser.id != profile.id}"
                    th:attr="data-target-id=${profile.id},data-nickname=${profile.nickname}">
                <i class="fa-solid fa-ban"></i> 차단
            </button>
        </div>

        <div th:if="${profile.posts.empty}" class="post-empty">아직 작성한 게시글이 없어요.</div>

        <ul class="post-list" th:unless="${profile.posts.empty}">
            <li class="post-list-item" th:each="post : ${profile.posts}">
                <a th:href="@{'/posts/' + ${post.uuid}}" class="post-list-link">
                    <span class="post-category-badge" th:text="${post.categoryLabel}">자유</span>
                    <span class="post-list-title" th:text="${post.title}">제목</span>
                    <span class="post-list-meta">
                        <span class="post-list-date" th:text="${post.createdAt}">날짜</span>
                        <span class="post-list-views"><i class="fa-solid fa-eye"></i> <span th:text="${post.viewCount}">0</span></span>
                    </span>
                </a>
            </li>
        </ul>

        <div class="post-pagination" th:if="${profile.posts.totalPages > 1}">
            <a th:if="${profile.posts.hasPrevious()}" th:href="@{'/users/' + ${profile.id}(page=${profile.posts.number - 1})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, profile.posts.totalPages - 1)}"
               th:href="@{'/users/' + ${profile.id}(page=${i})}" th:text="${i + 1}"
               th:classappend="${i == profile.posts.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${profile.posts.hasNext()}" th:href="@{'/users/' + ${profile.id}(page=${profile.posts.number + 1})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/timeago.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        WebSchoolTimeago.applyAll('.post-list-date');

        var blockBtn = document.getElementById('profileBlockBtn');
        if (!blockBtn) return;
        blockBtn.addEventListener('click', async function () {
            var targetId = blockBtn.getAttribute('data-target-id');
            var nickname = blockBtn.getAttribute('data-nickname');
            var ok = await WebSchoolModal.confirm(
                nickname + '님을 차단하시겠어요? 이 사람은 회원님의 모든 게시글/댓글에 댓글을 달 수 없게 돼요.',
                { danger: true }
            );
            if (!ok) return;
            var daysInput = await WebSchoolModal.prompt(
                '차단 기간(일)을 입력하세요. 영구 차단은 비워두고 확인을 누르세요.',
                { inputPlaceholder: '예: 7 (비워두면 영구 차단)' }
            );
            if (daysInput === null) return;
            var days = daysInput.trim() === '' ? '' : parseInt(daysInput, 10);

            var body = 'targetId=' + encodeURIComponent(targetId);
            if (days) body += '&durationDays=' + encodeURIComponent(days);

            fetch('/users/blocks', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/x-www-form-urlencoded' }, WebSchoolCsrf.headers()),
                body: body
            })
                .then(function (res) {
                    return res.json().then(function (b) {
                        if (!res.ok) throw new Error(b.error || '차단 처리에 실패했습니다.');
                        return b;
                    });
                })
                .then(function () {
                    WebSchoolModal.alert(nickname + '님을 차단했습니다.');
                })
                .catch(function (err) {
                    WebSchoolModal.alert(err.message || '차단 처리에 실패했습니다.');
                });
        });
    });
</script>
</body>
</html>
