<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 설정 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/school-search.css}">
</head>
<body class="auth-body">

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<div class="auth-shell">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h3 class="auth-title"><i class="fa-solid fa-school"></i> 학교를 설정해주세요</h3>
            <p class="auth-subtitle">우리 학교 소식을 보려면 학교/학년/반 설정이 꼭 필요해요.<br>설정을 마치기 전까지는 다른 화면을 이용할 수 없어요.</p>

            <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/school-setup}" th:object="${setupDto}" method="post" id="schoolSetupForm">
                <div class="auth-field">
                    <label>학교 이름</label>
                    <div class="school-search-box" id="setupSchoolSearchWrap">
                        <input type="text" id="setupSchoolSearchInput" placeholder="학교 이름을 검색하세요 (예: 모산중학교)" autocomplete="off" required>
                        <ul id="setupSchoolSearchResults" class="school-search-results"></ul>
                    </div>
                    <input type="hidden" th:field="*{schoolName}">
                    <input type="hidden" th:field="*{schoolCode}">
                    <input type="hidden" th:field="*{atptCode}">
                    <input type="hidden" th:field="*{schoolKind}">
                    <div id="setupSchoolCheckMsg" class="auth-check-msg"></div>
                </div>
                <div class="auth-field-row">
                    <div class="auth-field">
                        <label>학년</label>
                        <select th:field="*{grade}" required>
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                        </select>
                    </div>
                    <div class="auth-field">
                        <label>반</label>
                        <select th:field="*{classNum}" required disabled>
                            <option value="" selected>학교와 학년을 먼저 선택하세요</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand auth-submit">설정 완료</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/school-search.js}"></script>
<script th:src="@{/js/class-select.js}"></script>
<script th:src="@{/js/grade-select.js}"></script>
<script th:src="@{/js/school-setup.js}"></script>
</body>
</html>
