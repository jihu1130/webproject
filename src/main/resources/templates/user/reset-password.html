<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div th:replace="~{fragments/navbar :: navbar('login')}"></div>

<div class="auth-shell">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h3 class="auth-title">새 비밀번호 설정</h3>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="auth-field">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password" name="newPassword" class="form-control" placeholder="새 비밀번호 입력" required>
                </div>
                <div class="auth-field">
                    <label class="form-label">새 비밀번호 확인</label>
                    <input type="password" name="confirmNewPassword" class="form-control" placeholder="새 비밀번호 다시 입력" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">비밀번호 변경</button>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
