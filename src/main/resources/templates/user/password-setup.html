<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 설정 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<div class="auth-shell">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h3 class="auth-title"><i class="fa-solid fa-key"></i> 비밀번호를 설정해주세요</h3>
            <p class="auth-subtitle">구글 계정으로 가입하면 아직 본인이 아는 비밀번호가 없어요.<br>설정을 마치기 전까지는 다른 화면을 이용할 수 없어요.</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/password-setup}" th:object="${setupDto}" method="post">
                <div class="auth-field">
                    <label class="form-label">새 비밀번호</label>
                    <input type="password" th:field="*{newPassword}" class="form-control" required>
                </div>
                <div class="auth-field">
                    <label class="form-label">새 비밀번호 확인</label>
                    <input type="password" th:field="*{confirmNewPassword}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">설정 완료</button>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
