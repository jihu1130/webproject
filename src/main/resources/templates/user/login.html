<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div th:replace="~{fragments/navbar :: navbar('login')}"></div>

<div class="auth-shell">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h3 class="auth-title">다시 오셨네요!</h3>
            <p class="auth-subtitle">로그인하고 우리 학교 소식을 확인하세요</p>

            <div th:if="${param.error}" class="auth-alert auth-alert-danger">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.registered}" class="auth-alert auth-alert-success">
                회원가입이 완료되었습니다! 로그인해 주세요.
            </div>
            <div th:if="${param.updated}" class="auth-alert auth-alert-success">
                아이디가 변경되었습니다. 새 아이디로 다시 로그인해 주세요.
            </div>
            <div th:if="${param.accountDeleted}" class="auth-alert auth-alert-success">
                계정이 삭제되었습니다. 그동안 이용해주셔서 감사합니다.
            </div>
            <div th:if="${param.reset}" class="auth-alert auth-alert-success">
                비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.
            </div>
            <div th:if="${param.verified}" class="auth-alert auth-alert-success">
                이메일 인증이 완료되었습니다.
            </div>
            <div th:if="${param.verifyError}" class="auth-alert auth-alert-danger">
                인증 링크가 유효하지 않거나 만료되었습니다.
            </div>

            <a href="/oauth2/authorization/google" class="auth-google-btn" th:if="${googleLoginEnabled}">
                <i class="fa-brands fa-google"></i> 구글 계정으로 로그인
            </a>
            <div class="auth-oauth-divider" th:if="${googleLoginEnabled}"><span>또는</span></div>

            <form th:action="@{/login}" method="post">
                <div class="auth-field">
                    <label>아이디</label>
                    <input type="text" name="username" placeholder="아이디 입력" required>
                </div>
                <div class="auth-field">
                    <label>비밀번호</label>
                    <input type="password" name="password" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="btn btn-brand auth-submit">로그인</button>
            </form>

            <div class="auth-footer"><a href="/find-username">아이디 찾기</a> · <a href="/forgot-password">비밀번호 찾기</a></div>
            <div class="auth-footer">계정이 없으신가요? <a href="/register">회원가입</a></div>
        </div>
    </div>
</div>

</body>
</html>
