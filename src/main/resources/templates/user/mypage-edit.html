<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 정보 수정 - WebSchool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/school-search.css}">
</head>
<body class="auth-body">

<div th:replace="~{fragments/navbar :: navbar('mypage')}"></div>

<div class="auth-shell">
    <div class="auth-wrapper auth-wrapper-wide">
        <div class="auth-card">
            <h3 class="auth-title">내 정보 수정</h3>
            <p class="auth-subtitle">아이디 · 비밀번호 · 학교 정보를 변경할 수 있어요</p>

            <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/mypage/edit}" th:object="${updateDto}" method="post" id="mypageEditForm">
                <div class="auth-field">
                    <label>아이디</label>
                    <div class="auth-field-inline">
                        <input type="text" th:field="*{username}" placeholder="영문, 숫자만 입력" pattern="[A-Za-z0-9]+" required>
                        <button type="button" id="checkUsernameBtn" class="btn btn-outline-brand btn-usercheck">중복확인</button>
                    </div>
                    <div id="usernameCheckMsg" class="auth-check-msg"></div>
                </div>
                <div class="auth-field">
                    <label>별명</label>
                    <input type="text" th:field="*{nickname}" placeholder="비워두면 아이디가 별명이 돼요">
                </div>

                <hr class="auth-section-divider">
                <p class="auth-section-label"><i class="fa-solid fa-key"></i> 비밀번호 변경 (선택)</p>

                <div class="auth-field">
                    <label>새 비밀번호</label>
                    <input type="password" th:field="*{newPassword}" placeholder="변경하지 않으려면 비워두세요">
                </div>
                <div class="auth-field">
                    <label>새 비밀번호 확인</label>
                    <input type="password" th:field="*{confirmNewPassword}" placeholder="새 비밀번호 다시 입력">
                    <div id="passwordCheckMsg" class="auth-check-msg"></div>
                </div>

                <hr class="auth-section-divider">
                <p class="auth-section-label"><i class="fa-solid fa-school"></i> 우리 학교 설정</p>

                <div class="auth-field">
                    <label>학교 이름</label>
                    <div class="school-search-box" id="editSchoolSearchWrap">
                        <input type="text" id="editSchoolSearchInput" placeholder="본인의 학교를 검색해보세요" autocomplete="off"
                               th:value="${updateDto.schoolName}" required>
                        <ul id="editSchoolSearchResults" class="school-search-results"></ul>
                    </div>
                    <input type="hidden" th:field="*{schoolName}">
                    <input type="hidden" th:field="*{schoolCode}">
                    <input type="hidden" th:field="*{atptCode}">
                    <input type="hidden" th:field="*{schoolKind}">
                </div>
                <div class="auth-field-row">
                    <div class="auth-field">
                        <label>학년</label>
                        <select th:field="*{grade}" required>
                            <option th:each="n : ${#numbers.sequence(1, 6)}"
                                    th:if="${updateDto.grade == n.toString()}"
                                    th:value="${n}" th:text="${n} + '학년'" selected></option>
                            <option th:unless="${updateDto.grade != null and !#strings.isEmpty(updateDto.grade)}"
                                    value="1">1학년</option>
                        </select>
                    </div>
                    <div class="auth-field">
                        <label>반</label>
                        <select th:field="*{classNum}" required>
                            <option th:if="${updateDto.classNum != null and !#strings.isEmpty(updateDto.classNum)}"
                                    th:value="${updateDto.classNum}" th:text="${updateDto.classNum} + '반'" selected></option>
                            <option th:unless="${updateDto.classNum != null and !#strings.isEmpty(updateDto.classNum)}"
                                    value="" selected>학교와 학년을 먼저 선택하세요</option>
                        </select>
                    </div>
                </div>

                <hr class="auth-section-divider">
                <p class="auth-section-label"><i class="fa-solid fa-lock"></i> 본인 확인</p>
                <div class="auth-field">
                    <label>현재 비밀번호</label>
                    <input type="password" th:field="*{currentPassword}" placeholder="변경사항 저장을 위해 현재 비밀번호를 입력하세요" required>
                </div>

                <button type="submit" class="btn btn-brand auth-submit">저장하기</button>
            </form>

            <div class="auth-footer"><a href="/mypage">마이페이지로 돌아가기</a></div>

            <hr class="auth-section-divider">
            <p class="auth-section-label"><i class="fa-solid fa-triangle-exclamation"></i> 계정 삭제</p>
            <p class="mypage-delete-desc">
                탈퇴하면 로그인할 수 없게 됩니다. 그동안 작성한 게시글/댓글은
                삭제되지 않고 남지만, 작성자는 "탈퇴한 사용자"로 표시됩니다.
            </p>
            <form th:action="@{/mypage/delete}" method="post" id="deleteAccountForm"
                  onsubmit="return confirm('정말 계정을 삭제하시겠어요? 이 작업은 되돌릴 수 없습니다.');">
                <div class="auth-field">
                    <label>비밀번호 확인</label>
                    <input type="password" name="password" placeholder="계정 삭제를 위해 비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="mypage-delete-btn">계정 삭제</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/school-search.js}"></script>
<script th:src="@{/js/class-select.js}"></script>
<script th:src="@{/js/grade-select.js}"></script>
<script th:src="@{/js/mypage-edit.js}"></script>
</body>
</html>
