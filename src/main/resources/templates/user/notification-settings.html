<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 설정 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body auth-body-plain">

<div th:replace="~{fragments/navbar :: navbar('mypage')}"></div>

<div class="auth-shell">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h3 class="auth-title">알림 설정</h3>
            <p class="auth-subtitle">받고 싶은 알림을 직접 켜고 끌 수 있어요</p>

            <div th:if="${param.updated}" class="alert alert-success">저장되었습니다.</div>

            <form th:action="@{/mypage/notifications}" method="post">
                <p class="auth-subtitle" style="margin-bottom: 6px;">기본으로 켜져 있어요 - 원치 않으면 꺼주세요</p>

                <div class="form-check mb-2">
                    <input type="checkbox" class="form-check-input" id="commentAlertEnabled" name="commentAlertEnabled"
                           value="true" th:checked="${commentAlertEnabled}">
                    <label class="form-check-label" for="commentAlertEnabled">댓글 알림</label>
                </div>
                <div class="form-check mb-2">
                    <input type="checkbox" class="form-check-input" id="likeAlertEnabled" name="likeAlertEnabled"
                           value="true" th:checked="${likeAlertEnabled}">
                    <label class="form-check-label" for="likeAlertEnabled">좋아요 알림</label>
                </div>
                <div class="form-check mb-2">
                    <input type="checkbox" class="form-check-input" id="replyAlertEnabled" name="replyAlertEnabled"
                           value="true" th:checked="${replyAlertEnabled}">
                    <label class="form-check-label" for="replyAlertEnabled">답글 알림</label>
                </div>

                <hr class="auth-section-divider">

                <p class="auth-subtitle" style="margin-bottom: 6px;">기본으로 꺼져 있어요 - 원하면 켜주세요</p>

                <div class="form-check mb-2">
                    <input type="checkbox" class="form-check-input" id="contestDeadlineAlertEnabled" name="contestDeadlineAlertEnabled"
                           value="true" th:checked="${contestDeadlineAlertEnabled}">
                    <label class="form-check-label" for="contestDeadlineAlertEnabled">
                        추천 게시글 콘테스트 마감 임박 알림
                        <span class="d-block text-muted small">
                            매주 일요일 저녁, 이번 주 콘테스트 마감이 얼마 안 남았다고 알려드려요
                        </span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">저장하기</button>
            </form>

            <div class="auth-footer"><a href="/mypage">마이페이지로 돌아가기</a></div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
