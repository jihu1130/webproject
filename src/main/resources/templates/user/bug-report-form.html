<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('bug-report')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="post-form-card">
            <h2><i class="fa-solid fa-comment-dots"></i> 문의하기</h2>
            <p class="page-sub" style="margin: -0.6rem 0 1.2rem;">버그 제보, 건의, 계정 문의 등 무엇이든 남겨주세요.</p>

            <div th:if="${param.submitted}" class="post-alert post-alert-success">
                문의가 접수됐습니다. 알려주셔서 감사합니다!
            </div>
            <div th:if="${errorMessage}" class="post-alert post-alert-danger" th:text="${errorMessage}"></div>

            <form id="bugReportForm" th:action="@{/bug-reports/new}" method="post" enctype="multipart/form-data">
                <div class="post-field">
                    <label>문의 유형</label>
                    <select name="category">
                        <option value="BUG" th:selected="${category == null or category == 'BUG'}">버그 제보</option>
                        <option value="SUGGESTION" th:selected="${category == 'SUGGESTION'}">건의</option>
                        <option value="ACCOUNT" th:selected="${category == 'ACCOUNT'}">계정 문의</option>
                        <option value="OTHER" th:selected="${category == 'OTHER'}">기타</option>
                    </select>
                </div>
                <div class="post-field">
                    <label>제목</label>
                    <input type="text" name="title" placeholder="어떤 내용인지 한 줄로 요약해주세요" maxlength="100" th:value="${title}" required>
                </div>
                <div class="post-field">
                    <label>내용</label>
                    <textarea name="content" rows="8" placeholder="자세히 적어주시면 도움이 됩니다"
                              maxlength="2000" required th:text="${content}"></textarea>
                </div>
                <div class="post-field" th:unless="${isLoggedIn}">
                    <label>이름 (선택)</label>
                    <input type="text" name="reporterNickname" placeholder="비워두면 익명으로 접수돼요" maxlength="30" th:value="${reporterNickname}">
                </div>
                <div class="post-field">
                    <label th:text="${isLoggedIn} ? '연락 가능한 이메일 (선택)' : '연락 가능한 이메일 (필수)'">연락 가능한 이메일</label>
                    <input type="email" name="contactEmail" placeholder="답변을 받을 이메일을 입력해주세요" maxlength="100"
                           th:value="${contactEmail}" th:attr="required=${!isLoggedIn}">
                    <p class="post-content-guide" th:unless="${isLoggedIn}">비로그인 상태라 답변을 인앱 알림으로 받을 수 없어요 - 이메일로 답변을 보내드려요.</p>
                </div>
                <div class="post-field">
                    <label>사진/영상 첨부 (선택, 최대 5개)</label>
                    <input type="file" id="bugReportFileInput" name="files" accept="image/*,video/*" multiple>
                    <div id="bugReportFilePreview" class="post-image-preview-grid"></div>
                </div>

                <div class="post-form-actions">
                    <a href="/" class="btn btn-outline-brand">취소</a>
                    <button type="submit" class="btn btn-brand">제출하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/bug-report-form.js}"></script>

</body>
</html>
