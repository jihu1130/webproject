<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" th:href="@{/css/profile-card.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('mypage')}"></div>

<div class="mypage-page">
    <div class="mypage-container">
        <div class="mypage-card">
            <div class="profile-card-head profile-card-head-center">
                <div class="profile-card-avatar"
                     th:classappend="${loginUser != null and loginUser.role != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'} ? 'profile-card-avatar-super'
                                     : (${loginUser != null and loginUser.role != null and loginUser.role.name() == 'ROLE_ADMIN'} ? 'profile-card-avatar-admin' : 'profile-card-avatar-user')">
                    <span th:text="${loginUser != null and !#strings.isEmpty(loginUser.nickname)} ? ${#strings.substring(loginUser.nickname,0,1)} : '?'">?</span>
                    <i class="fa-brands fa-google profile-card-avatar-google" th:if="${loginUser != null and loginUser.provider.name() == 'GOOGLE'}"></i>
                </div>

                <div>
                    <h2 class="mypage-name" th:text="${loginUser != null ? loginUser.nickname : '회원'}">회원</h2>
                    <p class="mypage-username">@<span th:text="${loginUser != null ? loginUser.username : ''}"></span></p>
                </div>
            </div>

            <div class="profile-card-stamp-row">
                <span class="profile-card-stamp profile-card-stamp-super"
                      th:if="${loginUser != null and loginUser.role != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
                      th:text="'총관리자'">총관리자</span>
                <span class="profile-card-stamp profile-card-stamp-admin"
                      th:if="${loginUser != null and loginUser.role != null and loginUser.role.name() == 'ROLE_ADMIN'}"
                      th:text="'부관리자'">부관리자</span>
                <span class="profile-card-stamp profile-card-stamp-user"
                      th:if="${loginUser == null or loginUser.role == null or loginUser.role.name() == 'ROLE_USER'}"
                      th:text="'학생'">학생</span>
                <!-- 수정사항.md 지적 - 신고/게시글/한마디/공지 권한을 전부 회수당한 부관리자도 예전엔
                     계속 "부관리자"로만 보여서 실제 권한이 하나도 없다는 걸 본인이 알 방법이 없었다.
                     역할 스탬프(명사형) 옆에 상태 태그(동사형)로 분리해서 표시한다. -->
                <span class="profile-card-status profile-card-status-inactive"
                      th:if="${loginUser != null and loginUser.role != null and loginUser.role.name() == 'ROLE_ADMIN'
                              and !loginUser.canManageReports and !loginUser.canManagePosts
                              and !loginUser.canManageScheduleComments and !loginUser.canManageNotices}"
                      th:text="'권한 없음'">권한 없음</span>
            </div>

            <div class="profile-card-stats">
                <div class="profile-card-stat">
                    <strong th:text="${stats.postCount}">0</strong>
                    <span>게시글</span>
                </div>
                <div class="profile-card-stat">
                    <strong th:text="${stats.commentCount}">0</strong>
                    <span>댓글</span>
                </div>
                <div class="profile-card-stat">
                    <strong th:text="${stats.likeCount}">0</strong>
                    <span>받은 좋아요</span>
                </div>
            </div>

            <div class="mypage-info-list">
                <div class="mypage-info-row">
                    <span class="mypage-info-label"><i class="fa-solid fa-school"></i> 관심 학교</span>
                    <span class="mypage-info-value"
                          th:if="${loginUser != null and !#strings.isEmpty(loginUser.schoolName)}"
                          th:text="${loginUser.schoolName}">-</span>
                    <span class="mypage-info-value"
                          th:unless="${loginUser != null and !#strings.isEmpty(loginUser.schoolName)}">설정되지 않음</span>
                </div>
                <div class="mypage-info-row">
                    <span class="mypage-info-label"><i class="fa-solid fa-layer-group"></i> 학년 / 반</span>
                    <span class="mypage-info-value"
                          th:if="${loginUser != null and !#strings.isEmpty(loginUser.grade)}"
                          th:text="${loginUser.grade + '학년 ' + (loginUser.classNum != null ? loginUser.classNum : '?') + '반'}">-</span>
                    <span class="mypage-info-value"
                          th:unless="${loginUser != null and !#strings.isEmpty(loginUser.grade)}">설정되지 않음</span>
                </div>
                <div class="mypage-info-row" th:if="${loginUser != null and !#strings.isEmpty(loginUser.email)}">
                    <span class="mypage-info-label"><i class="fa-solid fa-envelope"></i> 이메일</span>
                    <span class="mypage-info-value">
                        <span th:text="${loginUser.email}">-</span>
                        <span class="profile-card-status profile-card-status-active" th:if="${loginUser.emailVerified}">인증됨</span>
                        <span class="profile-card-status profile-card-status-inactive" th:unless="${loginUser.emailVerified}">미인증</span>
                    </span>
                </div>
                <form th:if="${loginUser != null and !#strings.isEmpty(loginUser.email) and !loginUser.emailVerified}"
                      th:action="@{/mypage/resend-verification}" method="post" class="mypage-resend-form">
                    <button type="submit" class="mypage-profile-edit-link mypage-resend-btn">인증 메일 재발송</button>
                </form>
            </div>

            <div class="mypage-profile-box">
                <div class="mypage-profile-box-header">
                    <span th:text="${loginUser != null ? loginUser.nickname : '회원'} + ' 소개글'">소개글</span>
                    <a href="/mypage/profile" class="mypage-profile-edit-link" title="소개글 수정" aria-label="소개글 수정"><i class="fa-solid fa-pen"></i></a>
                </div>
                <p class="mypage-profile-bio"
                   th:if="${loginUser != null and !#strings.isEmpty(loginUser.bio)}"
                   th:text="${loginUser.bio}">소개글</p>
                <p class="mypage-profile-bio mypage-profile-bio-empty"
                   th:unless="${loginUser != null and !#strings.isEmpty(loginUser.bio)}">아직 작성한 소개글이 없어요.</p>
                <a th:if="${loginUser != null}" th:href="@{'/users/' + ${loginUser.id}}" class="mypage-profile-posts-link">
                    <span th:text="${loginUser.nickname} + '이 쓴 게시글 보러가기'">쓴 게시글 보러가기</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

            <div th:if="${param.updated}" class="mypage-alert mypage-alert-success">정보가 저장되었습니다.</div>
            <div th:if="${param.verified}" class="mypage-alert mypage-alert-success">이메일 인증이 완료되었습니다.</div>
            <div th:if="${param.verifyError}" class="mypage-alert mypage-alert-danger">인증 링크가 유효하지 않거나 만료되었습니다.</div>
            <div th:if="${param.resent}" class="mypage-alert mypage-alert-success">인증 메일을 다시 보냈습니다.</div>

            <a href="/mypage/edit" class="mypage-edit-btn">
                <i class="fa-solid fa-user-pen"></i> 내 정보 수정
            </a>

            <a href="/mypage/activity" class="mypage-cal-btn">
                <i class="fa-solid fa-clock-rotate-left"></i> 내 활동내역
            </a>

            <form th:action="@{/logout}" method="post" class="mypage-logout-form">
                <button type="submit" class="mypage-logout-btn">로그아웃</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
