<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포인트 내역 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('mypage')}"></div>

<div class="post-page">
    <div class="post-container">
        <div class="page-heading post-page-heading">
            <h1><i class="fa-solid fa-coins"></i> 포인트 내역</h1>
            <p class="page-sub">적립·소비 내역을 확인할 수 있어요 - <a href="/ranking">전체 포인트 랭킹 보기</a></p>
        </div>

        <th:block th:if="${logs.empty}">
            <div th:replace="~{fragments/empty-state :: box('fa-solid fa-coins', '아직 포인트 내역이 없어요. 출석체크만 해도 포인트가 쌓여요.', '출석체크하러 가기', '/mypage')}"></div>
        </th:block>

        <ul class="post-list" th:unless="${logs.empty}">
            <li class="post-list-item" th:each="log : ${logs}">
                <span class="post-list-title" th:text="${log.reason}">사유</span>
                <span class="post-list-meta">
                    <span th:text="${(log.points >= 0 ? '+' : '') + log.points + 'P'}"
                          th:style="${log.points >= 0} ? 'color:var(--brand-1);font-weight:700;' : 'color:#dc3545;font-weight:700;'">0P</span>
                    <span class="post-list-date" th:text="${log.createdAt}">날짜</span>
                </span>
            </li>
        </ul>

        <div class="post-pagination" th:if="${logs.totalPages > 1}">
            <a th:if="${logs.hasPrevious()}" th:href="@{/mypage/points(page=${logs.number - 1})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
               th:href="@{/mypage/points(page=${i})}" th:text="${i + 1}"
               th:classappend="${i == logs.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${logs.hasNext()}" th:href="@{/mypage/points(page=${logs.number + 1})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/timeago.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        WebSchoolTimeago.applyAll('.post-list-date');
    });
</script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
