<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필 설정 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/profile-card.css}">
</head>
<body class="auth-body auth-body-plain">

<div th:replace="~{fragments/navbar :: navbar('mypage')}"></div>

<div class="auth-shell">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h3 class="auth-title">내 프로필 설정</h3>
            <p class="auth-subtitle">다른 사람이 보는 내 프로필(<span th:text="'/users/' + ${loginUser?.uuid}"></span>)에 표시될 사진과 소개글이에요</p>

            <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${param.updated}" class="auth-alert auth-alert-success">저장되었습니다.</div>

            <div class="auth-field" style="text-align:center;">
                <label>프로필 사진</label>
                <div class="profile-card-avatar profile-card-avatar-user" style="margin: 0 auto 12px;">
                    <img id="profileImagePreview"
                         th:src="@{${loginUser != null and loginUser.profileImageUrl != null} ? ${loginUser.profileImageUrl} : '/images/default-avatar.svg'}"
                         alt="프로필 사진">
                </div>
                <form th:action="@{/mypage/profile/image}" method="post" enctype="multipart/form-data" class="auth-field-inline" style="justify-content:center;">
                    <input type="file" id="profileImageInput" name="profileImage" accept="image/*" required>
                    <button type="submit" class="btn btn-outline-brand btn-usercheck">사진 올리기</button>
                </form>
                <form th:if="${loginUser != null and loginUser.profileImageUrl != null}"
                      th:action="@{/mypage/profile/image/reset}" method="post" style="margin-top:6px;">
                    <button type="submit" class="mypage-profile-edit-link" style="background:none;border:none;cursor:pointer;">기본 이미지로 되돌리기</button>
                </form>
            </div>

            <hr class="auth-section-divider">

            <form th:action="@{/mypage/profile}" method="post">
                <div class="auth-field">
                    <label>소개글</label>
                    <textarea id="bioInput" name="bio" maxlength="150" rows="3" placeholder="짧은 한 줄 소개를 남겨보세요 (선택)" th:text="${bio}"></textarea>
                </div>

                <!-- 수정사항.md 지적 - 저장 전엔 실제 공개 프로필(/users/{id})에서 어떻게 보일지 알 방법이
                     없었다. profile.html이 실제로 쓰는 .profile-card-bio-box와 동일한 클래스를 그대로
                     써서 그 자리에서 바로 보여준다(예전엔 .profile-bio라는 별도 클래스를 썼는데, 공개
                     프로필 쪽이 profile-card.css 컴포넌트로 바뀐 뒤에도 안 따라가서 미리보기가 실제
                     모양과 달라져 있었다). -->
                <div class="auth-field">
                    <label>미리보기 (실제 프로필에 이렇게 보여요)</label>
                    <div class="profile-card-bio-box">
                        <div class="profile-card-bio-header">소개글</div>
                        <p class="profile-card-bio-text" id="bioPreview" th:text="${bio}">소개글</p>
                        <p class="profile-card-bio-text profile-card-bio-empty" id="bioPreviewEmpty" style="display:none;">아직 작성한 소개글이 없어요.</p>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand auth-submit">저장하기</button>
            </form>

            <div class="auth-footer"><a href="/mypage">마이페이지로 돌아가기</a></div>

            <script>
                /* "사진 올리기"를 실제로 눌러 서버에 반영되기 전까지는 선택만 한 파일을 원형
                   아바타에 미리 보여준다 - 눌러야 적용, 안 누르면 그대로(폼 제출 전이라 서버
                   상태는 안 바뀜). objectURL은 원본 이미지로 되돌릴 때(파일 선택 취소) 누수
                   없이 해제한다. */
                (function () {
                    var fileInput = document.getElementById('profileImageInput');
                    var avatarImg = document.getElementById('profileImagePreview');
                    var originalSrc = avatarImg.src;
                    var objectUrl = null;

                    fileInput.addEventListener('change', function () {
                        if (objectUrl) {
                            URL.revokeObjectURL(objectUrl);
                            objectUrl = null;
                        }
                        var file = fileInput.files && fileInput.files[0];
                        if (!file) {
                            avatarImg.src = originalSrc;
                            return;
                        }
                        objectUrl = URL.createObjectURL(file);
                        avatarImg.src = objectUrl;
                    });
                })();

                (function () {
                    var input = document.getElementById('bioInput');
                    var preview = document.getElementById('bioPreview');
                    var emptyPreview = document.getElementById('bioPreviewEmpty');

                    function render() {
                        var value = input.value.trim();
                        preview.textContent = value;
                        preview.style.display = value ? 'block' : 'none';
                        emptyPreview.style.display = value ? 'none' : 'block';
                    }

                    input.addEventListener('input', render);
                    render();
                })();
            </script>
        </div>
    </div>
</div>

</body>
</html>
