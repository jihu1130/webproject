<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 프로필 설정 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/profile-card.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
</head>
<body class="auth-body auth-body-plain">

<div th:replace="~{fragments/navbar :: navbar('mypage')}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div class="auth-shell">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h3 class="auth-title">내 프로필 설정</h3>
            <p class="auth-subtitle">다른 사람이 보는 내 프로필에 표시될 사진과 소개글이에요</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${param.updated}" class="alert alert-success">저장되었습니다.</div>

            <div class="auth-field text-center">
                <label class="form-label">프로필 사진</label>
                <!-- 아래 "치장품 장착"에서 장식(색상/효과)을 바꿔도 이 위쪽 사진 미리보기엔 전혀
                     반영이 안 됐다(사용자 지적) - mypage.html 등 다른 화면이 이미 쓰는 것과 동일한
                     패턴(border-color + 효과 클래스)을 여기도 그대로 적용해서, 장착 폼 제출 후
                     페이지가 새로고침되면 바뀐 색/효과가 바로 이 아바타에 보이게 한다. -->
                <div class="profile-card-avatar profile-card-avatar-user"
                     th:classappend="${loginUser != null and loginUser.equippedEffect == 'SPARKLE'} ? ' avatar-effect-sparkle' : (${loginUser != null and loginUser.equippedEffect == 'RAINBOW'} ? ' avatar-effect-rainbow' : '')"
                     th:style="'margin:0 auto 12px;' + (${loginUser != null and loginUser.equippedAvatarColor != null} ? 'border-color:' + ${loginUser.equippedAvatarColor} : '')">
                    <img id="profileImagePreview"
                         th:src="@{${loginUser != null and loginUser.profileImageUrl != null} ? ${loginUser.profileImageUrl} : '/images/default-avatar.svg'}"
                         alt="프로필 사진">
                </div>
                <!-- 네이티브 <input type=file>를 그대로 .form-control에 넣으면 브라우저가 "파일
                     선택" 버튼 + "선택된 파일 없음" 문구를 한 덩어리로 그리는데, 이 줄에 "사진
                     올리기" 버튼까지 같이 넣으려고 좁게 잡아둔 폭 안에서 그 문구가
                     "선택된...일 없음"처럼 잘려 보였다(사용자 지적 - 브라우저가 그리는 내부
                     텍스트라 CSS로 직접 손볼 수 없음). input은 숨기고 label로 감싸 커스텀
                     버튼처럼 쓰고, 파일명은 우리가 만든 짧은 span에 JS로 직접 채워서 항상
                     온전히 보이게 한다(길면 이 span 안에서만 ...으로 줄임). -->
                <form th:action="@{/mypage/profile/image}" method="post" enctype="multipart/form-data" class="profile-image-upload-row">
                    <label class="btn btn-outline-primary btn-usercheck profile-image-choose-btn">
                        파일 선택
                        <input type="file" id="profileImageInput" name="profileImage" accept="image/*" required hidden>
                    </label>
                    <span id="profileImageFileName" class="profile-image-filename">선택한 파일 없음</span>
                    <button type="submit" class="btn btn-primary btn-usercheck">사진 올리기</button>
                </form>
                <form th:if="${loginUser != null and loginUser.profileImageUrl != null}"
                      th:action="@{/mypage/profile/image/reset}" method="post" class="mt-1">
                    <button type="submit" class="btn btn-link btn-sm p-0">기본 이미지로 되돌리기</button>
                </form>
            </div>

            <hr class="auth-section-divider">

            <form th:action="@{/mypage/profile}" method="post">
                <div class="auth-field">
                    <label class="form-label">소개글</label>
                    <textarea id="bioInput" name="bio" class="form-control" maxlength="150" rows="3" placeholder="짧은 한 줄 소개를 남겨보세요 (선택)" th:text="${bio}"></textarea>
                </div>

                <!-- 수정사항.md 지적 - 저장 전엔 실제 공개 프로필(/users/{id})에서 어떻게 보일지 알 방법이
                     없었다. profile.html이 실제로 쓰는 .profile-card-bio-box와 동일한 클래스를 그대로
                     써서 그 자리에서 바로 보여준다(예전엔 .profile-bio라는 별도 클래스를 썼는데, 공개
                     프로필 쪽이 profile-card.css 컴포넌트로 바뀐 뒤에도 안 따라가서 미리보기가 실제
                     모양과 달라져 있었다). -->
                <div class="auth-field">
                    <label class="form-label">미리보기 (실제 프로필에 이렇게 보여요)</label>
                    <div class="profile-card-bio-box">
                        <div class="profile-card-bio-header">소개글</div>
                        <p class="profile-card-bio-text" id="bioPreview" th:text="${bio}">소개글</p>
                        <p class="profile-card-bio-text profile-card-bio-empty" id="bioPreviewEmpty" style="display:none;">아직 작성한 소개글이 없어요.</p>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">저장하기</button>
            </form>

            <hr class="auth-section-divider">

            <!-- 상점에서 구매한 치장품 중 어떤 걸 장착할지 여기서도 바로 고를 수 있게(사용자 요청) -
                 /shop과 같은 카탈로그(owned/equipped 플래그 포함)를 재사용하되, 아직 안 산 상품(구매하기
                 버튼)은 이 화면의 목적과 안 맞아서 owned == true인 것만 걸러서 보여준다. -->
            <div class="auth-field">
                <label class="form-label">치장품 장착</label>
                <p class="text-muted small">상점에서 구매한 칭호/장식 중 원하는 걸 골라 장착하세요.</p>

                <h3 class="shop-section-title"><i class="fa-solid fa-tag"></i> 칭호</h3>
                <div th:if="${#lists.isEmpty(catalog.titles.?[owned])}" class="post-empty">
                    아직 보유한 칭호가 없어요. <a th:href="@{/shop}">상점 구경하기</a>
                </div>
                <!-- 칭호가 늘어날수록 카드형은 세로로 한없이 길어져서(사용자 지적) 알약 모양
                     칩으로 바꾸고, 장착 여부는 별도 배지 문구 대신 칩 강조색+체크 아이콘으로만
                     표시해 공간을 아낀다. 클릭 = 그 칩 자체가 제출 버튼(폼 하나당 아이템 하나). -->
                <div class="equip-chip-row" th:unless="${#lists.isEmpty(catalog.titles.?[owned])}">
                    <form th:each="item : ${catalog.titles}" th:if="${item.owned}" class="equip-chip-form"
                          th:action="@{${item.equipped} ? '/shop/unequip/TITLE' : '/shop/equip/' + ${item.id}}" method="post">
                        <input type="hidden" name="from" value="profile">
                        <button type="submit" class="equip-chip" th:classappend="${item.equipped} ? ' equip-chip-active'"
                                th:title="${item.label} + (${item.equipped} ? ' (장착 해제)' : ' (장착하기)')">
                            <i class="fa-solid fa-check equip-chip-check" th:if="${item.equipped}"></i>
                            <span th:text="${item.value}">칭호</span>
                        </button>
                    </form>
                </div>

                <h3 class="shop-section-title"><i class="fa-solid fa-palette"></i> 장식</h3>
                <div th:if="${#lists.isEmpty(catalog.colors.?[owned])}" class="post-empty">
                    아직 보유한 장식이 없어요. <a th:href="@{/shop}">상점 구경하기</a>
                </div>
                <div class="equip-chip-row" th:unless="${#lists.isEmpty(catalog.colors.?[owned])}">
                    <form th:each="item : ${catalog.colors}" th:if="${item.owned}" class="equip-chip-form"
                          th:action="@{${item.equipped} ? '/shop/unequip/AVATAR_COLOR' : '/shop/equip/' + ${item.id}}" method="post">
                        <input type="hidden" name="from" value="profile">
                        <button type="submit" class="equip-chip equip-chip-swatch" th:classappend="${item.equipped} ? ' equip-chip-active'"
                                th:style="'background:' + ${item.value}"
                                th:title="${item.label} + (${item.equipped} ? ' (장착 해제)' : ' (장착하기)')">
                            <i class="fa-solid fa-check equip-chip-check" th:if="${item.equipped}"></i>
                            <!-- 반짝임/무지개 효과가 붙은 장식은 원 색상만 봐서는 둘 중 뭔지 구분이 안 돼서
                                 (사용자 지적) 효과별 아이콘 배지를 원 모서리에 작게 얹는다. -->
                            <i class="equip-chip-effect-badge fa-solid fa-star" th:if="${item.effect == 'SPARKLE'}"></i>
                            <i class="equip-chip-effect-badge fa-solid fa-rainbow" th:if="${item.effect == 'RAINBOW'}"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div class="auth-footer"><a href="/mypage">마이페이지로 돌아가기</a></div>

            <script>
                /* "사진 올리기"를 실제로 눌러 서버에 반영되기 전까지는 선택만 한 파일을 원형
                   아바타에 미리 보여준다 - 눌러야 적용, 안 누르면 그대로(폼 제출 전이라 서버
                   상태는 안 바뀜). objectURL은 원본 이미지로 되돌릴 때(파일 선택 취소) 누수
                   없이 해제한다. */
                (function () {
                    var fileInput = document.getElementById('profileImageInput');
                    var avatarImg = document.getElementById('profileImagePreview');
                    var fileNameLabel = document.getElementById('profileImageFileName');
                    var originalSrc = avatarImg.src;
                    var objectUrl = null;

                    fileInput.addEventListener('change', function () {
                        if (objectUrl) {
                            URL.revokeObjectURL(objectUrl);
                            objectUrl = null;
                        }
                        var file = fileInput.files && fileInput.files[0];
                        if (!file) {
                            avatarImg.src = originalSrc;
                            fileNameLabel.textContent = '선택한 파일 없음';
                            return;
                        }
                        objectUrl = URL.createObjectURL(file);
                        avatarImg.src = objectUrl;
                        fileNameLabel.textContent = file.name;
                    });
                })();

                (function () {
                    var input = document.getElementById('bioInput');
                    var preview = document.getElementById('bioPreview');
                    var emptyPreview = document.getElementById('bioPreviewEmpty');

                    function render() {
                        var value = input.value.trim();
                        preview.textContent = value;
                        preview.style.display = value ? 'block' : 'none';
                        emptyPreview.style.display = value ? 'none' : 'block';
                    }

                    input.addEventListener('input', render);
                    render();
                })();
            </script>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
