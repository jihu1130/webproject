<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${post.title + ' - WebSchool'}">게시물 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('community')}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div class="post-page" id="postDetailPage" th:data-post-id="${post.uuid}" th:data-post-category="${post.category}"
     th:data-post-mine="${post.mine}">
    <div class="post-container post-container-narrow">

        <div class="post-blind-banner" th:if="${post.blind}">
            <i class="fa-solid fa-triangle-exclamation"></i>
            신고 누적(<span th:text="${post.reportCount}">3</span>회)으로 블라인드 처리된 게시물입니다.
            작성자 본인과 관리자에게만 보여요.
        </div>

        <!-- 공개범위 배너 - 전체 공개가 아닐 때만. 문구는 Post.Visibility enum의 라벨/설명 그대로. -->
        <div class="post-visibility-banner" th:if="${post.visibility != 'PUBLIC'}">
            <i class="fa-solid" th:classappend="${post.visibility == 'PRIVATE'} ? 'fa-lock' : 'fa-link'"></i>
            <span><strong th:text="${post.visibilityLabel}">링크 공개</strong> 글이에요. <span th:text="${post.visibilityDescription}">설명</span></span>
        </div>

        <div class="post-detail-card">
            <span class="post-category-badge" th:classappend="'post-category-badge-' + ${post.category}" th:text="${post.categoryLabel}">자유</span>
            <h1 class="post-detail-title" th:text="${post.title}">제목</h1>

            <div class="post-detail-meta">
                <span><i class="fa-solid fa-user"></i>
                    <a th:if="${post.authorLinkable}" th:href="@{'/users/' + ${post.authorUuid}}" class="post-list-nickname" th:text="${post.nickname}">작성자</a>
                    <span th:unless="${post.authorLinkable}" th:text="${post.nickname}">작성자</span>
                    <button type="button" id="postAuthorBlockBtn" class="post-author-block-btn"
                            th:if="${post.authorLinkable and !post.mine}" th:data-author-id="${post.authorId}"
                            sec:authorize="isAuthenticated()">차단</button>
                </span>
                <span><i class="fa-solid fa-clock"></i> <span id="postCreatedAt" th:text="${post.createdAt}">날짜</span></span>
                <span th:if="${post.edited}" class="post-edited-badge">수정됨</span>
                <span class="post-detail-views"><i class="fa-solid fa-eye"></i> <span th:text="${post.viewCount}">0</span></span>
            </div>

            <div class="post-detail-content post-rich-content" th:utext="${post.content}">내용</div>

            <div class="post-image-gallery" th:if="${!images.empty}">
                <a class="post-image-gallery-item" th:each="image : ${images}" th:href="${image.url}" target="_blank">
                    <img th:src="${image.url}" th:alt="${image.originalFilename}">
                </a>
            </div>

            <!-- 설문(투표) 위젯 - poll.js가 GET /polls/by-post/{id}로 자기 데이터를 스스로 불러와
                 채운다(설문이 없으면 204를 받아 숨겨진 채로 남는다). 비로그인 방문자에게는 애초에
                 렌더링하지 않는다 - /polls/** 는 로그인이 필요해서(SecurityConfig) 어차피 호출해도
                 로그인 페이지로 리다이렉트만 될 뿐이다. -->
            <div id="pollWidget" class="poll-widget" hidden th:if="${loginUser != null}"></div>

            <div class="post-like-bookmark-row" sec:authorize="isAuthenticated()">
                <button type="button" id="postLikeBtn" class="post-like-btn" aria-label="좋아요" th:classappend="${post.likedByMe} ? ' active' : ''">
                    <i class="fa-solid fa-heart"></i> <span id="postLikeCount" th:text="${post.likeCount}">0</span>
                </button>
                <button type="button" id="postBookmarkBtn" class="post-bookmark-btn" aria-label="북마크" th:classappend="${post.bookmarkedByMe} ? ' active' : ''">
                    <i class="fa-solid fa-bookmark"></i> <span th:text="${post.bookmarkedByMe} ? '북마크됨' : '북마크'">북마크</span>
                </button>
            </div>

            <!-- 이번 주 인기글 콘테스트 후보 투표 위젯 - 이 글이 이번 주 후보로 신청돼 있을 때만
                 노출(PostController.detail()이 PostContestService.findEntryForPost()로 조회).
                 원래 /posts/contest 목록에서만 투표할 수 있었는데, 글을 읽는 자리에서 바로 투표할
                 수 있어야 자연스럽다는 요청으로 추가. -->
            <div class="contest-post-widget" th:if="${contestEntry != null}">
                <span class="contest-post-widget-label"><i class="fa-solid fa-trophy"></i> 이번 주 추천 후보</span>
                <span class="contest-entry-votes" th:text="${contestEntry.voteCount} + '표'">0표</span>
                <span th:if="${contestEntry.mine}" class="contest-entry-mine-badge">내 후보</span>
                <button type="button" id="contestVoteBtn" class="btn btn-primary contest-vote-btn" th:if="${!contestEntry.mine}"
                        sec:authorize="isAuthenticated()"
                        th:data-entry-id="${contestEntry.entryId}" th:disabled="${contestEntry.votedByMe}"
                        th:text="${contestEntry.votedByMe} ? '투표완료' : '투표하기'">투표하기</button>
            </div>

            <div class="post-detail-actions">
                <div class="post-detail-actions-owner" th:if="${post.mine}">
                    <a th:href="@{'/posts/' + ${post.uuid} + '/edit'}" class="btn btn-outline-primary">
                        <i class="fa-solid fa-pen"></i> 수정
                    </a>
                    <form th:action="@{'/posts/' + ${post.uuid} + '/delete'}" method="post"
                          data-confirm="정말 삭제하시겠어요?" data-confirm-danger="true" class="post-delete-form">
                        <button type="submit" class="post-delete-btn"><i class="fa-solid fa-trash"></i> 삭제</button>
                    </form>
                    <!-- 인기 게시글 주간 콘테스트 후보 신청(todo.md 4번 항목) - 본인 게시물만, 회차당
                         인당 1개. 이미 이번 주 후보(위 contest-post-widget에 쓰는 contestEntry)라면
                         버튼 자체를 숨긴다 - 예전엔 항상 노출해서 다시 누르면 "이미 신청했습니다"
                         flashError만 뜨는 뻔한 재시도가 있었는데, contestEntry는 이미 이 템플릿
                         스코프에 있어 새 의존성 없이 바로 조건을 걸 수 있었다(2026-08-28 발견/수정).
                         익명 글은 후보 목록에 신청자 실제 닉네임이 그대로 노출돼 익명성이 깨지므로
                         버튼 자체를 숨긴다(PostContestService.nominate()의 서버단 검증과 짝). -->
                    <form th:if="${contestEntry == null and post.category != 'ANONYMOUS'}" th:action="@{/posts/contest/nominate}" method="post" class="post-contest-nominate-form">
                        <input type="hidden" name="postUuid" th:value="${post.uuid}">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="fa-solid fa-trophy"></i> 이번 주 추천 후보 신청
                        </button>
                    </form>
                </div>
                <button type="button" id="reportBtn" class="post-report-btn"
                        th:unless="${post.mine}" sec:authorize="isAuthenticated()"
                        th:disabled="${post.reportedByMe}"
                        th:aria-label="${post.reportedByMe} ? '이미 신고했어요' : '신고'">
                    <i class="fa-solid fa-flag"></i> <span th:text="${post.reportedByMe} ? '신고완료' : '신고'">신고</span>
                </button>
            </div>

            <div class="post-detail-footer-links">
                <a href="/posts" class="post-list-back"><i class="fa-solid fa-arrow-left"></i> 목록으로</a>
                <a th:href="@{'/admin/posts/' + ${post.id}}" class="post-list-back" sec:authorize="hasRole('ADMIN')">
                    <i class="fa-solid fa-shield-halved"></i> 관리자 페이지에서 보기
                </a>
            </div>
        </div>

        <div class="post-comment-section">
            <h3 class="post-comment-heading">
                <i class="fa-solid fa-comments" th:unless="${post.category == 'ANONYMOUS'}"></i>
                <i class="fa-solid fa-reply" th:if="${post.category == 'ANONYMOUS'}"></i>
                <span th:text="${post.category == 'ANONYMOUS'} ? '답변' : '댓글'">댓글</span>
            </h3>

            <div id="postCommentList" class="post-comment-list">
                <div class="post-comment-empty">불러오는 중...</div>
            </div>

            <form id="postCommentForm" class="post-comment-form" sec:authorize="isAuthenticated()">
                <input type="text" id="postCommentInput" maxlength="500"
                       th:placeholder="${post.category == 'ANONYMOUS'} ? '답변을 남겨보세요' : '댓글을 남겨보세요'" required>
                <button type="submit" aria-label="댓글 등록"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
            <p class="post-comment-login-notice" sec:authorize="!isAuthenticated()">
                <span th:text="${post.category == 'ANONYMOUS'} ? '답변' : '댓글'">댓글</span>을 작성하려면 <a href="/login">로그인</a>이 필요해요.
            </p>
        </div>
    </div>
</div>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/timeago.js}"></script>
<script th:src="@{/js/post-detail.js}"></script>
<script th:src="@{/js/poll.js}"></script>
<script th:if="${loginUser != null}" th:inline="javascript">
    initPollWidget(document.getElementById('pollWidget'), '/polls/by-post/' + /*[[${post.id}]]*/ 0);
</script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
