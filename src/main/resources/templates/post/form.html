<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${mode == 'edit'} ? '게시물 수정 - WebSchool' : '게시물 작성 - WebSchool'">게시물 작성 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('community')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="post-form-card">
            <h2 th:text="${mode == 'edit'} ? '게시물 수정' : '게시물 작성'">게시물 작성</h2>

            <div th:if="${errorMessage}" class="post-alert post-alert-danger" th:text="${errorMessage}"></div>

            <form id="postForm" th:action="${mode == 'edit'} ? @{'/posts/' + ${postUuid} + '/edit'} : @{/posts}"
                  th:object="${postForm}" method="post" enctype="multipart/form-data">
                <div class="post-field">
                    <label>카테고리</label>
                    <div class="post-category-radio-group" id="postCategoryRadioGroup">
                        <label class="post-category-radio">
                            <input type="radio" th:field="*{category}" value="FREE"> 자유
                        </label>
                        <label class="post-category-radio">
                            <input type="radio" th:field="*{category}" value="ANONYMOUS"> 익명
                        </label>
                        <label class="post-category-radio">
                            <input type="radio" th:field="*{category}" value="QNA"> 질의응답
                        </label>
                    </div>
                    <p id="postCategoryHint" class="post-category-hint"></p>
                </div>
                <div class="post-field">
                    <label>제목</label>
                    <input type="text" id="postTitleInput" th:field="*{title}" placeholder="제목을 입력하세요" maxlength="100" required>
                </div>
                <div class="post-field">
                    <label>내용</label>
                    <p id="postContentGuide" class="post-content-guide"></p>
                    <p class="post-content-guide">🖼/🎬/📎 버튼으로 본문 중간에 사진·동영상·파일을 삽입할 수 있어요 (사진 15MB, 동영상 300MB, 그 외 파일 50MB 이하)</p>
                    <div id="postContentEditor" class="rich-editor-container"></div>
                    <input type="hidden" id="postContentHidden" th:field="*{content}">
                </div>

                <div class="post-field" th:if="${mode == 'edit' and !existingImages.empty}">
                    <label>기존 이미지 (체크하면 저장 시 삭제됩니다)</label>
                    <div class="post-image-existing-grid">
                        <label class="post-image-existing-item" th:each="image : ${existingImages}">
                            <img th:src="${image.url}" alt="첨부 이미지">
                            <span class="post-image-existing-remove">
                                <input type="checkbox" name="removeImageIds" th:value="${image.id}"> 삭제
                            </span>
                        </label>
                    </div>
                </div>

                <div class="post-field">
                    <label>이미지 첨부 (jpg/jpeg/png/gif/webp, 장당 5MB 이하, 여러 장 가능)</label>
                    <input type="file" id="postImageInput" name="images" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
                    <div id="postImagePreview" class="post-image-preview-grid"></div>
                </div>

                <!-- 게시글 제한적 공개(링크 전용) - 커뮤니티 목록/검색엔 안 뜨지만 링크(uuid URL)로는
                     누구나 열람할 수 있다. -->
                <div class="post-field">
                    <label class="post-visibility-toggle">
                        <input type="checkbox" th:field="*{unlisted}">
                        <span>링크로만 공개하기 (커뮤니티 목록·검색에 노출되지 않아요)</span>
                    </label>
                </div>

                <div class="post-form-actions">
                    <a th:href="${mode == 'edit'} ? @{'/posts/' + ${postUuid}} : @{/posts}" class="btn btn-outline-brand">취소</a>
                    <button type="submit" class="btn btn-brand" th:text="${mode == 'edit'} ? '수정 완료' : '작성 완료'">작성 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.__POST_FORM_MODE__ = /*[[${mode}]]*/ 'create';
    /*]]>*/
</script>
<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script th:src="@{/js/rich-editor.js}"></script>
<script th:src="@{/js/post-form.js}"></script>
<script>
    window.__postQuill = initRichEditor({
        editorId: 'postContentEditor',
        hiddenId: 'postContentHidden',
        placeholder: '내용을 입력하세요',
        required: true
    });
</script>
</body>
</html>
