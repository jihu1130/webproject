<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${mode == 'edit'} ? '게시물 수정 - WebSchool' : '게시물 작성 - WebSchool'">게시물 작성 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('community')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="post-form-card">
            <h2 th:text="${mode == 'edit'} ? '게시물 수정' : '게시물 작성'">게시물 작성</h2>

            <div th:if="${errorMessage}" class="post-alert post-alert-danger" th:text="${errorMessage}"></div>

            <form id="postForm" th:action="${mode == 'edit'} ? @{'/posts/' + ${postUuid} + '/edit'} : @{/posts}"
                  th:object="${postForm}" method="post" enctype="multipart/form-data">
                <div class="post-field">
                    <label>카테고리</label>
                    <div class="post-category-radio-group" id="postCategoryRadioGroup">
                        <label class="post-category-radio">
                            <input type="radio" th:field="*{category}" value="FREE"> 자유
                        </label>
                        <label class="post-category-radio">
                            <input type="radio" th:field="*{category}" value="ANONYMOUS"> 익명
                        </label>
                        <label class="post-category-radio">
                            <input type="radio" th:field="*{category}" value="QNA"> 질의응답
                        </label>
                    </div>
                    <p id="postCategoryHint" class="post-category-hint"></p>
                </div>
                <div class="post-field">
                    <label>제목</label>
                    <input type="text" id="postTitleInput" th:field="*{title}" placeholder="제목을 입력하세요" maxlength="100" required>
                </div>
                <div class="post-field">
                    <label>내용</label>
                    <p id="postContentGuide" class="post-content-guide"></p>
                    <p class="post-content-guide">🖼/🎬/📎 버튼으로 본문 중간에 사진·동영상·파일을 삽입할 수 있어요 (사진 15MB, 동영상 300MB, 그 외 파일 50MB 이하)</p>
                    <div id="postContentEditor" class="rich-editor-container"></div>
                    <input type="hidden" id="postContentHidden" th:field="*{content}">
                </div>

                <div class="post-field" th:if="${mode == 'edit' and !existingImages.empty}">
                    <label>기존 이미지 (체크하면 저장 시 삭제됩니다)</label>
                    <div class="post-image-existing-grid">
                        <label class="post-image-existing-item" th:each="image : ${existingImages}">
                            <img th:src="${image.url}" alt="첨부 이미지">
                            <span class="post-image-existing-remove">
                                <input type="checkbox" name="removeImageIds" th:value="${image.id}"> 삭제
                            </span>
                        </label>
                    </div>
                </div>

                <!-- 본문 중간에 넣는 에디터 삽입 이미지(위 🖼 버튼)와는 별개로, 목록·검색 결과에
                     썸네일로 쓰이는 "대표 이미지" 첨부칸이다. 라벨/안내문으로 용도를 분명히 구분해서
                     위 에디터 버튼과 같은 기능처럼 보이지 않게 한다(사용자 지적 - 업로드 창이 2개로
                     보여 혼란스러움). 백엔드로 넘어가는 name="images" 파라미터는 그대로 유지. -->
                <div class="post-field">
                    <label>대표 이미지 <span class="post-field-optional">(선택)</span></label>
                    <p class="post-content-guide">목록·검색 결과에 썸네일로 보여요. 본문 안에 사진을 넣고 싶다면 위 에디터의 🖼 버튼을 쓰세요.</p>
                    <div class="post-image-dropzone" id="postImageDropzone">
                        <i class="fa-solid fa-image"></i>
                        <span class="post-image-dropzone-text">클릭하거나 파일을 끌어다 놓으세요</span>
                        <span class="post-image-dropzone-hint">jpg · jpeg · png · gif · webp, 장당 5MB 이하, 여러 장 가능</span>
                        <input type="file" id="postImageInput" name="images" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
                    </div>
                    <div id="postImagePreview" class="post-image-preview-grid"></div>
                </div>

                <!-- 공개범위 - 전체 공개 / 링크 공개(목록·검색에서만 제외) / 비공개(작성자와 관리자만
                     열람). 옵션과 문구는 Post.Visibility enum에서 그대로 내려온다
                     (PostController.visibilityOptions()). -->
                <div class="post-field">
                    <label>공개범위</label>
                    <div class="post-visibility-radio-group">
                        <label class="post-visibility-radio" th:each="option : ${visibilityOptions}">
                            <input type="radio" th:field="*{visibility}" th:value="${option.name()}">
                            <span class="post-visibility-radio-text">
                                <span class="post-visibility-radio-label" th:text="${option.label}">전체 공개</span>
                                <span class="post-visibility-radio-desc" th:text="${option.description}">설명</span>
                            </span>
                        </label>
                    </div>
                </div>

                <!-- 설문(투표) 첨부 - 선택 사항. 질문이 비어있으면 아무 설문도 안 만들어진다
                     (PollService.isBlank()). 수정 화면에서는 다루지 않는다(작성 시에만 첨부 가능 -
                     이미 투표가 쌓인 설문을 수정 화면에서 바꾸는 흐름은 이번 범위 밖). -->
                <div class="post-field post-poll-field" th:if="${mode != 'edit'}">
                    <label class="post-poll-toggle">
                        <input type="checkbox" id="pollToggle">
                        <span>설문(투표) 첨부하기</span>
                    </label>
                    <div id="pollFields" class="post-poll-fields" hidden>
                        <input type="text" name="pollQuestion" id="pollQuestion" maxlength="200"
                               placeholder="질문을 입력하세요 (예: 오늘 시간표 어떤가요?)">
                        <div id="pollOptionList" class="post-poll-option-list">
                            <div class="post-poll-option-row">
                                <input type="text" name="pollOptions" class="post-poll-option-input" maxlength="100" placeholder="옵션 1">
                            </div>
                            <div class="post-poll-option-row">
                                <input type="text" name="pollOptions" class="post-poll-option-input" maxlength="100" placeholder="옵션 2">
                            </div>
                        </div>
                        <button type="button" id="pollAddOptionBtn" class="btn btn-outline-brand post-poll-add-btn">+ 옵션 추가</button>

                        <!-- 설문 공개범위는 별도로 설정하지 않는다 - 게시글의 공개범위(전체공개/링크공개/
                             비공개)를 그대로 따라간다(PollService.matchesScope() 참고). -->
                        <div class="post-poll-deadline">
                            <label for="pollExpiresAt">마감 기한 (선택)</label>
                            <input type="datetime-local" name="pollExpiresAt" id="pollExpiresAt">
                        </div>

                        <button type="button" id="pollAdvancedToggle" class="post-poll-advanced-toggle" aria-expanded="false" aria-controls="pollAdvancedFields">
                            <i class="fa-solid fa-chevron-down"></i> 세부 설정 (복수 선택 · 기타 옵션 · 익명)
                        </button>
                        <div id="pollAdvancedFields" class="post-poll-advanced-fields" hidden>
                            <label class="post-poll-checkbox">
                                <input type="checkbox" name="pollAllowMultiple" value="true"> 복수 선택 허용
                            </label>
                            <label class="post-poll-checkbox">
                                <input type="checkbox" name="pollAllowCustomOption" value="true"> "기타" 직접 추가 허용
                            </label>
                            <label class="post-poll-checkbox">
                                <input type="checkbox" name="pollAnonymous" value="true"> 익명 투표 (누가 뭘 골랐는지 숨김)
                            </label>
                        </div>
                    </div>
                </div>

                <div class="post-form-actions">
                    <a th:href="${mode == 'edit'} ? @{'/posts/' + ${postUuid}} : @{/posts}" class="btn btn-outline-brand">취소</a>
                    <button type="submit" class="btn btn-brand" th:text="${mode == 'edit'} ? '수정 완료' : '작성 완료'">작성 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.__POST_FORM_MODE__ = /*[[${mode}]]*/ 'create';
    /*]]>*/
</script>
<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script th:src="@{/js/rich-editor.js}"></script>
<script th:src="@{/js/post-form.js}"></script>
<script th:src="@{/js/poll-editor.js}"></script>
<script>
    window.__postQuill = initRichEditor({
        editorId: 'postContentEditor',
        hiddenId: 'postContentHidden',
        placeholder: '내용을 입력하세요',
        required: true
    });
</script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
