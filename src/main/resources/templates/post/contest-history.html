<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지난 우승 이력 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('community')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="post-list-header">
            <div class="page-heading post-page-heading">
                <h1><i class="fa-solid fa-clock-rotate-left"></i> 지난 우승 이력</h1>
                <p class="page-sub">매주 월요일 자정 마감된 이번 주 인기 게시글 콘테스트 결과예요</p>
            </div>
            <a href="/posts/contest" class="btn btn-outline-brand"><i class="fa-solid fa-arrow-left"></i> 이번 주로</a>
        </div>

        <div th:if="${weeks.empty}" class="post-list-empty">
            아직 마감된 회차가 없어요.
        </div>

        <div class="contest-week-group" th:each="week : ${weeks}">
            <h2 class="contest-week-title" th:text="${week.weekStart} + ' 주'">2026-01-01 주</h2>
            <div class="contest-entry-list">
                <div class="contest-entry" th:each="result : ${week.results}">
                    <span class="contest-entry-rank" th:text="${result.rank}">1</span>
                    <div class="contest-entry-body">
                        <a th:href="@{'/posts/' + ${result.postUuid}}" class="contest-entry-title" th:text="${result.postTitle}">제목</a>
                        <span class="contest-entry-author" th:text="${result.authorNickname}">작성자</span>
                    </div>
                    <span class="contest-entry-votes" th:text="${result.voteCount} + '표'">0표</span>
                    <span class="contest-entry-prize" th:text="'+' + ${result.prizePoints} + 'P'">+0P</span>
                </div>
            </div>
        </div>

        <div class="post-pagination" th:if="${weeks.totalPages > 1}">
            <a th:if="${weeks.hasPrevious()}" th:href="@{/posts/contest/history(page=${weeks.number - 1})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, weeks.totalPages - 1)}"
               th:href="@{/posts/contest/history(page=${i})}" th:text="${i + 1}"
               th:classappend="${i == weeks.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${weeks.hasNext()}" th:href="@{/posts/contest/history(page=${weeks.number + 1})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

</body>
</html>
