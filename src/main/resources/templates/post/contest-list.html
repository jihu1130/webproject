<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>추천 게시글 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('community')}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="post-list-header">
            <div class="page-heading post-page-heading">
                <h1><i class="fa-solid fa-fire"></i> 추천 게시글</h1>
                <p class="page-sub">매일 자정, 그 전날 추천 1위 게시글 작성자에게 포인트 지급
                    <i class="fa-regular fa-circle-question contest-rule-hint"
                       title="자유 게시판의 전체 공개 글만 추천 대상이에요. 본인 글은 추천할 수 없고, 한 번 추천하면 취소할 수 없어요 - 매일 자정 그 전날 추천을 가장 많이 받은 글 작성자에게 15포인트를 드려요."></i>
                </p>
            </div>
            <div class="post-list-header-actions">
                <a href="/posts/contest/history" class="btn btn-outline-primary"><i class="fa-solid fa-clock-rotate-left"></i> 일별 1위 이력</a>
                <a href="/posts" class="btn btn-outline-primary"><i class="fa-solid fa-arrow-left"></i> 커뮤니티로</a>
            </div>
        </div>

        <div class="contest-period-tabs">
            <a th:href="@{/posts/contest(period='DAILY')}" class="contest-period-tab" th:classappend="${period.name() == 'DAILY'} ? ' active' : ''">일간</a>
            <a th:href="@{/posts/contest(period='WEEKLY')}" class="contest-period-tab" th:classappend="${period.name() == 'WEEKLY'} ? ' active' : ''">이번 주</a>
            <a th:href="@{/posts/contest(period='MONTHLY')}" class="contest-period-tab" th:classappend="${period.name() == 'MONTHLY'} ? ' active' : ''">이번 달</a>
            <a th:href="@{/posts/contest(period='ALL_TIME')}" class="contest-period-tab" th:classappend="${period.name() == 'ALL_TIME'} ? ' active' : ''">전체</a>
        </div>

        <th:block th:if="${ranking.empty}">
            <div th:replace="~{fragments/empty-state :: box('fa-solid fa-fire', '아직 이 기간에 추천받은 글이 없어요. 자유 게시판의 전체 공개 글에 추천을 눌러보세요.', '게시글 둘러보기', '/posts')}"></div>
        </th:block>

        <div class="contest-entry-list">
            <div class="contest-entry" th:each="entry : ${ranking}">
                <span class="contest-entry-rank" th:text="${entry.rank}">1</span>
                <div class="contest-entry-body">
                    <a th:href="@{'/posts/' + ${entry.postUuid}}" class="contest-entry-title" th:text="${entry.postTitle}">제목</a>
                    <span class="contest-entry-author" th:text="${entry.authorNickname}">작성자</span>
                </div>
                <span class="contest-entry-votes" th:text="${entry.recommendCount} + '표'">0표</span>
                <button type="button" class="btn btn-primary contest-vote-btn" th:if="${!entry.mine}"
                        sec:authorize="isAuthenticated()"
                        th:data-post-uuid="${entry.postUuid}" th:disabled="${entry.recommendedByMe}"
                        th:text="${entry.recommendedByMe} ? '추천완료' : '추천하기'">추천하기</button>
                <span th:if="${entry.mine}" class="contest-entry-mine-badge">내 글</span>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/csrf.js}"></script>
<script>
    document.querySelectorAll('.contest-vote-btn[data-post-uuid]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var postUuid = btn.getAttribute('data-post-uuid');
            fetch('/posts/contest/posts/' + postUuid + '/recommend', {
                method: 'POST',
                headers: WebSchoolCsrf.headers()
            }).then(function (res) {
                if (!res.ok) {
                    return res.json().then(function (body) { throw new Error(body.error || '추천에 실패했습니다.'); });
                }
                window.location.reload();
            }).catch(function (err) {
                alert(err.message);
            });
        });
    });
</script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
