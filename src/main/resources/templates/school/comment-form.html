<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${mode == 'edit'} ? '오늘의 한마디 수정 - WebSchool' : '오늘의 한마디 작성 - WebSchool'">오늘의 한마디 작성 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/calendar.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('calendar')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="post-form-card">
            <h2 th:text="${mode == 'edit'} ? '오늘의 한마디 수정' : '오늘의 한마디 작성'">오늘의 한마디 작성</h2>
            <p class="post-content-guide comment-form-context">
                <i class="fa-solid fa-school"></i> <span th:text="${schoolName}">학교</span>
                &nbsp;·&nbsp; <i class="fa-regular fa-calendar"></i> <span th:text="${dateLabel}">날짜</span>
                &nbsp;·&nbsp; <span th:text="${grade} + '학년 ' + ${classNm} + '반'">학년/반</span>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="${mode == 'edit'} ? @{'/school/comments/' + ${commentId} + '/edit'} : @{/school/comments}" method="post">
                <input th:if="${mode != 'edit'}" type="hidden" name="atptCode" th:value="${atptCode}">
                <input th:if="${mode != 'edit'}" type="hidden" name="schoolCode" th:value="${schoolCode}">
                <input th:if="${mode != 'edit'}" type="hidden" name="schoolName" th:value="${schoolName}">
                <input th:if="${mode != 'edit'}" type="hidden" name="date" th:value="${date}">
                <input th:if="${mode != 'edit'}" type="hidden" name="grade" th:value="${grade}">
                <input th:if="${mode != 'edit'}" type="hidden" name="classNm" th:value="${classNm}">

                <div class="post-field">
                    <label>내용</label>
                    <p class="post-content-guide">📎 버튼으로 사진·동영상·파일·링크 카드를 넣을 수 있어요</p>
                    <div id="commentFormEditor" class="rich-editor-container"></div>
                    <input type="hidden" id="commentFormHidden" name="content" th:value="${contentValue}">
                </div>

                <!-- 설문(투표) 첨부 - post/form.html과 동일한 섹션(작성 시에만, 질문이 비어있으면
                     설문 없이 그냥 한마디만 등록된다). -->
                <div class="post-field post-poll-field" th:if="${mode != 'edit'}">
                    <label class="post-poll-toggle">
                        <input type="checkbox" id="pollToggle">
                        <span>설문(투표) 첨부하기</span>
                    </label>
                    <div id="pollFields" class="post-poll-fields" hidden>
                        <input type="text" name="pollQuestion" id="pollQuestion" maxlength="200"
                               placeholder="질문을 입력하세요 (예: 오늘 시간표 어떤가요?)">
                        <div id="pollOptionList" class="post-poll-option-list">
                            <div class="post-poll-option-row">
                                <input type="text" name="pollOptions" class="post-poll-option-input" maxlength="100" placeholder="옵션 1">
                            </div>
                            <div class="post-poll-option-row">
                                <input type="text" name="pollOptions" class="post-poll-option-input" maxlength="100" placeholder="옵션 2">
                            </div>
                        </div>
                        <button type="button" id="pollAddOptionBtn" class="btn btn-outline-primary post-poll-add-btn">+ 옵션 추가</button>

                        <!-- 공개범위는 "누가 볼 수 있는지"를 정하는 중요한 선택이라 세부 설정 안에
                             묻어두지 않고 항상 보이게 뺐다(사용자 요청 - 전체공개를 찾기 번거로웠음). -->
                        <div class="post-poll-scope">
                            <label>결과 공개 범위</label>
                            <label class="post-poll-radio">
                                <input type="radio" name="pollVisibilityScope" value="SAME_CLASS" checked> 같은 학교·학년·반
                            </label>
                            <label class="post-poll-radio">
                                <input type="radio" name="pollVisibilityScope" value="SAME_GRADE"> 같은 학년
                            </label>
                            <label class="post-poll-same-school-only" id="pollSameSchoolOnlyWrap" hidden>
                                <input type="checkbox" name="pollSameSchoolOnly" value="true" checked> 같은 학교 안에서만
                            </label>
                            <label class="post-poll-radio">
                                <input type="radio" name="pollVisibilityScope" value="PUBLIC_LINK"> 전체 공개
                            </label>
                        </div>

                        <!-- static/js/poll-editor.js의 initPollDeadlinePicker() 참고 - post/form.html과
                             동일한 마크업(디스코드/카카오톡 스타일 팝오버, 실제 제출값은 #pollExpiresAt
                             hidden input 하나). -->
                        <div class="post-poll-deadline">
                            <label id="pollDeadlineLabel">마감 기한 (선택)</label>
                            <div class="poll-deadline-picker">
                                <button type="button" id="pollDeadlineTrigger" class="poll-deadline-trigger" aria-haspopup="true" aria-expanded="false">
                                    <i class="fa-regular fa-clock"></i>
                                    <span id="pollDeadlineTriggerText">설정 안 함</span>
                                </button>
                                <div id="pollDeadlinePanel" class="poll-deadline-panel" hidden>
                                    <div class="poll-deadline-presets">
                                        <button type="button" class="poll-deadline-preset" data-preset="1h">1시간 뒤</button>
                                        <button type="button" class="poll-deadline-preset" data-preset="tonight">오늘 자정</button>
                                        <button type="button" class="poll-deadline-preset" data-preset="tomorrow">내일 이 시간</button>
                                        <button type="button" class="poll-deadline-preset" data-preset="1w">1주일 뒤</button>
                                    </div>
                                    <div class="poll-deadline-custom">
                                        <input type="date" id="pollDeadlineDate" aria-label="마감 날짜">
                                        <input type="time" id="pollDeadlineTime" aria-label="마감 시간">
                                    </div>
                                    <div class="poll-deadline-actions">
                                        <button type="button" class="btn btn-outline-primary" id="pollDeadlineClear">설정 안 함</button>
                                        <button type="button" class="btn btn-primary" id="pollDeadlineApply">적용</button>
                                    </div>
                                </div>
                            </div>
                            <input type="hidden" name="pollExpiresAt" id="pollExpiresAt">
                        </div>

                        <button type="button" id="pollAdvancedToggle" class="post-poll-advanced-toggle" aria-expanded="false" aria-controls="pollAdvancedFields">
                            <i class="fa-solid fa-chevron-down"></i> 세부 설정 (복수 선택 · 기타 옵션 · 익명)
                        </button>
                        <div id="pollAdvancedFields" class="post-poll-advanced-fields" hidden>
                            <label class="post-poll-checkbox">
                                <input type="checkbox" name="pollAllowMultiple" value="true"> 복수 선택 허용
                            </label>
                            <label class="post-poll-checkbox">
                                <input type="checkbox" name="pollAllowCustomOption" value="true"> "기타" 직접 추가 허용
                            </label>
                            <label class="post-poll-checkbox">
                                <input type="checkbox" name="pollAnonymous" value="true"> 익명 투표 (누가 뭘 골랐는지 숨김)
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 수정 화면에서 이미 첨부된 설문을 끌 수 있게(요청 사항) - 새 설문을 여기서 만들 수는
                     없고(작성 화면 전용 UI를 그대로 유지), 기존 설문의 질문만 보여주고 삭제 여부만
                     체크박스로 받는다. PollService.deletePollForComment()가 실제 소프트 삭제 처리. -->
                <div class="post-field post-poll-field" th:if="${mode == 'edit'} and ${existingPollQuestion != null}">
                    <label class="post-poll-toggle">
                        <input type="checkbox" name="removePoll" value="true">
                        <span>첨부된 설문 삭제하기 - "<span th:text="${existingPollQuestion}">질문</span>"</span>
                    </label>
                </div>

                <div class="post-form-actions">
                    <a th:href="${cancelUrl}" class="btn btn-outline-primary">취소</a>
                    <button type="submit" class="btn btn-primary" th:text="${mode == 'edit'} ? '수정 완료' : '작성 완료'">작성 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script th:src="@{/js/rich-editor.js}"></script>
<script th:src="@{/js/poll-editor.js}"></script>
<script>
    initRichEditor({
        editorId: 'commentFormEditor',
        hiddenId: 'commentFormHidden',
        placeholder: '이 날에 대한 의견을 남겨보세요',
        required: true,
        // 한마디는 짧은 글이라 글자 크기(px) 지정까지는 필요 없다는 판단으로 이 툴바에서만 제외
        // (게시글 작성 화면은 기본 툴바를 그대로 써서 계속 지원 - rich-editor.js 기본 toolbar 배열과
        // 동일하되 { size: ... } 항목만 뺀 것).
        toolbar: [
            ['bold', 'italic', 'underline', 'strike'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['blockquote', 'link'],
            ['richfile-attach'],
            ['clean']
        ]
    });
</script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
