<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접근 권한 없음 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container admin-container-narrow">
        <div class="admin-empty">
            <i class="fa-solid fa-lock" style="font-size: 1.6rem; margin-bottom: 10px; display: block;"></i>
            <span th:if="${flashError}" th:text="${flashError}">권한이 없어요.</span>
            <span th:unless="${flashError}">아직 이 메뉴에 대한 권한이 없어요.</span><br>
            <!-- 예전엔 권한 4개(신고/게시글/한마디/공지)만 나열했는데 지금은 15개로 늘어서 특정 목록을
                 적지 않는다 - 어떤 권한이 필요한지는 위 flashError(AdminAccessInterceptor 사유)에 나온다. -->
            필요한 관리자 권한을 총관리자에게 요청해주세요.
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
