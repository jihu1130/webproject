<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 출석 관리 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-calendar-check"></i> 출석 관리</h1>
            <p class="page-sub">사용자별 출석체크 현황을 확인해요 - 총 출석일수 / 현재 연속 출석 스트릭 / 최근 출석일</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('attendance')}"></div>

        <div class="list-toolbar" style="margin-top: 12px;">
            <form th:action="@{/admin/attendance}" method="get" class="admin-search-form">
                <input type="text" name="keyword" placeholder="아이디/닉네임 검색" th:value="${keyword}">
                <button type="submit" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>

            <form th:action="@{/admin/attendance}" method="get" class="page-size-select">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <label for="admin-attendance-page-size">페이지당</label>
                <select id="admin-attendance-page-size" name="size" data-auto-submit>
                    <option value="10" th:selected="${summaries.size == 10}">10개</option>
                    <option value="20" th:selected="${summaries.size == 20}">20개</option>
                    <option value="30" th:selected="${summaries.size == 30}">30개</option>
                    <option value="50" th:selected="${summaries.size == 50}">50개</option>
                </select>
            </form>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>아이디</th>
                    <th>닉네임</th>
                    <th>총 출석일수</th>
                    <th>현재 스트릭</th>
                    <th>최근 출석일</th>
                    <th>상세</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="summary : ${summaries}">
                    <td><a th:href="@{'/admin/profiles/' + ${summary.userId}}" class="admin-table-title" th:text="${summary.username}">아이디</a></td>
                    <td><a th:href="@{'/admin/profiles/' + ${summary.userId}}" class="admin-table-title" th:text="${summary.nickname}">닉네임</a></td>
                    <td th:text="${summary.totalCheckIns}">0</td>
                    <td>
                        <span class="admin-status-badge admin-status-cleared" th:if="${summary.currentStreakDay > 0}"
                              th:text="${summary.currentStreakDay} + '일 연속'">N일 연속</span>
                        <span class="admin-status-badge" th:if="${summary.currentStreakDay == 0}">끊김</span>
                    </td>
                    <td th:text="${summary.lastCheckInDate != null ? summary.lastCheckInDate : '출석 기록 없음'}">-</td>
                    <td>
                        <a th:href="@{'/admin/attendance/' + ${summary.userId}}" class="admin-table-title">캘린더 보기</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-empty" th:if="${summaries.empty}">조건에 맞는 사용자가 없어요.</div>

        <div class="post-pagination" th:if="${summaries.totalPages > 1}">
            <a th:if="${summaries.hasPrevious()}" th:href="@{/admin/attendance(page=${summaries.number - 1}, keyword=${keyword}, size=${summaries.size})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, summaries.totalPages - 1)}"
               th:href="@{/admin/attendance(page=${i}, keyword=${keyword}, size=${summaries.size})}" th:text="${i + 1}"
               th:classappend="${i == summaries.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${summaries.hasNext()}" th:href="@{/admin/attendance(page=${summaries.number + 1}, keyword=${keyword}, size=${summaries.size})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
