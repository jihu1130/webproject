<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 에러 로그 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-triangle-exclamation"></i> 에러 로그</h1>
            <p class="page-sub">서버 재시작 전까지 최근 에러(ERROR 레벨) 최대 300건을 메모리에 보관해요 - 총관리자 전용</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('error-log')}"></div>

        <div class="error-log-toolbar">
            <span class="error-log-count" th:text="${#lists.size(entries)} + '건'">0건</span>
            <form th:action="@{/admin/error-log/clear}" method="post"
                  onsubmit="return confirm('메모리에 쌓인 에러 로그를 모두 지울까요? (로그 파일 자체는 지워지지 않아요)');">
                <button type="submit" class="btn btn-outline-primary"><i class="fa-solid fa-broom"></i> 비우기</button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(entries)}" class="admin-empty">기록된 에러가 없어요.</div>

        <div class="error-log-list" th:unless="${#lists.isEmpty(entries)}">
            <div class="error-log-entry" th:each="entry : ${entries}">
                <div class="error-log-meta">
                    <span th:text="${#temporals.format(entry.timestamp, 'MM.dd HH:mm:ss')}">일시</span>
                    <span class="admin-status-badge admin-status-blind" th:text="${entry.level}">ERROR</span>
                    <span class="error-log-logger" th:text="${entry.loggerName}">logger</span>
                </div>
                <p class="error-log-message" th:text="${entry.message}">메시지</p>
                <details th:if="${entry.stackTrace != null}">
                    <summary>스택 트레이스 보기</summary>
                    <pre class="error-log-stack" th:text="${entry.stackTrace}">stack trace</pre>
                </details>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
