<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 대시보드 - WebSchool</title>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-shield-halved"></i> 관리자 대시보드</h1>
            <p class="page-sub">가입자·게시글·신고·문의 현황을 한눈에 봐요 (총관리자 전용)</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('dashboard')}"></div>

        <div class="dash-grid">
            <section class="dash-kpis">
                <div class="dash-kpi">
                    <div class="dash-kpi-label"><i class="fa-solid fa-users"></i> 활성 사용자</div>
                    <div class="dash-kpi-value" th:text="${activeUserCount}">0</div>
                </div>
                <div class="dash-kpi">
                    <div class="dash-kpi-label"><i class="fa-solid fa-file-lines"></i> 전체 게시글</div>
                    <div class="dash-kpi-value" th:text="${totalPostCount}">0</div>
                </div>
                <div class="dash-kpi dash-kpi--danger">
                    <div class="dash-kpi-label"><i class="fa-solid fa-flag"></i> 미해결 신고</div>
                    <div class="dash-kpi-value" th:text="${unresolvedReportCount}">0</div>
                </div>
                <div class="dash-kpi dash-kpi--warn">
                    <div class="dash-kpi-label"><i class="fa-solid fa-comment-dots"></i> 미답변 문의</div>
                    <div class="dash-kpi-value" th:text="${unansweredInquiryCount}">0</div>
                </div>
            </section>

            <section class="dash-card">
                <h2>최근 14일 게시글 작성 추이</h2>
                <div id="dashPostTrendChart" class="dash-chart"
                     role="img" aria-label="최근 14일 동안 하루 평균 게시글 작성 수 추이 차트"></div>
            </section>

            <section class="dash-card">
                <h2>포인트 티어 분포</h2>
                <div id="dashTierChart" class="dash-tier-list"></div>
            </section>

            <!-- 서버 상태(사용자 요청, 2026-09-09) - Actuator/Micrometer에서 직접 읽은 실시간 값
                 (요청마다 새로 조회, 별도 캐시 없음) + 1분 간격으로 쌓은 최근 1시간 추이
                 (ServerMetricsHistoryService). CloudWatch 알람과 같은 임계치(CPU 80%/메모리 85%,
                 AWS.md 7단계 참고)를 넘으면 dash-kpi--warn으로 눈에 띄게 한다. 이 페이지 자체가
                 이미 AdminAccessInterceptor에서 총관리자 전용이지만, 서버 지표는 특히 민감한
                 운영 정보라 화면에서도 한 번 더 명시적으로 총관리자만 보이게 가른다(사용자 요청). -->
            <th:block th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}">
                <h2 class="dash-section-heading">
                    <i class="fa-solid fa-server"></i> 서버 상태 (총관리자 전용)
                    <a href="/admin/loadtest" class="dash-section-heading-link">
                        <i class="fa-solid fa-gauge-high"></i> 부하테스트 결과 보기
                    </a>
                </h2>
                <section class="dash-kpis">
                    <div class="dash-kpi" th:classappend="${serverSnapshot.activeSessionCount()} >= 200 ? 'dash-kpi--warn' : ''">
                        <div class="dash-kpi-label"><i class="fa-solid fa-user-clock"></i> 현재 로그인 세션</div>
                        <div class="dash-kpi-value" th:text="${serverSnapshot.activeSessionCount()}">0</div>
                    </div>
                    <div class="dash-kpi" th:classappend="${serverSnapshot.cpuUsagePercent()} != null and ${serverSnapshot.cpuUsagePercent()} >= 80 ? 'dash-kpi--warn' : ''">
                        <div class="dash-kpi-label"><i class="fa-solid fa-microchip"></i> CPU 사용률</div>
                        <div class="dash-kpi-value">
                            <span th:if="${serverSnapshot.cpuUsagePercent()} != null" th:text="${serverSnapshot.cpuUsagePercent()} + '%'">0%</span>
                            <span th:if="${serverSnapshot.cpuUsagePercent()} == null">-</span>
                        </div>
                    </div>
                    <div class="dash-kpi" th:classappend="${serverSnapshot.heapUsedPercent()} >= 85 ? 'dash-kpi--warn' : ''">
                        <div class="dash-kpi-label"><i class="fa-solid fa-memory"></i> 힙 메모리 사용률</div>
                        <div class="dash-kpi-value" th:text="${serverSnapshot.heapUsedPercent()} + '%'">0%</div>
                        <div class="dash-kpi-sub" th:text="${serverSnapshot.heapUsedMb()} + ' / ' + ${serverSnapshot.heapCommittedMb()} + ' MB'">0 / 0 MB</div>
                    </div>
                    <div class="dash-kpi">
                        <div class="dash-kpi-label"><i class="fa-solid fa-hourglass-half"></i> 서버 가동시간</div>
                        <div class="dash-kpi-value" th:text="${serverSnapshot.uptimeLabel()}">-</div>
                    </div>
                    <div class="dash-kpi">
                        <div class="dash-kpi-label"><i class="fa-solid fa-hard-drive"></i> 디스크 여유공간</div>
                        <div class="dash-kpi-value">
                            <span th:if="${serverSnapshot.diskFreeGb()} != null" th:text="${#numbers.formatDecimal(serverSnapshot.diskFreeGb(), 1, 1)} + ' GB'">0 GB</span>
                            <span th:if="${serverSnapshot.diskFreeGb()} == null">-</span>
                        </div>
                        <div class="dash-kpi-sub" th:if="${serverSnapshot.diskTotalGb()} != null"
                             th:text="'전체 ' + ${#numbers.formatDecimal(serverSnapshot.diskTotalGb(), 1, 1)} + ' GB 중'">전체 0 GB 중</div>
                    </div>
                </section>

                <section class="dash-card">
                    <h2>CPU 사용률 추이 (최근 1시간, 1분 간격)</h2>
                    <div id="dashCpuHistoryChart" class="dash-chart"
                         role="img" aria-label="최근 1시간 동안 1분 간격으로 측정한 CPU 사용률 추이 차트"></div>
                </section>

                <section class="dash-card">
                    <h2>힙 메모리 사용량 추이 (최근 1시간, 1분 간격, MB)</h2>
                    <div id="dashHeapHistoryChart" class="dash-chart"
                         role="img" aria-label="최근 1시간 동안 1분 간격으로 측정한 힙 메모리 사용량 추이 차트"></div>
                </section>
            </th:block>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>

<!-- Chart.js 등 라이브러리를 새로 들이지 않고, 프로젝트 전반의 "순수 Vanilla JS" 관례를 그대로
     따라 SVG를 직접 그린다 - 데이터 포인트가 최대 14개/7개뿐이라 라이브러리 도입은 과함. -->
<script th:inline="javascript">
(function () {
    var trendLabels = /*[[${postTrendLabels}]]*/ [];
    var trendValues = /*[[${postTrendValues}]]*/ [];
    var tierLabels = /*[[${tierLabels}]]*/ [];
    var tierValues = /*[[${tierValues}]]*/ [];

    renderTrendChart(document.getElementById('dashPostTrendChart'), trendLabels, trendValues);
    renderTierChart(document.getElementById('dashTierChart'), tierLabels, tierValues);

    // 서버 상태 추이 차트 - 총관리자가 아니면 dashboard.html에서 이 섹션 자체(th:block)가 안
    // 그려지므로 컨테이너가 없다. renderTrendChart가 이미 !container를 체크하니 그냥 시도해도
    // 안전하지만, 모델 변수도 총관리자가 아닐 땐 아예 안 채워지므로(컨트롤러가 항상 채우긴
    // 하지만) 명시적으로 한 번 더 존재 체크.
    var serverHistoryLabels = /*[[${serverHistoryLabels}]]*/ [];
    var cpuHistoryValues = /*[[${serverCpuHistoryValues}]]*/ [];
    var heapHistoryValues = /*[[${serverHeapHistoryValues}]]*/ [];
    if (document.getElementById('dashCpuHistoryChart')) {
        renderTrendChart(document.getElementById('dashCpuHistoryChart'), serverHistoryLabels, cpuHistoryValues);
        renderTrendChart(document.getElementById('dashHeapHistoryChart'), serverHistoryLabels, heapHistoryValues);
    }

    function renderTrendChart(container, labels, values) {
        if (!container || values.length === 0) return;

        var width = 560, height = 220;
        var padding = { top: 16, right: 12, bottom: 26, left: 8 };
        var plotW = width - padding.left - padding.right;
        var plotH = height - padding.top - padding.bottom;

        var maxValue = Math.max.apply(null, values);
        var niceMax = maxValue === 0 ? 4 : Math.ceil(maxValue * 1.2);
        var stepX = values.length > 1 ? plotW / (values.length - 1) : 0;

        function xAt(i) { return padding.left + stepX * i; }
        function yAt(v) { return padding.top + plotH - (v / niceMax) * plotH; }

        var linePoints = values.map(function (v, i) { return xAt(i) + ',' + yAt(v); }).join(' ');
        var areaPoints = linePoints + ' ' + xAt(values.length - 1) + ',' + (padding.top + plotH)
            + ' ' + xAt(0) + ',' + (padding.top + plotH);

        var gridLines = '';
        var gridSteps = 3;
        for (var g = 0; g <= gridSteps; g++) {
            var gy = padding.top + (plotH / gridSteps) * g;
            gridLines += '<line class="dash-chart-gridline" x1="' + padding.left + '" y1="' + gy
                + '" x2="' + (width - padding.right) + '" y2="' + gy + '"></line>';
        }

        var dots = '';
        var xLabels = '';
        values.forEach(function (v, i) {
            var isLast = i === values.length - 1;
            var cx = xAt(i), cy = yAt(v);
            dots += '<circle class="dash-chart-dot' + (isLast ? ' dash-chart-dot--last' : '') + '" cx="' + cx + '" cy="' + cy + '" r="' + (isLast ? 4 : 3) + '"></circle>';
            if (isLast) {
                dots += '<text class="dash-chart-value-label" x="' + cx + '" y="' + (cy - 10) + '" text-anchor="end">' + v + '</text>';
            }
            // 라벨이 다 있으면 좁은 화면에서 겹치므로 대략 7개만 남게 건너뛰며 표시(마지막은 항상
            // 표시) - 포스트 추이(14개)든 서버 지표 추이(60개)든 같은 함수를 재사용하므로 데이터
            // 길이에 맞춰 step을 계산한다(고정 2칸 간격이면 60개일 때 라벨이 30개나 남아 겹친다).
            var labelStep = Math.max(1, Math.ceil(values.length / 7));
            if (i % labelStep === 0 || isLast) {
                xLabels += '<text class="dash-chart-axis-label" x="' + cx + '" y="' + (height - 6) + '" text-anchor="middle">' + labels[i] + '</text>';
            }
        });

        container.innerHTML =
            '<svg viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="xMidYMid meet">'
            + gridLines
            + '<polygon class="dash-chart-area" points="' + areaPoints + '"></polygon>'
            + '<polyline class="dash-chart-line" points="' + linePoints + '"></polyline>'
            + dots + xLabels
            + '</svg>';
    }

    function renderTierChart(container, labels, values) {
        if (!container) return;
        var maxValue = Math.max.apply(null, values.concat([1]));
        var rows = '';
        labels.forEach(function (label, i) {
            var value = values[i];
            var pct = Math.round((value / maxValue) * 100);
            rows += '<div class="dash-tier-row">'
                + '<span class="dash-tier-name">' + label + '</span>'
                + '<span class="dash-tier-track"><span class="dash-tier-fill" style="width:' + pct + '%"></span></span>'
                + '<span class="dash-tier-count">' + value + '</span>'
                + '</div>';
        });
        container.innerHTML = rows;
    }
})();
</script>
</body>
</html>
