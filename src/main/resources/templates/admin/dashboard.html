<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 대시보드 - WebSchool</title>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-shield-halved"></i> 관리자 대시보드</h1>
            <p class="page-sub">가입자·게시글·신고·문의 현황을 한눈에 봐요 (총관리자 전용)</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('dashboard')}"></div>

        <div class="dash-grid">
            <section class="dash-kpis">
                <div class="dash-kpi">
                    <div class="dash-kpi-label"><i class="fa-solid fa-users"></i> 활성 사용자</div>
                    <div class="dash-kpi-value" th:text="${activeUserCount}">0</div>
                </div>
                <div class="dash-kpi">
                    <div class="dash-kpi-label"><i class="fa-solid fa-file-lines"></i> 전체 게시글</div>
                    <div class="dash-kpi-value" th:text="${totalPostCount}">0</div>
                </div>
                <div class="dash-kpi dash-kpi--danger">
                    <div class="dash-kpi-label"><i class="fa-solid fa-flag"></i> 미해결 신고</div>
                    <div class="dash-kpi-value" th:text="${unresolvedReportCount}">0</div>
                </div>
                <div class="dash-kpi dash-kpi--warn">
                    <div class="dash-kpi-label"><i class="fa-solid fa-comment-dots"></i> 미답변 문의</div>
                    <div class="dash-kpi-value" th:text="${unansweredInquiryCount}">0</div>
                </div>
            </section>

            <section class="dash-card">
                <h2>최근 14일 게시글 작성 추이</h2>
                <div class="dash-chart">
                    <canvas id="dashPostTrendChart"
                            role="img" aria-label="최근 14일 동안 하루 평균 게시글 작성 수 추이 차트"></canvas>
                </div>
            </section>

            <section class="dash-card">
                <h2>포인트 티어 분포</h2>
                <div class="dash-chart">
                    <canvas id="dashTierChart"
                            role="img" aria-label="포인트 티어별 사용자 수 분포 차트"></canvas>
                </div>
            </section>

            <!-- 서버 상태(사용자 요청, 2026-09-09) - Actuator/Micrometer에서 직접 읽은 실시간 값
                 (요청마다 새로 조회, 별도 캐시 없음) + 1분 간격으로 쌓은 최근 1시간 추이
                 (ServerMetricsHistoryService). CloudWatch 알람과 같은 임계치(CPU 80%/메모리 85%,
                 AWS.md 7단계 참고)를 넘으면 dash-kpi--warn으로 눈에 띄게 한다. 이 페이지 자체가
                 이미 AdminAccessInterceptor에서 총관리자 전용이지만, 서버 지표는 특히 민감한
                 운영 정보라 화면에서도 한 번 더 명시적으로 총관리자만 보이게 가른다(사용자 요청). -->
            <th:block th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}">
                <h2 class="dash-section-heading">
                    <i class="fa-solid fa-server"></i> 서버 상태 (총관리자 전용)
                    <a href="/admin/loadtest" class="dash-section-heading-link">
                        <i class="fa-solid fa-gauge-high"></i> 부하테스트 결과 보기
                    </a>
                </h2>
                <section class="dash-kpis">
                    <!-- "현재 로그인 세션" KPI는 제거됨(세션 인증 → JWT 전체 교체, 2026-09-14) -
                         stateless JWT에서는 SessionRegistry 기반 동시 세션 추적 자체가 성립하지
                         않는다(사용자 확정 - 이 기능은 포기). -->
                    <div class="dash-kpi" th:classappend="${serverSnapshot.cpuUsagePercent()} != null and ${serverSnapshot.cpuUsagePercent()} >= 80 ? 'dash-kpi--warn' : ''">
                        <div class="dash-kpi-label"><i class="fa-solid fa-microchip"></i> CPU 사용률</div>
                        <div class="dash-kpi-value">
                            <span th:if="${serverSnapshot.cpuUsagePercent()} != null" th:text="${serverSnapshot.cpuUsagePercent()} + '%'">0%</span>
                            <span th:if="${serverSnapshot.cpuUsagePercent()} == null">-</span>
                        </div>
                    </div>
                    <div class="dash-kpi" th:classappend="${serverSnapshot.heapUsedPercent()} >= 85 ? 'dash-kpi--warn' : ''">
                        <div class="dash-kpi-label"><i class="fa-solid fa-memory"></i> 힙 메모리 사용률</div>
                        <div class="dash-kpi-value" th:text="${serverSnapshot.heapUsedPercent()} + '%'">0%</div>
                        <div class="dash-kpi-sub" th:text="${serverSnapshot.heapUsedMb()} + ' / ' + ${serverSnapshot.heapCommittedMb()} + ' MB'">0 / 0 MB</div>
                    </div>
                    <div class="dash-kpi">
                        <div class="dash-kpi-label"><i class="fa-solid fa-hourglass-half"></i> 서버 가동시간</div>
                        <div class="dash-kpi-value" th:text="${serverSnapshot.uptimeLabel()}">-</div>
                    </div>
                    <div class="dash-kpi">
                        <div class="dash-kpi-label"><i class="fa-solid fa-hard-drive"></i> 디스크 여유공간</div>
                        <div class="dash-kpi-value">
                            <span th:if="${serverSnapshot.diskFreeGb()} != null" th:text="${#numbers.formatDecimal(serverSnapshot.diskFreeGb(), 1, 1)} + ' GB'">0 GB</span>
                            <span th:if="${serverSnapshot.diskFreeGb()} == null">-</span>
                        </div>
                        <div class="dash-kpi-sub" th:if="${serverSnapshot.diskTotalGb()} != null"
                             th:text="'전체 ' + ${#numbers.formatDecimal(serverSnapshot.diskTotalGb(), 1, 1)} + ' GB 중'">전체 0 GB 중</div>
                    </div>
                </section>

                <section class="dash-card">
                    <h2>CPU 사용률 추이 (최근 1시간, 1분 간격)</h2>
                    <div class="dash-chart">
                        <canvas id="dashCpuHistoryChart"
                                role="img" aria-label="최근 1시간 동안 1분 간격으로 측정한 CPU 사용률 추이 차트"></canvas>
                    </div>
                </section>

                <section class="dash-card">
                    <h2>힙 메모리 사용량 추이 (최근 1시간, 1분 간격, MB)</h2>
                    <div class="dash-chart">
                        <canvas id="dashHeapHistoryChart"
                                role="img" aria-label="최근 1시간 동안 1분 간격으로 측정한 힙 메모리 사용량 추이 차트"></canvas>
                    </div>
                </section>
            </th:block>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>

<!-- 그래프는 Chart.js로 그린다(사용자 확정, 2026-09-21 - 기존 "순수 Vanilla SVG" 방침을
     대체). Chart.js는 색을 캔버스에 직접 굳혀 그리므로 var(--brand-1) 같은 CSS 변수와 달리
     다크모드 토글에 저절로 안 따라간다 - dark-mode.js가 쏘는 "themechange" 이벤트를 듣고
     테마 토큰을 다시 읽어 각 차트에 재적용한다. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js" integrity="sha256-/tanOfjQ8GhxdN5s0UdF/A/HgJFEqxE9IpCKJr8Nf+o=" crossorigin="anonymous"></script>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
(function () {
    var trendLabels = /*[[${postTrendLabels}]]*/ [];
    var trendValues = /*[[${postTrendValues}]]*/ [];
    var tierLabels = /*[[${tierLabels}]]*/ [];
    var tierValues = /*[[${tierValues}]]*/ [];
    var serverHistoryLabels = /*[[${serverHistoryLabels}]]*/ [];
    var cpuHistoryValues = /*[[${serverCpuHistoryValues}]]*/ [];
    var heapHistoryValues = /*[[${serverHeapHistoryValues}]]*/ [];

    var charts = [];

    function themeColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

    function renderLineChart(canvasId, labels, values) {
        var canvas = document.getElementById(canvasId);
        if (!canvas || !values || values.length === 0) return;

        var chart = new Chart(canvas, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: values,
                    borderColor: themeColor('--brand-1'),
                    backgroundColor: themeColor('--brand-gradient-tint-2'),
                    pointBackgroundColor: themeColor('--surface'),
                    pointBorderColor: themeColor('--brand-1'),
                    pointBorderWidth: 2,
                    pointRadius: 3,
                    pointHoverRadius: 5,
                    borderWidth: 2,
                    fill: true,
                    tension: 0.35
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: themeColor('--muted'), font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 7 }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: themeColor('--border') },
                        ticks: { color: themeColor('--muted'), font: { size: 10 }, precision: 0 }
                    }
                }
            }
        });
        charts.push(chart);
    }

    function renderTierChart(canvasId, labels, values) {
        var canvas = document.getElementById(canvasId);
        if (!canvas) return;

        var chart = new Chart(canvas, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    data: values,
                    backgroundColor: themeColor('--brand-gradient-tint-2'),
                    hoverBackgroundColor: themeColor('--brand-1'),
                    borderRadius: 6,
                    barThickness: 16
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        beginAtZero: true,
                        grid: { color: themeColor('--border') },
                        ticks: { color: themeColor('--muted'), font: { size: 10 }, precision: 0 }
                    },
                    y: {
                        grid: { display: false },
                        ticks: { color: themeColor('--ink'), font: { size: 11, weight: '600' } }
                    }
                }
            }
        });
        charts.push(chart);
    }

    renderLineChart('dashPostTrendChart', trendLabels, trendValues);
    renderTierChart('dashTierChart', tierLabels, tierValues);

    // 서버 상태 추이 차트 - 총관리자가 아니면 dashboard.html에서 이 섹션 자체(th:block)가 안
    // 그려지므로 캔버스가 없다. renderLineChart가 이미 !canvas를 체크하니 그냥 호출해도
    // 안전하지만, 존재 체크를 한 번 더 명시해 의도를 분명히 한다.
    if (document.getElementById('dashCpuHistoryChart')) {
        renderLineChart('dashCpuHistoryChart', serverHistoryLabels, cpuHistoryValues);
        renderLineChart('dashHeapHistoryChart', serverHistoryLabels, heapHistoryValues);
    }

    document.addEventListener('themechange', function () {
        charts.forEach(function (chart) {
            var ds = chart.data.datasets[0];
            if (chart.config.type === 'bar') {
                ds.backgroundColor = themeColor('--brand-gradient-tint-2');
                ds.hoverBackgroundColor = themeColor('--brand-1');
                chart.options.scales.x.grid.color = themeColor('--border');
                chart.options.scales.x.ticks.color = themeColor('--muted');
                chart.options.scales.y.ticks.color = themeColor('--ink');
            } else {
                ds.borderColor = themeColor('--brand-1');
                ds.backgroundColor = themeColor('--brand-gradient-tint-2');
                ds.pointBackgroundColor = themeColor('--surface');
                ds.pointBorderColor = themeColor('--brand-1');
                chart.options.scales.y.grid.color = themeColor('--border');
                chart.options.scales.y.ticks.color = themeColor('--muted');
                chart.options.scales.x.ticks.color = themeColor('--muted');
            }
            chart.update();
        });
    });
})();
</script>
</body>
</html>
