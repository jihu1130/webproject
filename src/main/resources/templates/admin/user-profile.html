<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.nickname + ' 프로필 - 관리자 - WebSchool'}">계정 프로필 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/profile-card.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container admin-container-narrow">
        <!-- 이 화면은 /admin/users/{id}/profile(계정 관리, 총관리자 전용)과 /admin/profiles/{id}
             (게시글/댓글/한마디 관리 화면에서 작성자 이름 클릭, 권한 있는 부관리자도 가능) 둘 다에서
             재사용된다 - 총관리자가 아니면 "계정 관리로" 링크 자체를 못 쓰므로(총관리자 전용 화면)
             관리자 홈으로 돌아가는 링크를 대신 보여준다. -->
        <th:block th:with="isSuperAdmin=${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'},
                           crumbLabel=${isSuperAdmin ? '계정 관리' : '관리자 홈'},
                           crumbHref=${isSuperAdmin ? '/admin/users' : null}">
            <div th:replace="~{admin/fragments/breadcrumb :: crumb(${crumbLabel}, ${crumbHref})}"></div>
        </th:block>

        <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
           href="/admin/users" class="post-list-back"><i class="fa-solid fa-arrow-left"></i> 계정 관리로</a>
        <a th:unless="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
           href="/admin" class="post-list-back"><i class="fa-solid fa-arrow-left"></i> 관리자 홈으로</a>

        <div class="admin-detail-card">
            <!-- 프로필_디자인.md 설계 반영 - 예전엔 역할(총관리자/부관리자)과 상태(활동중/탈퇴함)가
                 감사 로그와 똑같은 배지(.admin-status-badge)로 뒤섞여 있어서 "이 계정이 누구인지"와
                 "지금 상태가 어떤지"가 한눈에 구분이 안 됐다. 아바타(역할별 테두리색) + 역할 스탬프
                 (명사형, 둥근 알약) + 상태 태그(동사형, 사각형)로 분리한다. -->
            <div class="profile-card-head">
                <div class="profile-card-avatar"
                     th:classappend="(${profile.role == 'ROLE_SUPER_ADMIN'} ? 'profile-card-avatar-super'
                                     : (${profile.role == 'ROLE_ADMIN'} ? 'profile-card-avatar-admin' : 'profile-card-avatar-user'))
                                     + (${profile.equippedEffect == 'SPARKLE'} ? ' avatar-effect-sparkle' : (${profile.equippedEffect == 'RAINBOW'} ? ' avatar-effect-rainbow' : ''))"
                     th:style="${profile.equippedAvatarColor != null} ? 'border-color:' + ${profile.equippedAvatarColor}">
                    <img th:src="@{${profile.profileImageUrl != null} ? ${profile.profileImageUrl} : '/images/default-avatar.svg'}" alt="프로필 사진">
                </div>
                <div class="profile-card-identity">
                    <div class="profile-card-name-row">
                        <h1 class="profile-card-name" th:text="${profile.nickname}">닉네임</h1>
                        <span class="profile-card-stamp profile-card-stamp-super" th:if="${profile.role == 'ROLE_SUPER_ADMIN'}">총관리자</span>
                        <span class="profile-card-stamp profile-card-stamp-admin" th:if="${profile.role == 'ROLE_ADMIN'}">부관리자</span>
                        <span class="profile-card-stamp profile-card-stamp-title" th:if="${profile.equippedTitle != null}"
                              th:text="${profile.equippedTitle}">칭호</span>
                    </div>
                    <p class="profile-card-username" th:text="'아이디: ' + ${profile.username}">아이디</p>
                    <span class="profile-card-status profile-card-status-deleted" th:if="${profile.deleted}" th:text="'탈퇴함 (' + ${profile.deletedAt} + ')'">탈퇴함</span>
                    <span class="profile-card-status profile-card-status-inactive" th:if="${!profile.deleted and !profile.active}">비활성화됨</span>
                    <span class="profile-card-status profile-card-status-active" th:if="${!profile.deleted and profile.active}">활동중</span>
                </div>
            </div>

            <dl class="admin-profile-grid">
                <div class="admin-profile-field">
                    <dt>관심 학교</dt>
                    <dd th:text="${profile.schoolName != null ? profile.schoolName : '-'}">-</dd>
                </div>
                <div class="admin-profile-field">
                    <dt>학교 종류</dt>
                    <dd th:text="${profile.schoolKind != null ? profile.schoolKind : '-'}">-</dd>
                </div>
                <div class="admin-profile-field">
                    <dt>학년 / 반</dt>
                    <dd th:text="(${profile.grade != null ? profile.grade : '-'}) + '학년 ' + (${profile.classNum != null ? profile.classNum : '-'}) + '반'">-</dd>
                </div>
                <div class="admin-profile-field" th:if="${profile.role != 'ROLE_USER'}">
                    <dt>관리자 권한</dt>
                    <dd th:if="${profile.role == 'ROLE_SUPER_ADMIN'}">모든 권한</dd>
                    <dd th:if="${profile.role == 'ROLE_ADMIN'}">
                        <span th:text="${profile.canManageReports} ? '신고관리 O' : '신고관리 X'">-</span> ·
                        <span th:text="${profile.canManagePosts} ? '게시글관리 O' : '게시글관리 X'">-</span> ·
                        <span th:text="${profile.canManageScheduleComments} ? '한마디관리 O' : '한마디관리 X'">-</span> ·
                        <span th:text="${profile.canManageNotices} ? '공지사항관리 O' : '공지사항관리 X'">-</span>
                    </dd>
                </div>
            </dl>

            <div class="admin-profile-stats">
                <a class="admin-profile-stat" href="#recent-posts">
                    <strong th:text="${profile.postCount}">0</strong>
                    <span>작성 게시글</span>
                </a>
                <a class="admin-profile-stat" href="#recent-comments">
                    <strong th:text="${profile.commentCount}">0</strong>
                    <span>작성 댓글</span>
                </a>
            </div>

            <!-- 수정사항.md #11과 세트 - 감사 로그 쪽에서도 관리자 이름을 이 프로필로 연결하는 작업이
                 필요하지만, 이 프로필에서 "이 관리자가 감사 로그에 뭘 남겼는지"로 가는 반대 방향
                 링크도 필요해서 같이 추가한다. 총관리자/부관리자만 의미가 있음(일반 학생은 조치를
                 남길 수 없음). -->
            <a class="profile-card-audit-link" th:if="${profile.role != 'ROLE_USER'}"
               th:href="@{/admin/audit-log(adminUsername=${profile.username})}">
                <i class="fa-solid fa-clock-rotate-left"></i> 감사 로그에서 이 계정의 조치 내역 보기
            </a>
        </div>

        <div class="admin-report-section" th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN' and profile.role != 'ROLE_SUPER_ADMIN'}"
             style="margin-bottom: 20px;">
            <h3 class="post-comment-heading"><i class="fa-solid fa-gavel"></i> 제재 부여</h3>
            <form th:action="@{'/admin/users/' + ${profile.id} + '/penalties'}" method="post" class="admin-penalty-form"
                  data-confirm="이 계정에 제재를 부여할까요?" data-confirm-danger="true">
                <select name="type" required>
                    <option value="WARNING">경고</option>
                    <option value="POST_SUSPENSION">게시글 작성정지</option>
                    <option value="COMMUNITY_SUSPENSION">커뮤니티 임시차단</option>
                    <option value="DEACTIVATION">계정 비활성화</option>
                </select>
                <input type="number" name="durationDays" min="1" placeholder="기간(일) - 비우면 영구, 경고는 무시됨">
                <textarea name="reason" maxlength="300" placeholder="제재 사유를 입력하세요" required></textarea>
                <button type="submit" class="btn btn-outline-primary">제재 부여</button>
            </form>
        </div>

        <div class="admin-report-section" th:if="${!#lists.isEmpty(profile.penalties)}" style="margin-bottom: 20px;">
            <h3 class="post-comment-heading"><i class="fa-solid fa-clock-rotate-left"></i> 제재 내역</h3>
            <div class="admin-report-list">
                <div class="admin-report-item" th:each="p : ${profile.penalties}">
                    <div class="admin-report-item-header">
                        <span class="admin-status-badge"
                              th:classappend="${p.revoked} ? ' admin-status-cleared' : (${p.active} ? ' admin-status-blind' : ' admin-status-pending')"
                              th:text="${p.typeLabel} + (${p.revoked} ? ' · 해제됨' : (${p.active} ? ' · 적용중' : ' · 만료'))">유형</span>
                        <span class="post-comment-time" th:text="${p.issuedAt}">일시</span>
                    </div>
                    <div class="admin-report-reason" th:text="${p.reason}">사유</div>
                    <div class="post-list-meta">
                        <span th:text="${p.expiresAt != null ? (p.expiresAt + '까지') : '영구'}">기간</span>
                        <span th:text="'부여: ' + ${p.issuedByNickname}">관리자</span>
                        <form th:if="${p.active}" th:action="@{'/admin/users/' + ${profile.id} + '/penalties/' + ${p.id} + '/revoke'}"
                              method="post" style="display:inline" data-confirm="제재를 조기 해제할까요?">
                            <button type="submit" class="post-delete-btn">조기 해제</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="admin-report-section" id="recent-posts">
            <h3 class="post-comment-heading"><i class="fa-solid fa-file-lines"></i> 최근 작성 게시글</h3>

            <div th:if="${#lists.isEmpty(profile.recentPosts)}" class="post-comment-empty">작성한 게시글이 없어요.</div>

            <div class="admin-report-list" th:unless="${#lists.isEmpty(profile.recentPosts)}">
                <a class="admin-report-item admin-table-title" style="display: block;" th:each="post : ${profile.recentPosts}"
                   th:href="@{'/admin/posts/' + ${post.id}}">
                    <div class="admin-report-item-header">
                        <span class="post-category-badge" th:text="${post.categoryLabel}">카테고리</span>
                        <span class="post-comment-time" th:text="${post.createdAt}">날짜</span>
                    </div>
                    <div th:text="${post.title}">제목</div>
                </a>
            </div>
        </div>

        <!-- 수정사항.md 지적 - "작성 댓글 N"이라는 통계만 있고 그 목록을 볼 방법이 없었다.
             "최근 작성 게시글" 섹션과 완전히 동일한 구조로 복제, 댓글은 부모 게시글 상세의
             앵커(#comment-{id})로 이동한다(comment-list.html이 이미 쓰는 패턴). -->
        <div class="admin-report-section" id="recent-comments" style="margin-top: 20px;">
            <h3 class="post-comment-heading"><i class="fa-solid fa-comment"></i> 최근 작성 댓글</h3>

            <div th:if="${#lists.isEmpty(profile.recentComments)}" class="post-comment-empty">작성한 댓글이 없어요.</div>

            <div class="admin-report-list" th:unless="${#lists.isEmpty(profile.recentComments)}">
                <a class="admin-report-item admin-table-title" style="display: block;" th:each="comment : ${profile.recentComments}"
                   th:href="@{'/admin/posts/' + ${comment.postId} + '#comment-' + ${comment.id}}">
                    <div class="admin-report-item-header">
                        <span class="post-comment-time" th:text="${comment.createdAt}">날짜</span>
                    </div>
                    <div class="profile-card-comment-preview" th:text="${comment.content}">댓글 내용</div>
                    <div class="profile-card-comment-post" th:text="'글: ' + ${comment.postTitle}">글 제목</div>
                </a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/modal.js}"></script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
