<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${report.title} + ' - 관리자 - WebSchool'">버그 리포트 - 관리자 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container admin-container-narrow">
        <div th:replace="~{admin/fragments/breadcrumb :: crumb('버그 리포트', '/admin/bug-reports')}"></div>

        <div class="post-detail-footer-links">
            <a th:href="@{/admin/bug-reports(page=${listPage}, size=${listSize})}" class="post-list-back">
                <i class="fa-solid fa-arrow-left"></i> 관리자 목록으로
            </a>
        </div>

        <div class="admin-detail-card">
            <span class="admin-status-badge admin-status-cleared" th:if="${report.resolved}">해결됨</span>
            <span class="admin-status-badge" th:unless="${report.resolved}">처리중</span>
            <h1 class="post-detail-title" th:text="${report.title}">제목</h1>

            <div class="post-detail-meta">
                <span><i class="fa-solid fa-user"></i>
                    <a th:if="${report.reporterId != null}" th:href="@{'/admin/profiles/' + ${report.reporterId}}"
                       th:text="${report.reporterDisplay}">제출자</a>
                    <span th:unless="${report.reporterId != null}" th:text="${report.reporterDisplay}">제출자</span>
                </span>
                <span th:if="${report.contactEmail != null}"><i class="fa-solid fa-envelope"></i> <span th:text="${report.contactEmail}">연락처</span></span>
                <span><i class="fa-solid fa-clock"></i> <span th:text="${report.createdAt}">제출일</span></span>
            </div>

            <div class="post-detail-content" th:text="${report.content}">내용</div>

            <div class="admin-bug-report-detail-attachments" th:unless="${#lists.isEmpty(report.attachments)}">
                <a th:each="file : ${report.attachments}" th:href="${file.url}" target="_blank" rel="noopener"
                   class="admin-bug-report-detail-attachment">
                    <img th:if="${file.kind == 'image'}" th:src="${file.url}" th:alt="${file.originalFilename}">
                    <video th:if="${file.kind != 'image'}" th:src="${file.url}" controls></video>
                    <span class="admin-bug-report-detail-filename" th:text="${file.originalFilename}">파일명</span>
                </a>
            </div>

            <div class="post-form-actions" style="margin-top: 1.5rem;">
                <form th:action="@{'/admin/bug-reports/' + ${report.id} + '/resolve'}" method="post">
                    <button type="submit" class="btn btn-outline-brand"
                            th:text="${report.resolved} ? '처리중으로 되돌리기' : '해결됨으로 표시'">처리</button>
                </form>
                <form th:action="@{'/admin/bug-reports/' + ${report.id} + '/delete'}" method="post"
                      data-confirm="이 버그 리포트를 삭제할까요?" data-confirm-danger="true">
                    <button type="submit" class="btn btn-outline-brand" style="color:#dc2626; border-color:#fca5a5;">삭제</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/modal.js}"></script>
</body>
</html>
