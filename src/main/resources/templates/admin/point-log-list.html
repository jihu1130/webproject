<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 포인트 관리 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <th:block th:replace="~{fragments/head :: postStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-coins"></i> 포인트 관리</h1>
            <p class="page-sub">사이트 전체 포인트 적립/소비/조정 로그예요. 특정 사용자 포인트 지급·차감은
                "계정 관리"에서 해당 계정 프로필을 열어 처리해요.</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('points')}"></div>

        <div class="list-toolbar" style="margin-top: 12px;">
            <form th:action="@{/admin/points}" method="get" class="admin-search-form">
                <input type="text" name="keyword" placeholder="아이디/닉네임/사유 검색" th:value="${keyword}">
                <button type="submit" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>

        <div th:if="${logs.empty}" class="admin-empty">기록된 포인트 내역이 없어요.</div>

        <div class="admin-table-wrap" th:unless="${logs.empty}">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>일시</th>
                    <th>계정</th>
                    <th>변동</th>
                    <th>사유</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.createdAt}">날짜</td>
                    <td><a th:href="@{'/admin/profiles/' + ${log.userId}}" class="admin-table-title"
                           th:text="${log.nickname} + ' (' + ${log.username} + ')'">닉네임 (아이디)</a></td>
                    <td>
                        <span class="admin-status-badge admin-status-cleared" th:if="${log.points > 0}"
                              th:text="'+' + ${log.points} + 'P'">+0P</span>
                        <span class="admin-status-badge admin-status-blind" th:if="${log.points < 0}"
                              th:text="${log.points} + 'P'">-0P</span>
                    </td>
                    <td th:text="${log.reason}">사유</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="post-pagination" th:if="${logs.totalPages > 1}">
            <a th:if="${logs.hasPrevious()}" th:href="@{/admin/points(page=${logs.number - 1}, keyword=${keyword})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
               th:href="@{/admin/points(page=${i}, keyword=${keyword})}" th:text="${i + 1}"
               th:classappend="${i == logs.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${logs.hasNext()}" th:href="@{/admin/points(page=${logs.number + 1}, keyword=${keyword})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
