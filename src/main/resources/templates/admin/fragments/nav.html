<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 관리자 4단계 대분류 탭: 1)신고 관리 2)게시글 관리 3)한마디 관리 4)계정 관리 (이 순서 고정).
     총관리자(loginUser.role.name() == 'ROLE_SUPER_ADMIN')는 4개 전부 보이고, 부관리자는 총관리자가
     켜준 권한에 해당하는 탭만 보인다 - 계정 관리는 부관리자에게 항상 숨김(총관리자 전용).
     주의: loginUser는 DTO가 아니라 실제 User 엔티티라 role이 String이 아니라 User.Role enum이다.
     다른 관리자 화면(AdminUserSummaryDto 등)은 서비스 단에서 role을 미리 .name()으로 문자열
     변환해두지만, 여기서는 엔티티를 그대로 쓰므로 반드시 .name()을 붙여 문자열로 비교해야 한다
     (enum과 문자열을 바로 == 비교하면 항상 false로 평가되어 탭이 전부 숨는 버그가 났었음). -->
<nav th:fragment="tabs(active)" class="post-category-tabs">
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageReports)}"
       href="/admin/reports" class="post-category-tab" th:classappend="${active == 'reports'} ? ' active' : ''">1. 신고 관리</a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
       href="/admin/posts" class="post-category-tab" th:classappend="${active == 'posts'} ? ' active' : ''">2. 게시글 관리</a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageScheduleComments)}"
       href="/admin/schedule-comments" class="post-category-tab" th:classappend="${active == 'schedule-comments'} ? ' active' : ''">3. 한마디 관리</a>
    <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
       href="/admin/users" class="post-category-tab" th:classappend="${active == 'users'} ? ' active' : ''">4. 계정 관리</a>
</nav>

</body>
</html>
