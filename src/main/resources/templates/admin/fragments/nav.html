<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 관리자 탭 재편 2차(2026-09-21, 사용자 요청 - "일반 사용자가 할 수 있는 모든 것"을 기준으로
     관리자가 놓친 영역 전수 조사 후 재구성). 1차 재편(같은 날 앞서)에서 5개 그룹으로 나눴던 것에
     "④ 포인트·활동" 그룹을 새로 추가해 6개 그룹이 됐다: 개요 / 콘텐츠 관리 / 신고·모더레이션 /
     포인트·활동 / 계정·권한 / 로그·운영. 총관리자(loginUser.role.name() == 'ROLE_SUPER_ADMIN')는
     전부 보이고, 부관리자는 총관리자가 켜준 권한에 해당하는 탭만 보인다.
     주의: loginUser는 DTO가 아니라 실제 User 엔티티라 role이 String이 아니라 User.Role enum이다.
     다른 관리자 화면(AdminUserSummaryDto 등)은 서비스 단에서 role을 미리 .name()으로 문자열
     변환해두지만, 여기서는 엔티티를 그대로 쓰므로 반드시 .name()을 붙여 문자열로 비교해야 한다
     (enum과 문자열을 바로 == 비교하면 항상 false로 평가되어 탭이 전부 숨는 버그가 났었음).

     - **개요**: 대시보드 + 부하테스트 결과. 특정 관리 기능이 아니라 여러 기능에 걸친 KPI/서버
       상태 개요라 성격이 다르고 둘 다 총관리자 전용(AdminAccessInterceptor 참고).
     - **콘텐츠 관리**: 게시글(설문/추천 게시글은 이 아래 2차 탭, contentSubTabs fragment 참고)/
       댓글/한마디/공지사항 - 전부 "콘텐츠를 만들고 고치는" 화면. 댓글 관리(/admin/comments)는
       게시글에 종속된 하위 리소스라 별도 권한 플래그 없이 게시글 관리(canManagePosts)와 같은
       조건으로 노출한다.
     - **신고·모더레이션**: 신고 관리(canManageReports) - "콘텐츠를 만드는" 것과 "신고된 콘텐츠를
       판정하는" 것은 성격이 달라 콘텐츠 관리에 합치지 않고 독립 그룹으로 둔다(사용자 확정).
     - **포인트·활동**(신규 그룹, 2026-09-21) - 출석체크(`/mypage/attendance*`)·포인트
       획득/소비(`UserPointService`)·상점 구매(`ShopController`)는 사용자 쪽엔 전부 완성돼
       있었는데 관리자가 조회/조정할 화면이 하나도 없었다(전수 조사로 발견). 상점 관리는 원래
       로그·운영 그룹에 있었는데, 이 그룹이 새로 생기면서 성격이 같은 "사용자 활동·재화" 축으로
       재배치했다(1차 재편 때는 로그·운영 유지를 택했었지만, 이번 2차 재편으로 판단이 바뀜):
         - 출석 관리(canManageAttendance, 신규 권한) - 사용자별 출석 현황/스트릭 조회
         - 포인트 관리(canManagePoints, 신규 권한) - 사이트 전체 포인트 로그 감사. 특정 사용자
           포인트 지급/차감 액션 자체는 이 탭이 아니라 계정 관리의 사용자 프로필 화면에 있고,
           AdminAccessInterceptor가 canManageUsers + canManagePoints 둘 다 요구한다(민감한
           액션이라 이중 게이팅).
         - 상점 관리(canManageShop, 기존 카탈로그 CRUD + 이번에 구매 내역 조회 서브탭 추가)
     - **계정·권한**: 계정 관리(canManageUsers)/관리자 권한(canManageAdminPermissions).
     - **로그·운영**: 감사 로그/보안 로그(둘 다 canViewAuditLog)/에러 로그(총관리자 전용)/
       문의 관리(총관리자 전용, 옛 "버그 리포트").
     설문 관리(/admin/polls)·추천 게시글 관리(/admin/post-recommend, 신규)는 최상위 탭이 아니라
     "콘텐츠 관리 > 게시글" 산하 2차 탭이다(아래 contentSubTabs fragment 참고) - 각각
     canManagePolls/canManagePosts로 독립 게이팅. -->
<!-- th:fragment는 nav 태그 하나에만 붙어있으면 그 태그만 잘려서 포함되므로, 스크롤 보정용
     스크립트도 같이 실려 나가도록 th:block으로 둘을 함께 묶는다(예전엔 nav 밖에 있어서 스크립트가
     아예 렌더링되지 않는 채로 조용히 무시되고 있었다). -->
<th:block th:fragment="tabs(active)">
<!-- 수정사항.md/사용자 지적 - 탭이 데스크톱에서도 flex-wrap으로 어중간하게 줄바꿈돼서
     스캔하기 불편했다. 성격이 비슷한 탭끼리 5개 그룹(개요 / 콘텐츠 관리 / 신고·모더레이션 /
     계정·권한 / 로그·운영, 위 주석 참고)으로 묶어 그룹 사이에만 얇은 구분선을 넣는다 - 그룹을
     각자 flex-wrap:nowrap 컨테이너로 감싸서, 화면이 좁아 줄바꿈이 일어나도 그룹 "중간"이 아니라
     그룹 "경계"에서만 끊기게 한다(개별 탭이 낱개로 이 줄 저 줄 흩어지는 대신, 관련 탭끼리는
     항상 붙어 다님). 아이콘을 붙여 각 탭을 더 빠르게 구분할 수 있게 했다. -->
<nav class="post-category-tabs admin-main-tabs">
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canViewDashboard)}"
           href="/admin/dashboard" class="post-category-tab" th:classappend="${active == 'dashboard'} ? ' active' : ''"><i class="fa-solid fa-gauge-high"></i> 대시보드</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canViewLoadTest)}"
           href="/admin/loadtest" class="post-category-tab" th:classappend="${active == 'loadtest'} ? ' active' : ''"><i class="fa-solid fa-bolt"></i> 부하테스트 결과</a>
        <!-- API 문서(Swagger UI) - 총관리자 전용. 부관리자 위임 플래그가 없는 기능이라 대시보드/부하테스트처럼
             canView* 조건을 붙이지 않고 역할만 본다. 이 탭을 숨기는 건 화면 정리일 뿐이고, 실제 차단은
             SecurityConfig의 /swagger-ui/**·/v3/api-docs/** hasRole("SUPER_ADMIN")이 한다. 관리자 화면을
             떠나지 않게 새 탭으로 연다. -->
        <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
           href="/swagger-ui.html" target="_blank" rel="noopener" class="post-category-tab"><i class="fa-solid fa-book"></i> API 문서 <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.7em"></i></a>
    </span>
    <span class="admin-tabs-divider" aria-hidden="true"></span>
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
           href="/admin/posts" class="post-category-tab" th:classappend="${active == 'posts'} ? ' active' : ''"><i class="fa-solid fa-file-lines"></i> 게시글 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
           href="/admin/comments" class="post-category-tab" th:classappend="${active == 'comments'} ? ' active' : ''"><i class="fa-solid fa-comment"></i> 댓글 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageScheduleComments)}"
           href="/admin/schedule-comments" class="post-category-tab" th:classappend="${active == 'schedule-comments'} ? ' active' : ''"><i class="fa-solid fa-message"></i> 한마디 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageNotices)}"
           href="/admin/notices" class="post-category-tab" th:classappend="${active == 'notices'} ? ' active' : ''"><i class="fa-solid fa-bullhorn"></i> 공지사항 관리</a>
    </span>
    <span class="admin-tabs-divider" aria-hidden="true"></span>
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageReports)}"
           href="/admin/reports" class="post-category-tab" th:classappend="${active == 'reports'} ? ' active' : ''"><i class="fa-solid fa-flag"></i> 신고 관리</a>
    </span>
    <span class="admin-tabs-divider" aria-hidden="true"></span>
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageAttendance)}"
           href="/admin/attendance" class="post-category-tab" th:classappend="${active == 'attendance'} ? ' active' : ''"><i class="fa-solid fa-calendar-check"></i> 출석 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePoints)}"
           href="/admin/points" class="post-category-tab" th:classappend="${active == 'points'} ? ' active' : ''"><i class="fa-solid fa-coins"></i> 포인트 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageShop)}"
           href="/admin/shop-items" class="post-category-tab" th:classappend="${active == 'shop-items'} ? ' active' : ''"><i class="fa-solid fa-store"></i> 상점 관리</a>
    </span>
    <span class="admin-tabs-divider" aria-hidden="true"></span>
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageUsers)}"
           href="/admin/users" class="post-category-tab" th:classappend="${active == 'users'} ? ' active' : ''"><i class="fa-solid fa-users"></i> 계정 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageAdminPermissions)}"
           href="/admin/users/admins" class="post-category-tab" th:classappend="${active == 'admins'} ? ' active' : ''"><i class="fa-solid fa-user-shield"></i> 관리자 권한</a>
    </span>
    <span class="admin-tabs-divider" aria-hidden="true"></span>
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canViewAuditLog)}"
           href="/admin/audit-log" class="post-category-tab" th:classappend="${active == 'audit-log'} ? ' active' : ''"><i class="fa-solid fa-clipboard-list"></i> 감사 로그</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canViewAuditLog)}"
           href="/admin/security-log" class="post-category-tab" th:classappend="${active == 'security-log'} ? ' active' : ''"><i class="fa-solid fa-shield-halved"></i> 보안 로그</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canViewErrorLog)}"
           href="/admin/error-log" class="post-category-tab" th:classappend="${active == 'error-log'} ? ' active' : ''"><i class="fa-solid fa-triangle-exclamation"></i> 에러 로그</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageBugReports)}"
           href="/admin/bug-reports" class="post-category-tab" th:classappend="${active == 'bug-reports'} ? ' active' : ''"><i class="fa-solid fa-comment-dots"></i> 문의 관리</a>
    </span>
</nav>

<script th:attr="nonce=${cspNonce}">
    // 모바일 가로 스크롤 탭바(admin.css .admin-main-tabs 참고)에서 현재 탭이 화면 밖에 있으면
    // (예: "8. 감사 로그"가 활성인데 스크롤이 맨 왼쪽인 경우) 자동으로 보이는 위치까지 스크롤한다.
    document.addEventListener('DOMContentLoaded', function () {
        var active = document.querySelector('.admin-main-tabs .post-category-tab.active');
        if (active) {
            active.scrollIntoView({ block: 'nearest', inline: 'center' });
        }
    });
</script>
</th:block>

<!-- "2. 게시글 관리" 산하 2차 탭 - 설문 관리(/admin/polls)가 최상위 탭에서 이 아래로
     옮겨오면서 생김(2026-09-06, 사용자 요청). post-list.html/poll-list.html 둘 다 이
     fragment를 쓰고, 상위 메인 탭(tabs 프래그먼트)에는 항상 'posts'를 active로 넘겨서
     설문 화면에 있어도 "2. 게시글 관리"가 켜져 보이게 한다 - 실제 접근 권한은 여전히
     AdminAccessInterceptor가 canManagePosts/canManagePolls로 각자 독립 검사하므로,
     "설문" 탭 자체도 canManagePolls 없는 사용자에겐 안 보인다. -->
<th:block th:fragment="contentSubTabs(active)">
<div class="post-category-tabs admin-content-subtabs">
    <a href="/admin/posts" class="post-category-tab" th:classappend="${active == 'posts'} ? ' active' : ''">
        <i class="fa-solid fa-file-lines"></i> 게시글
    </a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePolls)}"
       href="/admin/polls" class="post-category-tab" th:classappend="${active == 'polls'} ? ' active' : ''">
        <i class="fa-solid fa-square-poll-vertical"></i> 설문
    </a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
       href="/admin/post-recommend" class="post-category-tab" th:classappend="${active == 'post-recommend'} ? ' active' : ''">
        <i class="fa-solid fa-star"></i> 추천 게시글
    </a>
</div>
</th:block>

</body>
</html>
