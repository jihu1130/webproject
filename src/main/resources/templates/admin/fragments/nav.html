<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 관리자 11단계 대분류 탭: 1)신고 관리 2)게시글 관리 3)댓글 관리 4)한마디 관리 5)공지사항 관리
     6)계정 관리 7)관리자 권한 8)감사 로그 9)문의 관리 10)상점 관리 11)설문 관리 (이 순서 고정). 총관리자(loginUser.role.name() ==
     'ROLE_SUPER_ADMIN')는 전부 보이고, 부관리자는 총관리자가 켜준 권한에 해당하는 탭만 보인다.
     "3. 댓글 관리"(/admin/comments, 2026-08-10(4차) 추가)는 게시글에 종속된 하위 리소스라 별도 권한
     플래그 없이 게시글 관리(canManagePosts)와 같은 조건으로 노출한다(AdminAccessInterceptor도 동일하게
     묶어서 검사). "5. 공지사항 관리"(/admin/notices, todo.md 요구사항 - 예전 Post.Category.NOTICE
     방식을 완전히 대체)는 canManageNotices 권한으로 별도 게이팅한다. "6. 계정 관리"/"7. 관리자 권한"/
     "8. 감사 로그"는 수정사항.md #12 지적으로 예전엔 총관리자 전용으로 하드코딩돼 있었지만, 이제 다른
     탭과 동일하게 canManageUsers/canManageAdminPermissions/canViewAuditLog 플래그로 위임 가능하다.
     "9. 문의 관리"(/admin/bug-reports, 2026-08-24 추가, 옛 "버그 리포트")만 위임 권한 슬롯을 새로 만들지 않고 처음부터
     총관리자 전용으로 고정했다(사용자 확정, 이번 라운드 범위 밖). "10. 상점 관리"(/admin/shop-items,
     todo.md "포인트 소비" 요구사항)는 다른 위임 탭과 동일하게 canManageShop 플래그로 게이팅한다.
     "11. 설문 관리"(/admin/polls, todo.md "설문 후속" 요구사항)는 게시글/한마디 어느 한쪽 권한에도
     종속시키지 않고 canManagePolls 플래그로 별도 게이팅한다(poll 패키지가 post/school 어느 쪽에도
     속하지 않는 것과 같은 이유).
     주의: loginUser는 DTO가 아니라 실제 User 엔티티라 role이 String이 아니라 User.Role enum이다.
     다른 관리자 화면(AdminUserSummaryDto 등)은 서비스 단에서 role을 미리 .name()으로 문자열
     변환해두지만, 여기서는 엔티티를 그대로 쓰므로 반드시 .name()을 붙여 문자열로 비교해야 한다
     (enum과 문자열을 바로 == 비교하면 항상 false로 평가되어 탭이 전부 숨는 버그가 났었음). -->
<!-- th:fragment는 nav 태그 하나에만 붙어있으면 그 태그만 잘려서 포함되므로, 스크롤 보정용
     스크립트도 같이 실려 나가도록 th:block으로 둘을 함께 묶는다(예전엔 nav 밖에 있어서 스크립트가
     아예 렌더링되지 않는 채로 조용히 무시되고 있었다). -->
<th:block th:fragment="tabs(active)">
<!-- 수정사항.md/사용자 지적 - 11개 탭이 데스크톱에서도 flex-wrap으로 8+3처럼 어중간하게
     줄바꿈돼서 스캔하기 불편했다. 순서(주석 상단 "이 순서 고정")는 그대로 두고, 성격이
     비슷한 탭끼리 3개 그룹(콘텐츠 관리 / 계정·권한 / 운영)으로 묶어 그룹 사이에만 얇은
     구분선을 넣는다 - 그룹을 각자 flex-wrap:nowrap 컨테이너로 감싸서, 화면이 좁아 줄바꿈이
     일어나도 그룹 "중간"이 아니라 그룹 "경계"에서만 끊기게 한다(개별 탭이 낱개로 이 줄
     저 줄 흩어지는 대신, 관련 탭끼리는 항상 붙어 다님). 아이콘을 붙여 각 탭을 더 빠르게
     구분할 수 있게 했다. -->
<nav class="post-category-tabs admin-main-tabs">
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageReports)}"
           href="/admin/reports" class="post-category-tab" th:classappend="${active == 'reports'} ? ' active' : ''"><i class="fa-solid fa-flag"></i> 1. 신고 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
           href="/admin/posts" class="post-category-tab" th:classappend="${active == 'posts'} ? ' active' : ''"><i class="fa-solid fa-file-lines"></i> 2. 게시글 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
           href="/admin/comments" class="post-category-tab" th:classappend="${active == 'comments'} ? ' active' : ''"><i class="fa-solid fa-comment"></i> 3. 댓글 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageScheduleComments)}"
           href="/admin/schedule-comments" class="post-category-tab" th:classappend="${active == 'schedule-comments'} ? ' active' : ''"><i class="fa-solid fa-message"></i> 4. 한마디 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageNotices)}"
           href="/admin/notices" class="post-category-tab" th:classappend="${active == 'notices'} ? ' active' : ''"><i class="fa-solid fa-bullhorn"></i> 5. 공지사항 관리</a>
    </span>
    <span class="admin-tabs-divider" aria-hidden="true"></span>
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageUsers)}"
           href="/admin/users" class="post-category-tab" th:classappend="${active == 'users'} ? ' active' : ''"><i class="fa-solid fa-users"></i> 6. 계정 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageAdminPermissions)}"
           href="/admin/users/admins" class="post-category-tab" th:classappend="${active == 'admins'} ? ' active' : ''"><i class="fa-solid fa-user-shield"></i> 7. 관리자 권한</a>
    </span>
    <span class="admin-tabs-divider" aria-hidden="true"></span>
    <span class="admin-tabs-group">
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canViewAuditLog)}"
           href="/admin/audit-log" class="post-category-tab" th:classappend="${active == 'audit-log'} ? ' active' : ''"><i class="fa-solid fa-clipboard-list"></i> 8. 감사 로그</a>
        <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
           href="/admin/bug-reports" class="post-category-tab" th:classappend="${active == 'bug-reports'} ? ' active' : ''"><i class="fa-solid fa-comment-dots"></i> 9. 문의 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageShop)}"
           href="/admin/shop-items" class="post-category-tab" th:classappend="${active == 'shop-items'} ? ' active' : ''"><i class="fa-solid fa-store"></i> 10. 상점 관리</a>
        <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePolls)}"
           href="/admin/polls" class="post-category-tab" th:classappend="${active == 'polls'} ? ' active' : ''"><i class="fa-solid fa-square-poll-vertical"></i> 11. 설문 관리</a>
    </span>
</nav>

<script>
    // 모바일 가로 스크롤 탭바(admin.css .admin-main-tabs 참고)에서 현재 탭이 화면 밖에 있으면
    // (예: "8. 감사 로그"가 활성인데 스크롤이 맨 왼쪽인 경우) 자동으로 보이는 위치까지 스크롤한다.
    document.addEventListener('DOMContentLoaded', function () {
        var active = document.querySelector('.admin-main-tabs .post-category-tab.active');
        if (active) {
            active.scrollIntoView({ block: 'nearest', inline: 'center' });
        }
    });
</script>
</th:block>

</body>
</html>
