<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 관리자 9단계 대분류 탭: 1)신고 관리 2)게시글 관리 3)댓글 관리 4)한마디 관리 5)공지사항 관리
     6)계정 관리 7)관리자 권한 8)감사 로그 9)버그 리포트 (이 순서 고정). 총관리자(loginUser.role.name() ==
     'ROLE_SUPER_ADMIN')는 9개 전부 보이고, 부관리자는 총관리자가 켜준 권한에 해당하는 탭만 보인다 -
     계정 관리/관리자 권한/감사 로그/버그 리포트는 부관리자에게 항상 숨김(총관리자 전용). "3. 댓글 관리"
     (/admin/comments, 2026-08-10(4차) 추가)는 게시글에 종속된 하위 리소스라 별도 권한 플래그 없이
     게시글 관리(canManagePosts)와 같은 조건으로 노출한다(AdminAccessInterceptor도 동일하게 묶어서
     검사). "5. 공지사항 관리"(/admin/notices, todo.md 요구사항 - 예전 Post.Category.NOTICE 방식을
     완전히 대체)는 canManageNotices 권한으로 별도 게이팅한다. "7. 관리자 권한"(/admin/users/admins)은
     예전엔 이 탭 바에 없어서 /admin/users 페이지 안의 링크를 눌러야만 찾을 수 있었다(총관리자 본인도
     못 찾겠다고 지적) - 이제 다른 탭과 동일하게 상단에 항상 노출한다. "8. 감사 로그"
     (/admin/audit-log)는 관리자 조치 이력이 아예 없었다는 감사 지적으로 신설됨. "9. 버그 리포트"
     (/admin/bug-reports, 2026-08-24 추가)는 위임 권한 슬롯을 새로 만들지 않고 계정 관리/감사 로그와
     동일하게 처음부터 총관리자 전용으로 고정했다(사용자 확정).
     주의: loginUser는 DTO가 아니라 실제 User 엔티티라 role이 String이 아니라 User.Role enum이다.
     다른 관리자 화면(AdminUserSummaryDto 등)은 서비스 단에서 role을 미리 .name()으로 문자열
     변환해두지만, 여기서는 엔티티를 그대로 쓰므로 반드시 .name()을 붙여 문자열로 비교해야 한다
     (enum과 문자열을 바로 == 비교하면 항상 false로 평가되어 탭이 전부 숨는 버그가 났었음). -->
<!-- th:fragment는 nav 태그 하나에만 붙어있으면 그 태그만 잘려서 포함되므로, 스크롤 보정용
     스크립트도 같이 실려 나가도록 th:block으로 둘을 함께 묶는다(예전엔 nav 밖에 있어서 스크립트가
     아예 렌더링되지 않는 채로 조용히 무시되고 있었다). -->
<th:block th:fragment="tabs(active)">
<nav class="post-category-tabs admin-main-tabs">
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageReports)}"
       href="/admin/reports" class="post-category-tab" th:classappend="${active == 'reports'} ? ' active' : ''">1. 신고 관리</a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
       href="/admin/posts" class="post-category-tab" th:classappend="${active == 'posts'} ? ' active' : ''">2. 게시글 관리</a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManagePosts)}"
       href="/admin/comments" class="post-category-tab" th:classappend="${active == 'comments'} ? ' active' : ''">3. 댓글 관리</a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageScheduleComments)}"
       href="/admin/schedule-comments" class="post-category-tab" th:classappend="${active == 'schedule-comments'} ? ' active' : ''">4. 한마디 관리</a>
    <a th:if="${loginUser != null and (loginUser.role.name() == 'ROLE_SUPER_ADMIN' or loginUser.canManageNotices)}"
       href="/admin/notices" class="post-category-tab" th:classappend="${active == 'notices'} ? ' active' : ''">5. 공지사항 관리</a>
    <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
       href="/admin/users" class="post-category-tab" th:classappend="${active == 'users'} ? ' active' : ''">6. 계정 관리</a>
    <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
       href="/admin/users/admins" class="post-category-tab" th:classappend="${active == 'admins'} ? ' active' : ''">7. 관리자 권한</a>
    <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
       href="/admin/audit-log" class="post-category-tab" th:classappend="${active == 'audit-log'} ? ' active' : ''">8. 감사 로그</a>
    <a th:if="${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
       href="/admin/bug-reports" class="post-category-tab" th:classappend="${active == 'bug-reports'} ? ' active' : ''">9. 버그 리포트</a>
</nav>

<script>
    // 모바일 가로 스크롤 탭바(admin.css .admin-main-tabs 참고)에서 현재 탭이 화면 밖에 있으면
    // (예: "8. 감사 로그"가 활성인데 스크롤이 맨 왼쪽인 경우) 자동으로 보이는 위치까지 스크롤한다.
    document.addEventListener('DOMContentLoaded', function () {
        var active = document.querySelector('.admin-main-tabs .post-category-tab.active');
        if (active) {
            active.scrollIntoView({ block: 'nearest', inline: 'center' });
        }
    });
</script>
</th:block>

</body>
</html>
