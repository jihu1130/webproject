<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>관리자 - 게시글 관리 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-shield-halved"></i> 관리자 대시보드</h1>
            <p class="page-sub"
               th:text="${viewMode == 'deleted'} ? '작성자·관리자가 삭제한 게시물을 확인하고 복구할 수 있어요' : '전체 게시물을 둘러보고 필요하면 미리 관리할 수 있어요'">설명</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('posts')}"></div>

        <div class="post-category-tabs admin-status-tabs">
            <a th:href="@{/admin/posts}" class="post-category-tab" th:classappend="${viewMode == 'all'} ? ' active' : ''">전체 게시글</a>
            <a th:href="@{/admin/posts(status='deleted')}" class="post-category-tab" th:classappend="${viewMode == 'deleted'} ? ' active' : ''">삭제됨</a>
        </div>

        <div class="list-toolbar">
            <form th:action="@{/admin/posts}" method="get" class="admin-search-form">
                <input type="hidden" name="status" th:value="${viewMode == 'deleted'} ? 'deleted' : ''">
                <input type="text" name="keyword" placeholder="제목/작성자 검색" th:value="${keyword}">
                <button type="submit" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>

            <form th:action="@{/admin/posts}" method="get" class="page-size-select">
                <input type="hidden" name="status" th:value="${viewMode == 'deleted'} ? 'deleted' : ''">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <label for="admin-post-page-size">페이지당</label>
                <select id="admin-post-page-size" name="size" onchange="this.form.submit()">
                    <option value="10" th:selected="${posts.size == 10}">10개</option>
                    <option value="20" th:selected="${posts.size == 20}">20개</option>
                    <option value="30" th:selected="${posts.size == 30}">30개</option>
                    <option value="50" th:selected="${posts.size == 50}">50개</option>
                </select>
            </form>
        </div>

        <div th:if="${posts.empty}" class="admin-empty">
            <span th:if="${viewMode == 'deleted'}">삭제된 게시물이 없어요.</span>
            <span th:if="${viewMode == 'all'}">게시물이 없어요.</span>
        </div>

        <div class="admin-bulk-toolbar" id="bulkToolbar-posts" th:unless="${posts.empty or viewMode == 'deleted'}">
            <span class="admin-bulk-count">0개 선택됨</span>
            <button type="button" class="btn btn-outline-primary" data-bulk-action="/admin/posts/bulk-blind" data-bulk-label="블라인드 처리" disabled>선택 블라인드</button>
            <button type="button" class="post-delete-btn" data-bulk-action="/admin/posts/bulk-delete" data-bulk-label="삭제" data-bulk-danger="true" disabled>선택 삭제</button>
        </div>

        <div class="admin-table-wrap" th:unless="${posts.empty}">
            <table class="admin-table" th:attr="data-bulk-table=${viewMode == 'deleted'} ? null : 'bulkToolbar-posts'">
                <thead>
                <tr>
                    <th class="admin-bulk-check-col" th:unless="${viewMode == 'deleted'}">
                        <input type="checkbox" class="admin-bulk-check-all" aria-label="전체 선택">
                    </th>
                    <th th:unless="${viewMode == 'deleted'}">상태</th>
                    <th>카테고리</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th th:unless="${viewMode == 'deleted'}">신고자 수</th>
                    <th>작성일</th>
                    <th th:if="${viewMode == 'deleted'}">삭제일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="post : ${posts}">
                    <td class="admin-bulk-check-col" th:unless="${viewMode == 'deleted'}">
                        <input type="checkbox" class="admin-bulk-check" th:value="${post.id}" aria-label="선택">
                    </td>
                    <td th:unless="${viewMode == 'deleted'}">
                        <span class="admin-status-badge admin-status-cleared" th:if="${post.reportCleared}">문제없음</span>
                        <span class="admin-status-badge" th:unless="${post.reportCleared}"
                              th:classappend="${post.blind} ? ' admin-status-blind' : (${post.reportCount >= 3} ? ' admin-status-pending' : ' admin-status-cleared')"
                              th:text="${post.blind} ? '블라인드' : (${post.reportCount >= 3} ? '신고누적' : '정상')">상태</span>
                    </td>
                    <td>
                        <span class="post-category-badge" th:classappend="'post-category-badge-' + ${post.category}" th:text="${post.categoryLabel}">자유</span>
                    </td>
                    <td>
                        <a th:href="@{'/admin/posts/' + ${post.id}(status=${viewMode == 'deleted'} ? 'deleted' : null, keyword=${keyword}, page=${posts.number}, size=${posts.size})}"
                           class="admin-table-title" th:text="${post.title}">제목</a>
                        <span class="admin-status-badge admin-status-blind" th:if="${post.reportedCommentCount > 0}"
                              th:text="'댓글 신고 ' + ${post.reportedCommentCount}" title="이 게시물의 댓글 중 신고 누적/블라인드된 댓글이 있어요">댓글 신고</span>
                    </td>
                    <td><a th:href="@{'/admin/profiles/' + ${post.authorId}}" class="admin-table-title" th:text="${post.authorNickname}">작성자</a></td>
                    <td th:unless="${viewMode == 'deleted'}" th:text="${post.reportCount}">0</td>
                    <td th:text="${post.createdAt}">날짜</td>
                    <td th:if="${viewMode == 'deleted'}" th:text="${post.deletedAt}">삭제일</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="post-pagination" th:if="${posts.totalPages > 1}">
            <a th:if="${posts.hasPrevious()}" th:href="@{/admin/posts(page=${posts.number - 1}, status=${viewMode == 'deleted'} ? 'deleted' : null, keyword=${keyword}, size=${posts.size})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
               th:href="@{/admin/posts(page=${i}, status=${viewMode == 'deleted'} ? 'deleted' : null, keyword=${keyword}, size=${posts.size})}" th:text="${i + 1}"
               th:classappend="${i == posts.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${posts.hasNext()}" th:href="@{/admin/posts(page=${posts.number + 1}, status=${viewMode == 'deleted'} ? 'deleted' : null, keyword=${keyword}, size=${posts.size})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/admin-bulk.js}"></script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
