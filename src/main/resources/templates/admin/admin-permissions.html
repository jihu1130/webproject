<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 관리자 권한 관리 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-user-shield"></i> 관리자 권한 관리</h1>
            <p class="page-sub">부관리자마다 신고 / 게시글 / 한마디 / 공지사항 / 계정 관리 / 관리자 권한 부여 / 감사 로그 열람 권한을 개별로 켜고 끌 수 있어요. "관리자 권한 부여"는 다른 계정의 권한 자체를 바꿀 수 있는 민감한 권한이라, 본인 스스로에게는 어떤 권한도 변경할 수 없어요.</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('admins')}"></div>

        <div class="admin-permission-list" th:if="${!#lists.isEmpty(admins)}">
            <div class="admin-permission-row" th:each="admin : ${admins}">
                <div class="admin-permission-row-who">
                    <span class="admin-status-badge admin-status-cleared" th:if="${admin.role == 'ROLE_SUPER_ADMIN'}">총관리자</span>
                    <span class="admin-status-badge admin-status-pending" th:if="${admin.role == 'ROLE_ADMIN'}">부관리자</span>
                    <!-- 수정사항.md 지적 - 권한을 전부 꺼둔 부관리자도 목록에서 다른 부관리자와 구분이
                         안 갔다. 7개 canManage* 전부 false면 "권한 없음" 배지를 따로 표시한다. -->
                    <span class="admin-status-badge admin-status-blind"
                          th:if="${admin.role == 'ROLE_ADMIN' and !admin.canManageReports and !admin.canManagePosts and !admin.canManageScheduleComments and !admin.canManageNotices and !admin.canManageUsers and !admin.canManageAdminPermissions and !admin.canViewAuditLog and !admin.canManageShop and !admin.canManagePolls}">권한 없음</span>
                    <span class="admin-permission-row-name" th:text="${admin.nickname} + ' (' + ${admin.username} + ')'">닉네임 (아이디)</span>
                    <span th:if="${admin.role == 'ROLE_ADMIN' and loginUser != null and loginUser.username == admin.username}"
                          class="admin-user-self-label">(본인 계정 - 권한 변경 불가)</span>
                </div>

                <div class="admin-permission-row-toggles" th:if="${admin.role == 'ROLE_SUPER_ADMIN'}">
                    <span class="admin-user-self-label">모든 권한 보유 (변경 불가)</span>
                </div>

                <!-- 체크박스 하나하나마다 확인창을 띄우던 방식(매번 즉시 제출)이 여러 권한을 한 번에
                     바꾸려 할 때 번거롭다는 지적으로, 원하는 만큼 자유롭게 체크/해제해두고 "저장"을
                     눌러야 한 번에 반영되도록 바꿨다 - "취소"는 폼을 마지막 저장 상태(=페이지 렌더 시
                     th:checked 값)로 되돌리는 표준 reset 버튼이라 별도 JS가 필요 없다. 본인 계정 행은
                     서버에서도 거부되지만(수정사항.md #12의 권한 상승 우려), 여기서부터 아예 폼을 안
                     보여줘서 헷갈리지 않게 한다.
                     버튼(취소/저장/총관리자로 승격)은 이 폼 안에 안 두고 행 끝의 공용
                     .admin-permission-row-actions로 뺐다 - 승격 버튼은 완전히 다른 폼(아래
                     admin-permission-row-promote)에 속하는데, 체크박스 폼 뒤에 별도 블록으로
                     붙이면 체크박스가 줄바꿈될 때 승격 버튼만 항상 다음 줄로 밀려났다(사용자 지적).
                     버튼에 form="..." 속성을 달면 자신을 감싼 <form>이 아니라 그 id를 가진 다른
                     폼에 제출/리셋을 위임할 수 있어서(HTML5 표준 기능), 서로 다른 폼에 속한 버튼
                     3개를 한 줄에 나란히 둘 수 있다. -->
                <form th:if="${admin.role == 'ROLE_ADMIN' and (loginUser == null or loginUser.username != admin.username)}"
                      th:id="'permForm' + ${admin.id}"
                      th:action="@{'/admin/users/' + ${admin.id} + '/permissions'}"
                      method="post" class="admin-permission-row-toggles">
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManageReports" value="true" th:checked="${admin.canManageReports}">
                        <span>신고 관리</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManagePosts" value="true" th:checked="${admin.canManagePosts}">
                        <span>게시글 관리</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManageScheduleComments" value="true" th:checked="${admin.canManageScheduleComments}">
                        <span>한마디 관리</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManageNotices" value="true" th:checked="${admin.canManageNotices}">
                        <span>공지사항 작성</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManageUsers" value="true" th:checked="${admin.canManageUsers}">
                        <span>계정 관리</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManageAdminPermissions" value="true" th:checked="${admin.canManageAdminPermissions}">
                        <span>관리자 권한 부여</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canViewAuditLog" value="true" th:checked="${admin.canViewAuditLog}">
                        <span>감사 로그 열람</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManageShop" value="true" th:checked="${admin.canManageShop}">
                        <span>상점 관리</span>
                    </label>
                    <label class="admin-permission-toggle">
                        <input type="checkbox" name="canManagePolls" value="true" th:checked="${admin.canManagePolls}">
                        <span>설문 관리</span>
                    </label>
                </form>

                <!-- 수정사항.md #13 - 총관리자 단일 장애점 완화. 총관리자 본인만 볼 수 있고(다른
                     화면과 동일하게 loginUser.role로 판단), 이미 부관리자인 계정만 대상으로 한다.
                     버튼은 아래 공용 액션 영역에 있으므로 여기엔 숨겨진 필드(CSRF)만 남는다. -->
                <form th:if="${admin.role == 'ROLE_ADMIN' and loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}"
                      th:id="'promoteForm' + ${admin.id}"
                      th:action="@{'/admin/users/' + ${admin.id} + '/promote-super'}" method="post"
                      hidden
                      data-confirm="이 계정을 총관리자로 승격할까요? 총관리자는 모든 권한을 항상 갖고, 이 화면에서 다시 강등시킬 방법이 없습니다."
                      data-confirm-danger="true">
                </form>

                <div class="admin-permission-row-actions"
                     th:if="${admin.role == 'ROLE_ADMIN' and ((loginUser == null or loginUser.username != admin.username) or (loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'))}"
                     th:with="canEditPerms=${loginUser == null or loginUser.username != admin.username},
                              canPromote=${loginUser != null and loginUser.role.name() == 'ROLE_SUPER_ADMIN'}">
                    <th:block th:if="${canEditPerms}">
                        <button type="reset" th:form="'permForm' + ${admin.id}" class="btn btn-outline-primary">취소</button>
                        <button type="submit" th:form="'permForm' + ${admin.id}" class="btn btn-primary">저장</button>
                    </th:block>
                    <button type="submit" th:if="${canPromote}"
                            th:form="'promoteForm' + ${admin.id}" class="btn btn-outline-primary">총관리자로 승격</button>
                </div>
            </div>
        </div>

        <div class="admin-empty" th:if="${#lists.isEmpty(admins) or #lists.size(admins) <= 1}">
            아직 부관리자가 없어요. "계정 관리"에서 학생 계정을 관리자로 승격해보세요.
        </div>
    </div>
</div>

<script th:src="@{/js/modal.js}"></script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
