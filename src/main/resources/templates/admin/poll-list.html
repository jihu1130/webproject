<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>관리자 - 설문 관리 - WebSchool</title>
        <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-square-poll-vertical"></i> 설문 관리</h1>
            <p class="page-sub"
               th:text="${viewMode == 'deleted'} ? '관리자가 삭제한 설문을 확인하고 복구할 수 있어요' : '게시글/한마디에 첨부된 설문 결과를 모아보고, 스팸/악성 설문은 삭제할 수 있어요'">설명</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('polls')}"></div>

        <div class="post-category-tabs admin-status-tabs">
            <a th:href="@{/admin/polls}" class="post-category-tab" th:classappend="${viewMode == 'all'} ? ' active' : ''">전체</a>
            <a th:href="@{/admin/polls(status='deleted')}" class="post-category-tab" th:classappend="${viewMode == 'deleted'} ? ' active' : ''">삭제됨</a>
        </div>

        <div class="list-toolbar" style="margin-top: 12px;">
            <form th:action="@{/admin/polls}" method="get" class="admin-search-form">
                <input type="hidden" name="status" th:value="${viewMode == 'deleted'} ? 'deleted' : ''">
                <input type="text" name="keyword" placeholder="질문/작성자 검색" th:value="${keyword}">
                <button type="submit" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>

        <div th:if="${polls.empty}" class="admin-empty">
            <span th:if="${viewMode == 'deleted'}">삭제된 설문이 없어요.</span>
            <span th:if="${viewMode == 'all' and keyword != null and !#strings.isEmpty(keyword)}">검색 결과가 없어요.</span>
            <span th:if="${viewMode == 'all' and (keyword == null or #strings.isEmpty(keyword))}">아직 작성된 설문이 없어요.</span>
        </div>

        <div class="admin-table-wrap" th:unless="${polls.empty}">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>질문</th>
                    <th>대상</th>
                    <th>작성자</th>
                    <th>공개범위</th>
                    <th>참여자</th>
                    <th th:unless="${viewMode == 'deleted'}">작성일</th>
                    <th th:if="${viewMode == 'deleted'}">삭제일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="poll : ${polls}">
                    <td>
                        <a th:href="@{'/admin/polls/' + ${poll.id}(status=${viewMode == 'deleted'} ? 'deleted' : null, page=${polls.number}, size=${polls.size}, keyword=${keyword})}"
                           class="admin-table-title" th:text="${poll.question}">질문</a>
                        <span class="admin-status-badge" th:if="${poll.anonymous}" style="margin-left: 6px;">익명</span>
                        <span class="admin-status-badge" th:if="${poll.allowMultiple}" style="margin-left: 6px;">복수선택</span>
                    </td>
                    <td>
                        <span th:text="${poll.targetType}">대상</span>
                        <div class="post-comment-time" th:text="${poll.targetLabel}">라벨</div>
                    </td>
                    <td th:text="${poll.creatorNickname}">작성자</td>
                    <td th:text="${poll.visibilityScopeLabel}">공개범위</td>
                    <td th:text="${poll.totalVoters} + '명 (옵션 ' + ${poll.optionCount} + '개)'">참여자</td>
                    <td th:unless="${viewMode == 'deleted'}" th:text="${poll.createdAt}">작성일</td>
                    <td th:if="${viewMode == 'deleted'}" th:text="${poll.deletedAt}">삭제일</td>
                    <td>
                        <div class="admin-user-actions" th:with="stateStatus=${viewMode == 'deleted'} ? 'deleted' : null">
                            <form th:if="${poll.deleted}" th:action="@{'/admin/polls/' + ${poll.id} + '/restore'}" method="post"
                                  data-confirm="이 설문을 복구할까요?">
                                <div th:replace="~{admin/fragments/list-state :: hidden(${stateStatus}, ${keyword}, ${polls.number}, ${polls.size})}"></div>
                                <button type="submit" class="btn btn-outline-primary">복구</button>
                            </form>
                            <form th:unless="${poll.deleted}" th:action="@{'/admin/polls/' + ${poll.id} + '/delete'}" method="post"
                                  data-confirm="이 설문을 삭제할까요? (소프트 삭제 - 삭제됨 탭에서 다시 복구할 수 있습니다)" data-confirm-danger="true">
                                <div th:replace="~{admin/fragments/list-state :: hidden(${stateStatus}, ${keyword}, ${polls.number}, ${polls.size})}"></div>
                                <button type="submit" class="post-delete-btn">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="post-pagination" th:if="${polls.totalPages > 1}">
            <a th:if="${polls.hasPrevious()}" th:href="@{/admin/polls(page=${polls.number - 1}, status=${viewMode == 'deleted'} ? 'deleted' : null, size=${polls.size}, keyword=${keyword})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, polls.totalPages - 1)}"
               th:href="@{/admin/polls(page=${i}, status=${viewMode == 'deleted'} ? 'deleted' : null, size=${polls.size}, keyword=${keyword})}" th:text="${i + 1}"
               th:classappend="${i == polls.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${polls.hasNext()}" th:href="@{/admin/polls(page=${polls.number + 1}, status=${viewMode == 'deleted'} ? 'deleted' : null, size=${polls.size}, keyword=${keyword})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<th:block th:replace="~{fragments/head :: commonScripts}"></th:block>
</body>
</html>
