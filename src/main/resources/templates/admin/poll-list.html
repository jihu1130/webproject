<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 설문 관리 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<div class="admin-page">
    <div class="admin-container">
        <div class="page-heading admin-page-heading">
            <h1><i class="fa-solid fa-square-poll-vertical"></i> 설문 관리</h1>
            <p class="page-sub">게시글/한마디에 첨부된 설문 결과를 모아볼 수 있어요 - 조회 전용 화면이에요</p>
        </div>

        <div th:replace="~{admin/fragments/nav :: tabs('polls')}"></div>

        <div class="list-toolbar" style="margin-top: 12px;">
            <form th:action="@{/admin/polls}" method="get" class="admin-search-form">
                <input type="text" name="keyword" placeholder="질문/작성자 검색" th:value="${keyword}">
                <button type="submit" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>

        <div th:if="${polls.empty}" class="admin-empty">
            <span th:if="${keyword != null and !#strings.isEmpty(keyword)}">검색 결과가 없어요.</span>
            <span th:unless="${keyword != null and !#strings.isEmpty(keyword)}">아직 작성된 설문이 없어요.</span>
        </div>

        <div class="admin-table-wrap" th:unless="${polls.empty}">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>질문</th>
                    <th>대상</th>
                    <th>작성자</th>
                    <th>공개범위</th>
                    <th>참여자</th>
                    <th>작성일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="poll : ${polls}">
                    <td>
                        <a th:href="@{'/admin/polls/' + ${poll.id}(page=${polls.number}, size=${polls.size}, keyword=${keyword})}"
                           class="admin-table-title" th:text="${poll.question}">질문</a>
                        <span class="admin-status-badge" th:if="${poll.anonymous}" style="margin-left: 6px;">익명</span>
                        <span class="admin-status-badge" th:if="${poll.allowMultiple}" style="margin-left: 6px;">복수선택</span>
                    </td>
                    <td>
                        <span th:text="${poll.targetType}">대상</span>
                        <div class="post-comment-time" th:text="${poll.targetLabel}">라벨</div>
                    </td>
                    <td th:text="${poll.creatorNickname}">작성자</td>
                    <td th:text="${poll.visibilityScopeLabel}">공개범위</td>
                    <td th:text="${poll.totalVoters} + '명 (옵션 ' + ${poll.optionCount} + '개)'">참여자</td>
                    <td th:text="${poll.createdAt}">작성일</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="post-pagination" th:if="${polls.totalPages > 1}">
            <a th:if="${polls.hasPrevious()}" th:href="@{/admin/polls(page=${polls.number - 1}, size=${polls.size}, keyword=${keyword})}" class="post-page-link" aria-label="이전 페이지">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a th:each="i : ${#numbers.sequence(0, polls.totalPages - 1)}"
               th:href="@{/admin/polls(page=${i}, size=${polls.size}, keyword=${keyword})}" th:text="${i + 1}"
               th:classappend="${i == polls.number} ? ' active' : ''"
               class="post-page-link"></a>
            <a th:if="${polls.hasNext()}" th:href="@{/admin/polls(page=${polls.number + 1}, size=${polls.size}, keyword=${keyword})}" class="post-page-link" aria-label="다음 페이지">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

</body>
</html>
