<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${notice.title} + ' - WebSchool'">공지사항 - WebSchool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/post.css}">
    <link rel="stylesheet" th:href="@{/css/notice.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('notices')}"></div>

<div class="post-page">
    <div class="post-container post-container-narrow">
        <div class="post-detail-card">
            <span class="notice-badge" th:if="${notice.active}"><i class="fa-solid fa-thumbtack"></i> 현재 공지</span>
            <h1 class="post-detail-title" th:text="${notice.title}">제목</h1>

            <div class="post-detail-meta">
                <span><i class="fa-solid fa-user"></i> <span th:text="${notice.authorNickname}">작성자</span></span>
                <span><i class="fa-solid fa-clock"></i> <span th:text="${notice.createdAt}">날짜</span></span>
            </div>

            <div class="post-detail-content" th:text="${notice.content}">내용</div>

            <div class="post-detail-footer-links">
                <a href="/notices" class="post-list-back"><i class="fa-solid fa-arrow-left"></i> 목록으로</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
