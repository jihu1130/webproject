# Grafana 대시보드 프로비저닝 - monitoring/dashboards/*.json을 기동 시 자동으로 불러온다.
# 로컬(docker-compose.yml)과 운영(docker-compose.prod.yml) 모두 같은 파일을 마운트한다.
# 화면에서 고친 내용은 재기동 시 JSON 기준으로 되돌아가므로, 대시보드를 바꾸려면 JSON을
# 고쳐서 커밋할 것(allowUiUpdates는 임시 실험용으로만 열어둠).
apiVersion: 1

providers:
  - name: webschool
    folder: webschool
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
